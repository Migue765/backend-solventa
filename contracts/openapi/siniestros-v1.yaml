openapi: 3.1.0
info:
  title: Solventa siniestros y evidencia compartida
  version: 1.0.0
  description: Contrato de cliente. Los BFF autorizan el canal y el servicio conserva SQL y archivos privados.
servers:
  - url: /movil/v1
  - url: /v1
security:
  - bearerAuth: []
paths:
  /siniestros:
    get:
      operationId: listarSiniestros
      responses:
        "200":
          description: Solo siniestros del cliente autenticado
          content:
            application/json:
              schema:
                type: object
                required: [siniestros]
                properties:
                  siniestros:
                    type: array
                    items: {$ref: "#/components/schemas/Siniestro"}
        default: {$ref: "#/components/responses/Problema"}
    post:
      operationId: registrarSiniestro
      description: >
        Persistir UUID y cuerpo antes de enviar. Misma clave, cliente y cuerpo recuperan
        el registro original (200), incluso tras perder el acuse; una nueva operacion
        devuelve 201. Otro cuerpo valido con esa clave produce 409 idempotencia_conflictiva
        sin modificar el original ni su historial. El acuse registrado no es el estado
        vigente: consultarlo en /siniestros/{siniestroId}/estado.
        Un rechazo de negocio con UUID y cuerpo validos fija el resultado de esa clave.
        Repetirlo conserva code, httpStatus y fecha de ultimoResultado; cambiar el cuerpo
        requiere una operacion nueva decidida por el usuario, no una renovacion automatica.
        Autorizacion y fallos 503 no fijan rechazos de negocio.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Registro"}
      responses:
        "201": {$ref: "#/components/responses/Siniestro"}
        "200": {$ref: "#/components/responses/Siniestro"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/polizas:
    get:
      operationId: listarPolizasParaSiniestro
      responses:
        "200":
          description: Polizas vigentes pertenecientes al cliente
          content:
            application/json:
              schema:
                type: object
                required: [polizas]
                properties:
                  polizas:
                    type: array
                    items:
                      type: object
                      required: [id, tipo, fechaInicio, fechaFin, estado]
                      properties:
                        id: {type: string, format: uuid}
                        tipo: {type: string}
                        fechaInicio: {type: string, format: date}
                        fechaFin: {type: string, format: date}
                        estado: {const: vigente}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/configuracion-evidencias:
    get:
      operationId: consultarPoliticaEvidencia
      responses:
        "200":
          description: Politica inicial configurable; no asumir constantes en el cliente
          content:
            application/json:
              schema:
                type: object
                required: [maxCantidad, maxChunkBytes, maxVideoSeconds, formatos]
                properties:
                  maxCantidad: {type: integer, minimum: 1}
                  maxChunkBytes: {type: integer, minimum: 1, maximum: 1048576}
                  maxVideoSeconds: {type: integer, minimum: 1}
                  formatos:
                    type: array
                    items:
                      type: object
                      required: [mimeType, maxBytes]
                      properties:
                        mimeType: {$ref: "#/components/schemas/Mime"}
                        maxBytes: {type: integer, minimum: 1}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
    get:
      operationId: consultarSiniestro
      responses:
        "200": {$ref: "#/components/responses/Siniestro"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/estado:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
    get:
      operationId: consultarEstadoSiniestro
      description: Estado vigente e historial permitido. No sustituye el acuse de registro; tipo es null mientras no exista clasificacion.
      responses:
        "200":
          description: Estado del siniestro autorizado al cliente
          content:
            application/json:
              schema:
                $ref: "bff-web-v1.yaml#/components/schemas/EstadoSiniestro"
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/cargas:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
    post:
      operationId: iniciarCargaEvidencia
      description: >
        La clave es durable por cliente y tipo de operacion. Misma clave y cuerpo
        recuperan la misma carga y su estado actual, incluso si una politica MIME
        posterior impide nuevas cargas. Otro cuerpo valido o siniestro autorizado
        con esa clave produce 409 idempotencia_conflictiva sin sobrescribir.
        No generar otra clave automaticamente ante conflicto. Una carga pendiente
        sigue sujeta a la politica vigente al enviar o confirmar bytes.
        Un rechazo de negocio con UUID, cuerpo y siniestro autorizado conserva su
        resultado para el replay, aunque cambie la cuota o politica. Nuevas escrituras
        requieren integridad del estado e historial central; incoherencia devuelve
        503 siniestro_no_integro sin fijar rechazo final.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InicioCarga"}
      responses:
        "201": {$ref: "#/components/responses/Carga"}
        "200": {$ref: "#/components/responses/Carga"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/cargas/{cargaId}:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
      - {$ref: "#/components/parameters/CargaId"}
    get:
      operationId: reconciliarCargaEvidencia
      description: >
        Consultar tras interrupcion, reinicio o respuesta perdida. offset es el unico
        punto confirmado; puede volver a cero si falta el archivo pendiente.
        ultimoResultado recupera el ultimo rechazo o exito de fase y su fecha original.
        Un rechazo de fase no congela los reintentos de fragmento/confirmacion.
        Una carga confirmada conserva su resultado de confirmacion aunque un intento
        posterior de modificarla sea rechazado.
      responses:
        "200": {$ref: "#/components/responses/Carga"}
        default: {$ref: "#/components/responses/Problema"}
    delete:
      operationId: cancelarCargaEvidencia
      description: Solo pendientes/canceladas. Las confirmadas no se eliminan por esta ruta.
      responses:
        "204": {description: "Carga cancelada, cuota liberada"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/cargas/{cargaId}/contenido:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
      - {$ref: "#/components/parameters/CargaId"}
    put:
      operationId: cargarFragmentoEvidencia
      description: Fragmento raw sin multipart. Content-Length obligatorio. fsync antes de commit SQL. Nunca confirma evidencia. Tras ACK perdido consultar carga, no inventar offset.
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer, minimum: 0}
        - name: Content-Length
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 1048576}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200": {$ref: "#/components/responses/Carga"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/cargas/{cargaId}/confirmacion:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
      - {$ref: "#/components/parameters/CargaId"}
    post:
      operationId: confirmarCargaEvidencia
      description: Sin cuerpo. Idempotente por carga. Verifica tamano, SHA256, formato decodificable y geo consentida. Rechazo de integridad/formato/geo elimina los bytes y reinicia offset a cero; consultar carga antes de reintentar.
      responses:
        "200": {$ref: "#/components/responses/Carga"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/evidencias:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
    get:
      operationId: listarEvidenciasConfirmadas
      responses:
        "200":
          description: Solo evidencia confirmada, nunca cargas parciales
          content:
            application/json:
              schema:
                type: object
                required: [evidencias]
                properties:
                  evidencias:
                    type: array
                    items: {$ref: "#/components/schemas/Evidencia"}
        default: {$ref: "#/components/responses/Problema"}
  /siniestros/{siniestroId}/evidencias/{evidenciaId}/contenido:
    parameters:
      - {$ref: "#/components/parameters/SiniestroId"}
      - name: evidenciaId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: descargarEvidenciaPrivada
      responses:
        "200":
          description: Bytes originales verificados; attachment, no-store y nosniff
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            video/mp4: {schema: {type: string, format: binary}}
        default: {$ref: "#/components/responses/Problema"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        UUID estable de la operacion local, conservado junto con su cuerpo y usuario.
        No es el identificador de correlacion de un intento HTTP. Se deduplica por
        cliente y tipo (registro o inicio de carga); no ordena la cola del dispositivo.
      schema: {type: string, format: uuid}
    SiniestroId:
      name: siniestroId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CargaId:
      name: cargaId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problema:
      description: Error identificable; inexistente y ajeno reciben el mismo 404
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, correlationId]
            properties:
              type: {type: string, format: uri}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              correlationId: {type: string, format: uuid}
              ultimoResultado: {$ref: "#/components/schemas/ResultadoOperacion"}
    Siniestro:
      description: Registro durable del siniestro
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Siniestro"}
    Carga:
      description: Estado durable de la operacion, no equivale a evidencia hasta estado confirmada
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Carga"}
  schemas:
    ResultadoOperacion:
      type: object
      additionalProperties: false
      required: [operacionId, fecha, httpStatus, code]
      description: >
        Resultado persistido de la operacion del cliente. fecha no cambia por replay
        y no es fecha de evento/captura. httpStatus corresponde al resultado original:
        puede ser 201 en un replay HTTP 200. code es null en exito.
        Un conflicto de huella lleva su propio 409 y fecha, sin reemplazar el resultado
        del cuerpo original. Fallos de transporte/SQL y autorizacion no acreditan un
        resultado durable y no incluyen este objeto.
      properties:
        operacionId: {type: string, format: uuid}
        fecha: {type: string, format: date-time}
        httpStatus: {type: integer, minimum: 200, maximum: 499}
        code:
          anyOf:
            - {type: string}
            - {type: "null"}
    Mime:
      type: string
      enum: [image/jpeg, image/png, application/pdf, video/mp4]
    Registro:
      type: object
      additionalProperties: false
      required: [polizaId, fechaEvento, tipoEvento, descripcion, lugar]
      properties:
        polizaId: {type: string, format: uuid}
        fechaEvento: {type: string, format: date-time}
        tipoEvento: {type: string, minLength: 1, maxLength: 100}
        descripcion: {type: string, minLength: 10, maxLength: 5000}
        lugar: {type: string, minLength: 1, maxLength: 300}
    Siniestro:
      type: object
      required: [id, estado, polizaId, fechaEvento, tipoEvento, descripcion, lugar, registradoEn]
      properties:
        id: {type: string, format: uuid}
        estado: {const: registrado}
        polizaId: {type: string, format: uuid}
        fechaEvento: {type: string, format: date-time}
        tipoEvento: {type: string}
        descripcion: {type: string}
        lugar: {type: string}
        registradoEn: {type: string, format: date-time}
        ultimoResultado: {$ref: "#/components/schemas/ResultadoOperacion"}
    Ubicacion:
      type: object
      additionalProperties: false
      required: [consentimiento, latitud, longitud, fecha]
      properties:
        consentimiento: {type: boolean, const: true}
        latitud: {type: number, minimum: -90, maximum: 90}
        longitud: {type: number, minimum: -180, maximum: 180}
        fecha: {type: string, format: date-time}
    InicioCarga:
      type: object
      additionalProperties: false
      required: [mimeType, tamanoBytes, sha256]
      properties:
        mimeType: {$ref: "#/components/schemas/Mime"}
        tamanoBytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        fechaCaptura:
          anyOf:
            - {type: string, format: date-time}
            - {type: "null"}
        ubicacion:
          anyOf:
            - {$ref: "#/components/schemas/Ubicacion"}
            - {type: "null"}
    Carga:
      type: object
      required: [id, siniestroId, estado, offset, tamanoBytes, mimeType, sha256, evidenciaId]
      properties:
        id: {type: string, format: uuid}
        siniestroId: {type: string, format: uuid}
        estado: {type: string, enum: [pendiente, confirmada, cancelada]}
        offset: {type: integer, minimum: 0}
        tamanoBytes: {type: integer, minimum: 1}
        mimeType: {$ref: "#/components/schemas/Mime"}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        evidenciaId:
          anyOf:
            - {type: string, format: uuid}
            - {type: "null"}
        ultimoResultado:
          description: Null solo para cargas canceladas legadas sin fecha atribuible; no se inventa una fecha.
          anyOf:
            - {$ref: "#/components/schemas/ResultadoOperacion"}
            - {type: "null"}
    Evidencia:
      type: object
      required: [id, siniestroId, mimeType, tamanoBytes, sha256, autorId, creadaEn, fechaCaptura, ubicacion]
      properties:
        id: {type: string, format: uuid}
        siniestroId: {type: string, format: uuid}
        mimeType: {$ref: "#/components/schemas/Mime"}
        tamanoBytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        autorId: {type: string, format: uuid}
        creadaEn: {type: string, format: date-time}
        fechaCaptura:
          anyOf:
            - {type: string, format: date-time}
            - {type: "null"}
        ubicacion:
          anyOf:
            - {$ref: "#/components/schemas/Ubicacion"}
            - {type: "null"}
