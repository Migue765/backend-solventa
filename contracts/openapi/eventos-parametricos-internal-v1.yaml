openapi: 3.1.0
info:
  title: Solventa eventos parametricos internos
  version: 1.0.0
  description: >
    Recepcion durable y deduplicada de eventos externos, reglas versionadas, casos
    validos y pagos parametricos simulados, idempotentes y conciliables.
servers:
  - url: /internal/v1
paths:
  /reglas-parametricas:
    post:
      operationId: registrarVersionReglaParametrica
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Regla"}
      responses:
        "201": {$ref: "#/components/responses/ReglaRegistrada"}
        "200": {$ref: "#/components/responses/ReglaRegistrada"}
        default: {$ref: "#/components/responses/Problema"}
  /eventos-parametricos/recepcion:
    post:
      operationId: recibirEventosParametricos
      description: >
        Valida el lote completo. Un identificador repetido con la misma huella se informa
        como duplicado; con otra huella responde 409. Si el lote rebasa la capacidad
        disponible responde 429 y no acepta parcialmente.
      security: [{sourceToken: []}]
      parameters:
        - name: X-Fuente-ID
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventos]
              properties:
                eventos:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: {$ref: "#/components/schemas/Evento"}
      responses:
        "202":
          description: Eventos nuevos persistidos antes del acuse
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [aceptados, duplicados, pendientes]
                properties:
                  aceptados: {type: integer, minimum: 0}
                  duplicados: {type: integer, minimum: 0}
                  pendientes: {type: integer, minimum: 0}
        "429":
          description: Backpressure; el lote no fue aceptado
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problema"}
        default: {$ref: "#/components/responses/Problema"}
  /eventos-parametricos/procesamiento:
    post:
      operationId: procesarEventosParametricos
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Limite"}
      responses:
        "200":
          description: Resultado del lote procesado transaccionalmente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [procesados, casosValidos]
                properties:
                  procesados: {type: integer, minimum: 0}
                  casosValidos: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Problema"}
  /casos-pago-automatico/pendientes:
    post:
      operationId: obtenerCasosPendientesHu31
      description: >
        HU31 puede consultar repetidamente. Cada caso conserva un UUID estable y permanece
        pendiente hasta recibir confirmacion.
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Limite"}
      responses:
        "200":
          description: Casos validos aun no confirmados por HU31
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [casos]
                properties:
                  casos:
                    type: array
                    items: {$ref: "#/components/schemas/CasoHu31"}
        default: {$ref: "#/components/responses/Problema"}
  /casos-pago-automatico/{casoId}/confirmacion:
    put:
      operationId: confirmarCasoRecibidoPorHu31
      security: [{internalToken: []}]
      parameters:
        - name: casoId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entregadoEn]
              properties:
                entregadoEn: {type: string, format: date-time}
      responses:
        "200":
          description: Confirmacion idempotente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [casoId, estado, entregadoEn]
                properties:
                  casoId: {type: string, format: uuid}
                  estado: {const: entregado}
                  entregadoEn: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Problema"}
  /pagos-parametricos/procesamiento:
    post:
      operationId: procesarPagosParametricos
      description: >
        Incorpora casos validos, consulta efectos previos y ejecuta pagos simulados.
        Los reintentos conservan una operacion e intentos durables.
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Limite"}
      responses:
        "200": {$ref: "#/components/responses/LotePagos"}
        default: {$ref: "#/components/responses/Problema"}
  /pagos-parametricos/conciliacion:
    post:
      operationId: conciliarPagosParametricos
      description: >
        Recupera primero cualquier efecto confirmado por el proveedor simulado y
        solo ejecuta cuando no existe un resultado previo.
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Limite"}
      responses:
        "200": {$ref: "#/components/responses/LotePagos"}
        default: {$ref: "#/components/responses/Problema"}
  /pagos-parametricos/casos/{casoId}:
    get:
      operationId: consultarTrazabilidadPagoParametrico
      security: [{internalToken: []}]
      parameters:
        - name: casoId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Pago reconstruido desde caso, evento, regla, siniestro e intentos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PagoParametrico"}
        default: {$ref: "#/components/responses/Problema"}
  /pagos-parametricos/siniestros/{siniestroId}:
    get:
      operationId: consultarPagoParametricoPorSiniestro
      security: [{internalToken: []}]
      parameters:
        - name: siniestroId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Pago asociado al siniestro parametrico con evento, regla e intentos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PagoParametrico"}
        default: {$ref: "#/components/responses/Problema"}
  /notificaciones/publicacion:
    post:
      operationId: publicarNotificacionesSiniestros
      description: >
        Publica en Notificaciones el outbox transaccional de cambios de estado visibles
        al cliente y de pagos parametricos confirmados. Cada evento conserva un eventoId
        determinista, por lo que un reintento no duplica avisos.
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Limite"}
      responses:
        "200":
          description: Resultado del lote de publicacion
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicadas, fallidas]
                properties:
                  publicadas: {type: integer, minimum: 0}
                  fallidas: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Problema"}
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
    sourceToken:
      type: http
      scheme: bearer
  schemas:
    Evento:
      type: object
      additionalProperties: false
      required: [eventoId, ocurridoEn, tipoEvento, ubicacionCodigo, metrica]
      properties:
        eventoId: {type: string, format: uuid}
        ocurridoEn: {type: string, format: date-time}
        tipoEvento: {type: string, minLength: 1, maxLength: 100}
        ubicacionCodigo: {type: string, minLength: 1, maxLength: 100}
        metrica:
          type: object
          additionalProperties: false
          required: [nombre, valor, unidad]
          properties:
            nombre: {type: string, minLength: 1, maxLength: 100}
            valor: {type: number}
            unidad: {type: string, minLength: 1, maxLength: 30}
    Regla:
      type: object
      additionalProperties: false
      required:
        - reglaId
        - version
        - fuente
        - tipoEvento
        - metrica
        - operador
        - umbral
        - unidad
        - clienteId
        - polizaId
        - beneficiarioId
        - montoIndemnizacion
        - moneda
        - vigenteDesde
      properties:
        reglaId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        fuente: {type: string, minLength: 1, maxLength: 100}
        tipoEvento: {type: string, minLength: 1, maxLength: 100}
        metrica: {type: string, minLength: 1, maxLength: 100}
        operador: {enum: [gt, gte, lt, lte, eq]}
        umbral: {type: number}
        unidad: {type: string, minLength: 1, maxLength: 30}
        ubicacionCodigo:
          oneOf:
            - {type: string, minLength: 1, maxLength: 100}
            - {type: "null"}
        clienteId: {type: string, format: uuid}
        polizaId: {type: string, format: uuid}
        beneficiarioId: {type: string, format: uuid}
        montoIndemnizacion:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
        moneda: {type: string, pattern: '^[A-Z]{3}$'}
        vigenteDesde: {type: string, format: date-time}
        vigenteHasta:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    Limite:
      type: object
      additionalProperties: false
      properties:
        limite: {type: integer, minimum: 1, maximum: 5000, default: 5000}
    CasoHu31:
      type: object
      additionalProperties: false
      required:
        - casoId
        - siniestroId
        - clienteId
        - polizaId
        - beneficiarioId
        - indemnizacion
        - fuente
        - eventoId
        - reglaId
        - reglaVersion
        - decididoEn
      properties:
        casoId: {type: string, format: uuid}
        siniestroId: {type: string, format: uuid}
        clienteId: {type: string, format: uuid}
        polizaId: {type: string, format: uuid}
        beneficiarioId: {type: string, format: uuid}
        indemnizacion:
          type: object
          additionalProperties: false
          required: [monto, moneda]
          properties:
            monto: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
            moneda: {type: string, pattern: '^[A-Z]{3}$'}
        fuente: {type: string}
        eventoId: {type: string, format: uuid}
        reglaId: {type: string, format: uuid}
        reglaVersion: {type: integer, minimum: 1}
        decididoEn: {type: string, format: date-time}
    PagoParametrico:
      type: object
      additionalProperties: false
      required:
        - pagoId
        - casoId
        - siniestroId
        - evento
        - regla
        - beneficiarioId
        - indemnizacion
        - estado
        - creadoEn
        - intentos
      properties:
        pagoId: {type: string, format: uuid}
        casoId: {type: string, format: uuid}
        siniestroId: {type: string, format: uuid}
        evento:
          type: object
          additionalProperties: false
          required: [fuente, eventoId, ocurridoEn, recibidoEn]
          properties:
            fuente: {type: string, minLength: 1, maxLength: 100}
            eventoId: {type: string, format: uuid}
            ocurridoEn: {type: string, format: date-time}
            recibidoEn: {type: string, format: date-time}
        regla:
          type: object
          additionalProperties: false
          required: [reglaId, version]
          properties:
            reglaId: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
        beneficiarioId: {type: string, format: uuid}
        indemnizacion:
          type: object
          additionalProperties: false
          required: [monto, moneda]
          properties:
            monto: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
            moneda: {type: string, pattern: '^[A-Z]{3}$'}
        estado: {enum: [pendiente, confirmado, rechazado]}
        creadoEn: {type: string, format: date-time}
        finalizadoEn:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        ultimoError:
          oneOf:
            - {type: string}
            - {type: "null"}
        intentos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [numero, estado, iniciadoEn, finalizadoEn, codigo]
            properties:
              numero: {type: integer, minimum: 1}
              estado: {enum: [en_proceso, ambiguo, confirmado, rechazado]}
              iniciadoEn: {type: string, format: date-time}
              finalizadoEn:
                oneOf:
                  - {type: string, format: date-time}
                  - {type: "null"}
              codigo:
                oneOf:
                  - {type: string}
                  - {type: "null"}
    Problema:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        correlationId: {type: string, format: uuid}
  responses:
    ReglaRegistrada:
      description: Version de regla durable
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reglaId, version, fuente, creadaEn]
            properties:
              reglaId: {type: string, format: uuid}
              version: {type: integer, minimum: 1}
              fuente: {type: string}
              creadaEn: {type: string, format: date-time}
    LotePagos:
      description: Resultado del procesamiento o conciliacion
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [casosIncorporados, confirmados, rechazados, pendientes]
            properties:
              casosIncorporados: {type: integer, minimum: 0}
              confirmados: {type: integer, minimum: 0}
              rechazados: {type: integer, minimum: 0}
              pendientes: {type: integer, minimum: 0}
    Problema:
      description: Rechazo seguro
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problema"}
