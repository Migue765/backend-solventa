openapi: 3.1.0
info:
  title: Solventa asistencias
  version: 1.0.0
  description: Consulta de prestadores y registro móvil de asistencias autorizadas.
security:
  - bearerAuth: []
paths:
  /prestadores/consulta:
    post:
      operationId: consultarPrestadoresCercanos
      tags: [Asistencias]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ubicacion]
              properties:
                ubicacion: {$ref: "#/components/schemas/UbicacionConfirmada"}
                tipoServicio: {type: [string, "null"], minLength: 1, maxLength: 80}
                radioKm: {type: number, exclusiveMinimum: 0, maximum: 100, default: 50}
      responses:
        "200":
          description: Prestadores disponibles ordenados por distancia
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [prestadores]
                properties:
                  prestadores:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, nombre, tipoServicio, distanciaKm]
                      properties:
                        id: {type: string, format: uuid}
                        nombre: {type: string}
                        tipoServicio: {type: string}
                        distanciaKm: {type: number, minimum: 0}
        default: {$ref: "#/components/responses/Problema"}
  /asistencias:
    post:
      operationId: registrarAsistencia
      tags: [Asistencias]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prestadorId, tipoAsistencia, ubicacion]
              oneOf:
                - required: [polizaId]
                  not: {required: [siniestroId]}
                - required: [siniestroId]
                  not: {required: [polizaId]}
              properties:
                prestadorId: {type: string, format: uuid}
                tipoAsistencia: {type: string, minLength: 1, maxLength: 80}
                ubicacion: {$ref: "#/components/schemas/UbicacionConfirmada"}
                polizaId: {type: [string, "null"], format: uuid}
                siniestroId: {type: [string, "null"], format: uuid}
      responses:
        "201": {$ref: "#/components/responses/Asistencia"}
        "200": {$ref: "#/components/responses/Asistencia"}
        default: {$ref: "#/components/responses/Problema"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UbicacionConfirmada:
      type: object
      additionalProperties: false
      required: [latitud, longitud, origen, confirmada, confirmadaEn]
      properties:
        latitud: {type: number, minimum: -90, maximum: 90}
        longitud: {type: number, minimum: -180, maximum: 180}
        origen: {enum: [permiso, manual]}
        confirmada: {const: true}
        confirmadaEn: {type: string, format: date-time}
    Problema:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        correlationId: {type: string, format: uuid}
  responses:
    Asistencia:
      description: Solicitud registrada o recuperada por idempotencia
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, estado, prestadorId, tipoAsistencia, creadaEn]
            properties:
              id: {type: string, format: uuid}
              estado: {const: registrada}
              prestadorId: {type: string, format: uuid}
              tipoAsistencia: {type: string}
              creadaEn: {type: string, format: date-time}
    Problema:
      description: Rechazo seguro
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problema"}
