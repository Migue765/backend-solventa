openapi: 3.1.0
info:
  title: Solventa BFF Móvil
  version: 1.0.0
  description: Contrato público consumido por la aplicación móvil de clientes de Solventa.
servers:
  - url: /movil
tags:
  - name: Usuarios
  - name: Sesiones
  - name: Notificaciones
  - name: Asistencias
  - name: Renovaciones
paths:
  /v1/prestadores/consulta:
    $ref: "./asistencias-v1.yaml#/paths/~1prestadores~1consulta"
  /v1/asistencias:
    $ref: "./asistencias-v1.yaml#/paths/~1asistencias"
  /v1/polizas/{polizaId}/renovacion:
    get:
      tags: [Renovaciones]
      summary: Consulta la elegibilidad y las condiciones de renovacion de una poliza
      operationId: consultarRenovacionPoliza
      description: |
        HU39 (SOL-320). Expone en el canal movil la renovacion central de Polizas (SOL-317);
        el BFF no evalua reglas propias. Requiere un access token de cliente con alcance
        `cliente`; el cliente se deriva del JWT y la operacion no admite query ni cuerpo.
        Si la poliza es renovable devuelve la nueva vigencia contigua, coberturas, prima,
        condiciones y `condicionesHash`, que se deben mostrar antes de la aceptacion.
        `ultimoIntento` permite recuperar un resultado pendiente o rechazado.
        Una poliza inexistente o de otro cliente responde el mismo 404.
      parameters:
        - $ref: "./bff-web-v1.yaml#/components/parameters/PolizaId"
      responses:
        "200":
          description: Elegibilidad y oferta de renovacion
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/ElegibilidadRenovacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: El token no corresponde a un cliente con alcance `cliente`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          $ref: "./bff-web-v1.yaml#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/polizas/{polizaId}/renovaciones:
    post:
      tags: [Renovaciones]
      summary: Confirma la renovacion aceptada y procesa su pago simulado
      operationId: renovarPoliza
      description: |
        HU39 (SOL-320). Delega en la renovacion central de Polizas (SOL-317). Exige
        `aceptaCondiciones: true` y el `condicionesHash` de la oferta consultada; si las
        condiciones cambiaron responde 409 `condiciones_cambiaron`. La nueva vigencia solo
        se registra con el pago confirmado; un pago rechazado conserva la poliza original.
        201 = intento nuevo con resultado definitivo (`renovada` o `rechazada`);
        200 = reintento con la misma Idempotency-Key, sin nuevo cobro;
        202 = pago ambiguo, la renovacion queda `pendiente` con su `id` identificable.
        Repetir con la misma clave recupera el mismo intento y nunca genera un segundo cobro.
        Otra clave para el mismo periodo responde 409 `renovacion_en_curso` con `renovacionId`.
        Un 503 no confirma ni descarta la renovacion: se debe reintentar con la misma clave.
      parameters:
        - $ref: "./bff-web-v1.yaml#/components/parameters/PolizaId"
        - $ref: "./bff-web-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./bff-web-v1.yaml#/components/schemas/SolicitudRenovacion"
      responses:
        "200":
          description: Reintento con la misma clave; devuelve el resultado registrado
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/RenovacionPoliza"
        "201":
          description: Renovacion registrada como renovada o rechazada
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/RenovacionPoliza"
        "202":
          description: Pago ambiguo; la renovacion queda pendiente de conciliacion
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/RenovacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: El token no corresponde a un cliente con alcance `cliente`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          $ref: "./bff-web-v1.yaml#/components/responses/NoEncontrado"
        "409":
          $ref: "./bff-web-v1.yaml#/components/responses/Conflicto"
        "422":
          $ref: "./bff-web-v1.yaml#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/notificaciones:
    $ref: "./notificaciones-v1.yaml#/paths/~1notificaciones"
  /v1/notificaciones/preferencias:
    $ref: "./notificaciones-v1.yaml#/paths/~1notificaciones~1preferencias"
  /v1/siniestros:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros"
  /v1/siniestros/polizas:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1polizas"
  /v1/siniestros/configuracion-evidencias:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1configuracion-evidencias"
  /v1/siniestros/{siniestroId}:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}"
  /v1/siniestros/{siniestroId}/cargas:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}/contenido:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}~1contenido"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}/confirmacion:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}~1confirmacion"
  /v1/siniestros/{siniestroId}/evidencias:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1evidencias"
  /v1/siniestros/{siniestroId}/evidencias/{evidenciaId}/contenido:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1evidencias~1{evidenciaId}~1contenido"
  /v1/biometria/enrolamientos/desafio:
    $ref: "./biometria-v1.yaml#/paths/~1enrolamientos~1desafio"
  /v1/biometria/enrolamientos:
    $ref: "./biometria-v1.yaml#/paths/~1enrolamientos"
  /v1/biometria/desafios:
    $ref: "./biometria-v1.yaml#/paths/~1desafios"
  /v1/biometria/credenciales:
    $ref: "./biometria-v1.yaml#/paths/~1credenciales"
  /v1/biometria/credenciales/{credencialId}:
    $ref: "./biometria-v1.yaml#/paths/~1credenciales~1{credencialId}"
  /v1/sesiones/biometria:
    $ref: "./biometria-v1.yaml#/paths/~1sesiones"
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuario"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/Conflicto"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones:
    post:
      tags: [Sesiones]
      summary: Inicia una sesión de cliente
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "200":
          description: >-
            Sesión creada. El `accessToken` (JWT RS256, 1 hora) se envía como
            `Authorization: Bearer` y el `refreshToken` se usa en `/movil/v1/sesiones/renovar`.
            Ambos se guardan en el almacén seguro del dispositivo (Keychain/Keystore).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/renovar:
    post:
      tags: [Sesiones]
      summary: Renueva la sesión con el refresh token
      description: El refresh token rota en cada uso; el anterior deja de ser válido.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nueva sesión con tokens rotados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/RefreshInvalido"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/actual:
    get:
      tags: [Sesiones]
      summary: Consulta la sesión actual a partir del access token
      operationId: consultarSesion
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    delete:
      tags: [Sesiones]
      summary: Cierra la sesión y revoca el refresh token si se envía
      operationId: cerrarSesion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CierreSesion"
      responses:
        "204":
          description: Sesión cerrada
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por identidad (dura 1 hora).
  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CredencialesInvalidas:
      description: Credenciales inválidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RefreshInvalido:
      description: El refresh token no existe, expiró o ya fue usado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutorizado:
      description: El access token falta, expiró o no es válido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Ya existe una cuenta con ese correo
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Se superó el límite de intentos permitido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UsuarioSesion:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente]
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
    Sesion:
      type: object
      additionalProperties: false
      required: [usuario, expiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [usuario, tokenType, accessToken, refreshToken, expiraEn, refreshExpiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: JWT RS256 de vida corta (1 hora).
        refreshToken:
          type: string
          description: Token opaco de un solo uso que rota en cada renovación.
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token (ahora + expires_in de identidad).
        refreshExpiraEn:
          type: string
          format: date-time
    Renovacion:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 2048
    Problema:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
security:
  - bearerAuth: []
