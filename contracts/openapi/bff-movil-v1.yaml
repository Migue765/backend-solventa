openapi: 3.1.0
info:
  title: Solventa BFF Móvil
  version: 1.0.0
  description: Contrato público consumido por la aplicación móvil de clientes de Solventa.
servers:
  - url: /movil
tags:
  - name: Usuarios
  - name: Sesiones
paths:
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuario"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/Conflicto"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones:
    post:
      tags: [Sesiones]
      summary: Inicia una sesión de cliente
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "200":
          description: >-
            Sesión creada. El `accessToken` (JWT RS256, 1 hora) se envía como
            `Authorization: Bearer` y el `refreshToken` se usa en `/movil/v1/sesiones/renovar`.
            Ambos se guardan en el almacén seguro del dispositivo (Keychain/Keystore).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/renovar:
    post:
      tags: [Sesiones]
      summary: Renueva la sesión con el refresh token
      description: El refresh token rota en cada uso; el anterior deja de ser válido.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nueva sesión con tokens rotados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/RefreshInvalido"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/actual:
    get:
      tags: [Sesiones]
      summary: Consulta la sesión actual a partir del access token
      operationId: consultarSesion
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    delete:
      tags: [Sesiones]
      summary: Cierra la sesión y revoca el refresh token si se envía
      operationId: cerrarSesion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CierreSesion"
      responses:
        "204":
          description: Sesión cerrada
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por identidad (dura 1 hora).
  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CredencialesInvalidas:
      description: Credenciales inválidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RefreshInvalido:
      description: El refresh token no existe, expiró o ya fue usado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutorizado:
      description: El access token falta, expiró o no es válido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Ya existe una cuenta con ese correo
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Se superó el límite de intentos permitido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UsuarioSesion:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente]
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
    Sesion:
      type: object
      additionalProperties: false
      required: [usuario, expiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [usuario, tokenType, accessToken, refreshToken, expiraEn, refreshExpiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: JWT RS256 de vida corta (1 hora).
        refreshToken:
          type: string
          description: Token opaco de un solo uso que rota en cada renovación.
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token (ahora + expires_in de identidad).
        refreshExpiraEn:
          type: string
          format: date-time
    Renovacion:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 2048
    Problema:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
security:
  - bearerAuth: []
