openapi: 3.1.0
info:
  title: Solventa BFF Web
  version: 1.0.0
  description: Contrato público consumido por la aplicación web de clientes de Solventa.
servers:
  - url: /api
tags:
  - name: Usuarios
  - name: Sesiones
  - name: Productos
  - name: Cotizaciones
  - name: Ofertas
  - name: Suscripciones
  - name: Dashboard
paths:
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuario"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/Conflicto"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones:
    post:
      tags: [Sesiones]
      summary: Inicia una sesión de cliente
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "200":
          description: >-
            Sesión creada. El `accessToken` (JWT RS256, 1 hora) se envía como
            `Authorization: Bearer` y el `refreshToken` se usa en `/v1/sesiones/renovar`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/renovar:
    post:
      tags: [Sesiones]
      summary: Renueva la sesión con el refresh token
      description: El refresh token rota en cada uso; el anterior deja de ser válido.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nueva sesión con tokens rotados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/RefreshInvalido"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/actual:
    get:
      tags: [Sesiones]
      summary: Consulta la sesión actual a partir del access token
      operationId: consultarSesion
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    delete:
      tags: [Sesiones]
      summary: Cierra la sesión y revoca el refresh token si se envía
      operationId: cerrarSesion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CierreSesion"
      responses:
        "204":
          description: Sesión cerrada
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/productos-seguro:
    get:
      tags: [Productos]
      summary: Lista los seguros disponibles para cotizar
      operationId: listarProductosSeguro
      responses:
        "200":
          description: Catálogo de seguros
          content:
            application/json:
              schema:
                type: object
                required: [productos]
                properties:
                  productos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductoSeguro"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/destinos-viaje:
    get:
      tags: [Productos]
      summary: Lista los países disponibles para el seguro de viaje
      operationId: listarDestinosViaje
      responses:
        "200":
          description: Catálogo de destinos asegurables
          content:
            application/json:
              schema:
                type: object
                required: [destinos]
                properties:
                  destinos:
                    type: array
                    items:
                      $ref: "#/components/schemas/DestinoViaje"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion:
    post:
      tags: [Cotizaciones]
      summary: Registra una solicitud de cotización
      operationId: crearSolicitudCotizacion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSolicitudCotizacion"
      responses:
        "201":
          description: Solicitud registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCotizacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}:
    get:
      tags: [Cotizaciones]
      summary: Consulta una solicitud de cotización
      operationId: consultarSolicitudCotizacion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCotizacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /v1/solicitudes-cotizacion/{solicitudId}/ofertas:
    get:
      tags: [Ofertas]
      summary: Lista las ofertas calculadas para una solicitud
      operationId: listarOfertas
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Resultado del cálculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoOfertas"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/seleccion:
    get:
      tags: [Ofertas]
      summary: Consulta la oferta seleccionada
      operationId: consultarSeleccionOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Selección vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      tags: [Ofertas]
      summary: Registra o reemplaza la oferta seleccionada
      operationId: seleccionarOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSeleccionOferta"
      responses:
        "200":
          description: Selección registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
  /v1/solicitudes-cotizacion/{solicitudId}/suscripcion:
    get:
      tags: [Suscripciones]
      summary: Consulta la suscripción asociada a una oferta aceptada
      operationId: consultarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Suscripción encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    post:
      tags: [Suscripciones]
      summary: Procesa la suscripción de una oferta aceptada
      operationId: iniciarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Suscripción procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/dashboard:
    get:
      tags: [Dashboard]
      summary: Consulta el resumen del cliente autenticado
      operationId: consultarDashboard
      responses:
        "200":
          description: Resumen del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por identidad (dura 1 hora).
  parameters:
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
        pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CredencialesInvalidas:
      description: Credenciales inválidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RefreshInvalido:
      description: El refresh token no existe, expiró o ya fue usado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutorizado:
      description: El access token falta, expiró o no es válido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoEncontrado:
      description: El recurso no existe o no pertenece al cliente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Conflicto con el estado actual del recurso
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ReglaNegocio:
      description: Una regla de negocio impide la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Se superó el límite de solicitudes permitido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
    UsuarioSesion:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol, tipoDocumento, identificacion, telefono]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente]
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
    Sesion:
      type: object
      additionalProperties: false
      required: [usuario, expiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [usuario, tokenType, accessToken, refreshToken, expiraEn, refreshExpiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: JWT RS256 de vida corta (1 hora). Se guarda solo en memoria.
        refreshToken:
          type: string
          description: Token opaco de un solo uso que rota en cada renovación.
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token (ahora + expires_in de identidad).
        refreshExpiraEn:
          type: string
          format: date-time
    Renovacion:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 2048
    ProductoSeguro:
      type: object
      additionalProperties: false
      required: [id, nombre, descripcion, disponible]
      properties:
        id:
          type: string
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        disponible:
          type: boolean
    DestinoViaje:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          pattern: "^[A-Z]{2}$"
        nombre:
          type: string
          minLength: 1
          maxLength: 120
    NuevaSolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - productoId
        - datosProducto
      properties:
        productoId:
          type: string
          enum:
            - automotive
            - travel
            - life
            - device-protection
            - parametric
            - payment-protection
            - mortgage-life
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
    DatosProducto:
      type: object
      description: |
        Pares string/string específicos del producto. No se aceptan claves adicionales:
        automotive: vehiclePlate (`^[A-Z]{3}[0-9]{3}$`);
        travel: destinationCountryCode (ISO 3166-1 alfa-2), departureDate y returnDate;
        life: birthDate;
        device-protection: deviceType, brandModel y purchaseValue;
        parametric: airline, flightNumber y flightDate;
        payment-protection: creditType y monthlyPayment;
        mortgage-life: birthDate y mortgageBalance.
        Las fechas usan YYYY-MM-DD; los montos, saldos, cuotas y cantidad de viajeros
        son enteros positivos representados como string.
      minProperties: 1
      additionalProperties:
        type: string
    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - id
        - productoId
        - tipoCliente
        - tipoDocumento
        - identificacion
        - datosProducto
        - correo
        - telefono
        - estado
        - creadaEn
      properties:
        id:
          type: string
          pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
        productoId:
          type: string
        tipoCliente:
          type: string
          enum: [persona_natural]
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
        correo:
          type: string
          format: email
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        estado:
          type: string
          enum: [recibida, procesando, calculada, sin_ofertas, fallida]
        creadaEn:
          type: string
          format: date-time
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
          example: COP
    Oferta:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - nombre
        - descripcion
        - primaMensual
        - coberturaPrincipal
        - deducible
        - vigencia
        - responsabilidadCivil
        - coberturas
        - condiciones
        - beneficiosAdicionales
        - recomendada
        - estado
        - vigenteHasta
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        primaMensual:
          $ref: "#/components/schemas/Dinero"
        coberturaPrincipal:
          type: string
          maxLength: 250
        deducible:
          type: string
          maxLength: 120
        vigencia:
          type: string
          maxLength: 120
        responsabilidadCivil:
          type: string
          maxLength: 120
        coberturas:
          type: array
          items:
            type: string
          minItems: 1
        condiciones:
          type: array
          items:
            type: string
          minItems: 1
        beneficiosAdicionales:
          type: array
          items:
            type: string
        recomendada:
          type: boolean
        estado:
          type: string
          enum: [disponible, aceptada, vencida, retirada]
        vigenteHasta:
          type: string
          format: date-time
    ResultadoOfertas:
      type: object
      additionalProperties: false
      required: [solicitudId, calculadaEn, vigenteHasta, tasaAplicada, ofertas]
      properties:
        solicitudId:
          type: string
        calculadaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        tasaAplicada:
          type: string
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/Oferta"
    NuevaSeleccionOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, version]
      properties:
        ofertaId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    SeleccionOferta:
      allOf:
        - $ref: "#/components/schemas/NuevaSeleccionOferta"
        - type: object
          required: [solicitudId, nombreOferta, primaMensual, seleccionadaEn]
          properties:
            solicitudId:
              type: string
            nombreOferta:
              type: string
            primaMensual:
              $ref: "#/components/schemas/Dinero"
            seleccionadaEn:
              type: string
              format: date-time
    Suscripcion:
      type: object
      additionalProperties: false
      required:
        - id
        - solicitudId
        - ofertaId
        - ofertaVersion
        - estado
        - reglaVersion
        - creadaEn
        - actualizadaEn
        - decision
        - saga
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/DecisionSuscripcion"
        saga:
          $ref: "#/components/schemas/SagaEmision"
    DecisionSuscripcion:
      type: object
      additionalProperties: false
      required: [resultado, reglaVersion, hashDecision, decididaEn]
      properties:
        resultado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        hashDecision:
          type: string
          pattern: "^[a-f0-9]{64}$"
        decididaEn:
          type: string
          format: date-time
    SagaEmision:
      type: object
      additionalProperties: false
      required: [estado, version, actualizadaEn]
      properties:
        estado:
          type: string
          enum: [pago_pendiente, pago_confirmado, emitida, fallida]
        version:
          type: integer
          minimum: 1
        actualizadaEn:
          type: string
          format: date-time
    PolizaResumen:
      type: object
      additionalProperties: false
      required: [id, producto, estado]
      properties:
        id:
          type: string
        producto:
          type: string
        estado:
          type: string
          enum: [activa, pendiente, vencida]
        prima:
          $ref: "#/components/schemas/Dinero"
    Notificacion:
      type: object
      additionalProperties: false
      required: [id, titulo, creadaEn, leida]
      properties:
        id:
          type: string
        titulo:
          type: string
        creadaEn:
          type: string
          format: date-time
        leida:
          type: boolean
    Dashboard:
      type: object
      additionalProperties: false
      required: [polizas, notificaciones]
      properties:
        proximoViaje:
          type:
            - string
            - "null"
        polizas:
          type: array
          items:
            $ref: "#/components/schemas/PolizaResumen"
        notificaciones:
          type: array
          items:
            $ref: "#/components/schemas/Notificacion"
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, mensaje]
      properties:
        campo:
          type: string
        mensaje:
          type: string
    Problema:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorCampo"
security:
  - bearerAuth: []
