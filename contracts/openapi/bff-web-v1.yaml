openapi: 3.1.0
info:
  title: Solventa BFF Web
  version: 1.0.0
  description: Contrato público consumido por la aplicación web de clientes de Solventa.
servers:
  - url: /api
tags:
  - name: Usuarios
  - name: Sesiones
  - name: Consentimientos
  - name: Productos
  - name: Cotizaciones
  - name: Ofertas
  - name: Suscripciones
  - name: Dashboard
  - name: Asesores
  - name: Socios
paths:
  /v1/socios/actual:
    get:
      tags: [Socios]
      operationId: consultarContextoSocio
      summary: Consulta organizaciones y productos de la cuenta socio
      description: Requiere rol y scope socio y organizaciones activas en el JWT.
      responses:
        "200":
          description: Contexto autorizado; no expone catalogo global de clientes
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, usuario, socios, alcances]
                properties:
                  apiVersion:
                    const: "1"
                  usuario:
                    $ref: "#/components/schemas/UsuarioSesion"
                  socios:
                    type: array
                    items:
                      type: object
                      required: [socioId, productos]
                      properties:
                        socioId:
                          type: string
                        productos:
                          type: array
                          description: Vida hipotecaria es el único producto habilitado para socios.
                          items:
                            const: mortgage-life
                  alcances:
                    type: array
                    items:
                      enum: ["perfilamientos:crear", "clientes:consultar"]
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente; cliente y asesor no son socios
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/consultas-informacion-cliente:
    post:
      tags: [Socios]
      operationId: consultarInformacionCliente
      summary: Consulta información mínima autorizada de un cliente
      description: >-
        Requiere JWT de socio, socioId autorizado y consentimiento vigente del
        cliente para el producto, finalidad, fuentes y datos solicitados.
        operationId debe coincidir con Idempotency-Key. Un reintento idéntico
        devuelve la consulta persistida. Si falla una fuente autorizada, la
        operación falla sin devolver ni persistir datos parciales.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaInformacionCliente"
      responses:
        "201":
          description: Consulta autorizada, minimizada y auditada por fuente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformacionClienteAutorizada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio, producto, finalidad o consentimiento no autorizado
        "404":
          description: cliente_no_encontrado
        "409":
          description: idempotencia_conflicto
        "503":
          description: Dependencia o fuente no disponible; no contiene datos parciales
  /v1/socios/clientes/por-documento:
    get:
      tags: [Socios]
      operationId: buscarClienteSocioPorDocumento
      summary: Identifica al cliente y muestra solo el estado util de su consentimiento
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: socioId
          in: query
          required: true
          schema:
            type: string
        - name: tipoDocumento
          in: query
          required: true
          schema:
            type: string
            enum: [cc, ce, passport, ppt]
        - name: numeroDocumento
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cliente identificado sin exponer UUID ni version de consentimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - nombre
                  - tipoDocumento
                  - numeroDocumentoEnmascarado
                  - consentimientoEstado
                properties:
                  nombre:
                    type: string
                  tipoDocumento:
                    type: string
                    enum: [cc, ce, passport, ppt]
                  numeroDocumentoEnmascarado:
                    type: string
                  consentimientoEstado:
                    type: string
                    enum: [vigente, vencido, revocado, rechazado, ausente]
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado
        "404":
          description: cliente_no_encontrado
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/solicitudes-cotizacion:
    post:
      tags: [Socios]
      operationId: iniciarSolicitudSocio
      summary: Perfila y cotiza un producto del catalogo para el cliente autorizado
      description: >-
        Requiere rol y scope socio y socioId presente en el JWT. operationId debe
        coincidir con Idempotency-Key y ser globalmente unico entre organizaciones.
        Una colision de otro socio devuelve 409 sin revelar su propietario.
        Consentimiento vigente del cliente obligatorio;
        el socio nunca lo concede. El resultado enlaza la solicitud real del cliente.
        Un reintento identico devuelve el mismo resultado sin consumir cuota.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSolicitudSocio"
      responses:
        "201":
          description: Operacion persistida y completada, incluyendo reintentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente, socio_no_autorizado o consentimiento_invalido
        "404":
          description: cliente_no_encontrado
        "409":
          description: idempotencia_conflicto o operacion_en_curso (Retry-After)
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "429":
          $ref: "#/components/responses/CuotaSocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/solicitudes-cotizacion/{operationId}:
    get:
      tags: [Socios]
      operationId: recuperarSolicitudSocio
      summary: Recupera una operacion sin guardar datos personales en el navegador
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Misma operacion completada; no recalcula ni consulta fuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente o socio_no_autorizado
        "404":
          description: operacion_no_encontrada dentro del socio autorizado
        "409":
          description: >-
            operacion_en_curso o operacion_reintentable, con Retry-After.
            GET no reanuda; para reintentar se necesita POST con el cuerpo original.
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/clientes:
    get:
      tags: [Asesores]
      summary: Lista clientes registrados para selección del asesor
      description: Requiere JWT con rol y scope asesor.
      operationId: listarClientesAsesor
      responses:
        "200":
          description: Catálogo mínimo de clientes; no expone credenciales ni consentimiento
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClienteRegistrado"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/perfilamientos-hipotecarios:
    post:
      tags: [Asesores]
      summary: Perfila y cotiza vida hipotecaria en el contexto del socio
      description: >-
        Requiere JWT de asesor. socioId debe estar en el claim socios. operationId e
        Idempotency-Key deben contener el mismo UUID. Un reintento idéntico devuelve
        la misma operación completada; el mismo UUID con otros datos responde 409.
      operationId: iniciarPerfilamientoHipotecario
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarPerfilamientoHipotecario"
      responses:
        "201":
          description: Perfilamiento y cotización confirmados por el backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilamientoHipotecarioCompletado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Socio o consentimiento no autorizado
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "429":
          $ref: "#/components/responses/CuotaSocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/consentimientos/perfilamiento:
    get:
      tags: [Consentimientos]
      summary: Consulta el consentimiento de perfilamiento persistido
      description: >-
        Consulta la ultima version del consentimiento del usuario del JWT.
        No autoriza automaticamente. Devuelve vencido al alcanzar vigenteHasta.
        La vigencia elegida no puede superar 30 dias desde la decision.
      operationId: consultarConsentimientoPerfilamiento
      responses:
        "200":
          description: Consentimiento autorizado, rechazado, revocado o vencido
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentimientoPerfilamiento"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
        "404":
          description: No existe consentimiento (code consentimiento_ausente)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
    put:
      tags: [Consentimientos]
      summary: Aprueba, rechaza o revoca el perfilamiento con control de version
      description: >-
        Aprobar (autorizado=true) y rechazar (autorizado=false) requieren solicitud completa.
        autorizado=false sin solicitud revoca la ultima autorizacion conservando su alcance.
        El actor procede exclusivamente del JWT. Las fuentes son simuladas, nunca proveedores
        reales. Los clientes que antes enviaban solo el booleano deben presentar la solicitud
        al usuario y enviar su contenido; una aprobacion incompleta ahora devuelve 400.
      operationId: guardarConsentimientoPerfilamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionConsentimiento"
      responses:
        "200":
          description: Nueva version persistida junto con su evento de auditoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentimientoPerfilamiento"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/perfilamiento:
    get:
      tags: [Cotizaciones]
      summary: Consulta el mismo perfil usado para calcular la solicitud
      operationId: consultarPerfilamientoSolicitud
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Perfil vigente con ambas fuentes simuladas e integras
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfilamiento"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Consentimiento ausente, revocado, vencido o con otra version
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          description: Perfil vencido
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuario"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/Conflicto"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/desafio:
    get:
      tags: [Sesiones]
      summary: Obtiene un desafío de login cifrado, válido 60 segundos
      operationId: obtenerDesafioLogin
      security: []
      description: >-
        Requiere ENCRYPTED_LOGIN_ENABLED=true. Sin habilitar responde 503.
        El BFF delega a identidad; no tiene clave privada ni almacén de desafíos.
      responses:
        "200":
          description: Desafío de un solo uso; no almacenar en caché
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioLogin"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones:
    post:
      tags: [Sesiones]
      summary: Inicia una sesión de cliente
      description: >-
        Con ENCRYPTED_LOGIN_ENABLED=true solo acepta CredencialesCifradas; rechaza
        contrasena y campos adicionales. Por defecto solo acepta Credenciales heredadas.
        Nunca intenta el contrato heredado si falla el login cifrado.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Credenciales"
                - $ref: "#/components/schemas/CredencialesCifradas"
      responses:
        "200":
          description: >-
            Sesión creada. El `accessToken` (JWT RS256, 1 hora) se envía como
            `Authorization: Bearer` y el `refreshToken` se usa en `/v1/sesiones/renovar`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/renovar:
    post:
      tags: [Sesiones]
      summary: Renueva la sesión con el refresh token
      description: El refresh token rota en cada uso; el anterior deja de ser válido.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nueva sesión con tokens rotados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/RefreshInvalido"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/actual:
    get:
      tags: [Sesiones]
      summary: Consulta la sesión actual a partir del access token
      operationId: consultarSesion
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    delete:
      tags: [Sesiones]
      summary: Cierra la sesión y revoca el refresh token si se envía
      operationId: cerrarSesion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CierreSesion"
      responses:
        "204":
          description: Sesión cerrada
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/productos-seguro:
    get:
      tags: [Productos]
      summary: Lista los seguros disponibles para cotizar
      operationId: listarProductosSeguro
      responses:
        "200":
          description: Catálogo de seguros
          content:
            application/json:
              schema:
                type: object
                required: [productos]
                properties:
                  productos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductoSeguro"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/productos-seguro/{productoId}:
    get:
      tags: [Productos]
      summary: Consulta coberturas y condiciones de un seguro
      operationId: consultarProductoSeguro
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Detalle del seguro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoSeguroDetalle"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/destinos-viaje:
    get:
      tags: [Productos]
      summary: Lista los países disponibles para el seguro de viaje
      operationId: listarDestinosViaje
      responses:
        "200":
          description: Catálogo de destinos asegurables
          content:
            application/json:
              schema:
                type: object
                required: [destinos]
                properties:
                  destinos:
                    type: array
                    items:
                      $ref: "#/components/schemas/DestinoViaje"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion:
    post:
      tags: [Cotizaciones]
      summary: Registra una solicitud de cotización
      operationId: crearSolicitudCotizacion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSolicitudCotizacion"
      responses:
        "201":
          description: Solicitud registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCotizacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}:
    get:
      tags: [Cotizaciones]
      summary: Consulta una solicitud de cotización
      operationId: consultarSolicitudCotizacion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCotizacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /v1/solicitudes-cotizacion/{solicitudId}/ofertas:
    get:
      tags: [Ofertas]
      summary: Lista las ofertas calculadas para una solicitud
      operationId: listarOfertas
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Resultado del cálculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoOfertas"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/seleccion:
    get:
      tags: [Ofertas]
      summary: Consulta la oferta seleccionada
      operationId: consultarSeleccionOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Selección vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      tags: [Ofertas]
      summary: Registra o reemplaza la oferta seleccionada
      operationId: seleccionarOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSeleccionOferta"
      responses:
        "200":
          description: Selección registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
  /v1/solicitudes-cotizacion/{solicitudId}/suscripcion:
    get:
      tags: [Suscripciones]
      summary: Consulta la suscripción asociada a una oferta aceptada
      operationId: consultarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Suscripción encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    post:
      tags: [Suscripciones]
      summary: Procesa la suscripción de una oferta aceptada
      operationId: iniciarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Suscripción procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/pago-simulado:
    get:
      tags: [Pagos]
      summary: Recupera el pago simulado persistido del cliente autenticado
      description: |
        No consulta ninguna pasarela. Devuelve 404 pago_no_encontrado solo si la
        solicitud pertenece al cliente y todavía no tiene pago; una solicitud
        inexistente o ajena devuelve 404 solicitud_no_encontrada.
      operationId: consultarPagoSimulado
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Pago simulado confirmado, sin cobro ni emisión de póliza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoSimulado"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    post:
      tags: [Pagos]
      summary: Confirma un pago exclusivamente simulado
      description: |
        Requiere JWT e Idempotency-Key UUID. No acepta importe, moneda, cliente,
        tarjeta ni referencia bancaria. Deriva importe y periodicidad de la
        selección persistida coincidente con la suscripción aprobada y vigente.
        Registra pago, saga pago_confirmado y evento PagoSimuladoConfirmado en
        una transacción. Nunca cobra, conecta proveedor ni emite póliza.
        Un pago por solicitud/suscripción: el reintento devuelve el mismo registro
        incluso con otra clave, tras vencimiento o posterior avance de saga.
        Una clave de creación usada en otra solicitud devuelve 409.
        La primera confirmación con oferta vencida, suscripción no aprobada,
        selección distinta o saga no pendiente devuelve 422 pago_no_permitido.
      operationId: confirmarPagoSimulado
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: Pago simulado creado o recuperado sin duplicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoSimulado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/dashboard:
    get:
      tags: [Dashboard]
      summary: Consulta el resumen del cliente autenticado
      operationId: consultarDashboard
      description: |
        Lee exclusivamente registros persistidos del cliente derivado del JWT.
        No admite query ni cuerpo. Una coleccion vacia es una consulta real sin registros;
        polizas contiene emisiones academicas persistidas, no cobertura real.
        Si la emision no esta habilitada conserva el marcador legado no_implementado;
        el consumidor no debe presentarlo como lista vacia. Notificaciones no esta implementado.
        No recalcula primas, no renueva perfiles y no agrega importes de monedas
        o periodicidades distintas. Los pagos son exclusivamente simulados.
      responses:
        "200":
          description: Resumen del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por identidad (dura 1 hora).
  parameters:
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
        pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ApiVersion:
      name: API-Version
      in: header
      required: false
      schema:
        type: string
        enum: ["1"]
        default: "1"
      description: Una version distinta devuelve 400 version_no_soportada.
  responses:
    CuotaSocio:
      description: cuota_socio_excedida o socio_ocupado, sin iniciar perfilamiento
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CredencialesInvalidas:
      description: Credenciales inválidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RefreshInvalido:
      description: El refresh token no existe, expiró o ya fue usado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutorizado:
      description: El access token falta, expiró o no es válido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoEncontrado:
      description: El recurso no existe o no pertenece al cliente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Conflicto con el estado actual del recurso
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ReglaNegocio:
      description: Una regla de negocio impide la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Se superó el límite de solicitudes permitido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    ClienteRegistrado:
      type: object
      additionalProperties: false
      required: [clienteId, nombre, correo]
      properties:
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
    ConsultaInformacionCliente:
      type: object
      additionalProperties: false
      required: [operationId, socioId, productoId, finalidad, datosSolicitados]
      oneOf:
        - required: [clienteId]
          not:
            anyOf:
              - required: [tipoDocumento]
              - required: [numeroDocumento]
        - required: [tipoDocumento, numeroDocumento]
          not:
            required: [clienteId]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        clienteId:
          type: string
          format: uuid
          description: Identificador interno para clientes heredados sin documento maestro.
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        numeroDocumento:
          type: string
          minLength: 5
          maxLength: 16
          description: cc 6-10 digitos; ce 6-12; passport 5-16 A-Z/0-9; ppt 7-10 digitos.
        productoId:
          type: string
          minLength: 1
          maxLength: 64
        finalidad:
          const: cotizacion
        datosSolicitados:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
    InformacionClienteAutorizada:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - actorId
        - clienteId
        - productoId
        - finalidad
        - estado
        - consentimientoId
        - consentimientoVersion
        - datos
        - evidenciaFuentes
        - consultadaEn
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        actorId:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        finalidad:
          const: cotizacion
        estado:
          const: completada
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
        datos:
          type: object
          additionalProperties:
            type: string
          description: Solo contiene la intersección entre datos solicitados y consentidos.
        evidenciaFuentes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fuente, version, consultadaEn, simulada]
            properties:
              fuente:
                enum: [open_finance, open_data]
              version:
                type: string
              consultadaEn:
                type: string
                format: date-time
              simulada:
                type: boolean
        consultadaEn:
          type: string
          format: date-time
    NuevaSolicitudSocio:
      type: object
      additionalProperties: false
      required: [operationId, socioId, productoId, datosProducto, cliente]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        productoId:
          const: mortgage-life
        datosProducto:
          type: object
          additionalProperties: false
          required: [mortgageBalance]
          properties:
            mortgageBalance:
              type: string
              pattern: "^[1-9][0-9]{0,15}$"
        cliente:
          type: object
          additionalProperties: false
          required: [tipoCliente, tipoDocumento, numeroDocumento]
          properties:
            tipoCliente:
              const: persona_natural
            tipoDocumento:
              enum: [cc, ce, passport, ppt]
            numeroDocumento:
              type: string
              description: cc 6-10 digitos; ce 6-12; passport 5-16 A-Z/0-9; ppt 7-10 digitos.
    OperacionSocio:
      type: object
      additionalProperties: false
      required: [operationId, socioId, clienteId, productoId, estado, perfilamientoReferencia, solicitudId, cotizacionId, recibidaEn, oferta]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        estado:
          const: completada
        perfilamientoReferencia:
          type: string
          description: Referencia opaca del perfil persistido.
        solicitudId:
          type: string
        cotizacionId:
          type: string
          format: uuid
        oferta:
          $ref: "#/components/schemas/Oferta"
        recibidaEn:
          type: string
          format: date-time
    IniciarPerfilamientoHipotecario:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - cliente
        - credito
        - consentimientoId
        - consentimientoVersion
      properties:
        operationId:
          type: string
          format: uuid
        productoId:
          type: string
          const: mortgage-life
          default: mortgage-life
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        cliente:
          $ref: "#/components/schemas/ClienteHipotecario"
        credito:
          $ref: "#/components/schemas/CreditoHipotecario"
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
    ClienteHipotecario:
      type: object
      additionalProperties: false
      required:
        - clienteId
        - tipoDocumento
        - numeroDocumento
        - telefono
        - fechaNacimiento
      properties:
        clienteId:
          type: string
          format: uuid
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        numeroDocumento:
          type: string
          pattern: "^[A-Za-z0-9]{6,15}$"
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        fechaNacimiento:
          type: string
          format: date
    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [referencia, monto, plazoMeses]
      properties:
        referencia:
          type: string
          pattern: "^[A-Za-z0-9-]{4,30}$"
        monto:
          type: integer
          minimum: 1000000
        plazoMeses:
          type: integer
          minimum: 12
          maximum: 360
    PerfilamientoHipotecarioCompletado:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - clienteId
        - estado
        - perfilamientoReferencia
        - solicitudId
        - cotizacionId
        - recibidaEn
      properties:
        productoId:
          type: string
          const: mortgage-life
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        estado:
          type: string
          const: completada
        perfilamientoReferencia:
          type: string
        solicitudId:
          type: string
        cotizacionId:
          type: string
          format: uuid
        recibidaEn:
          type: string
          format: date-time
    DecisionConsentimiento:
      type: object
      additionalProperties: false
      required: [autorizado, version]
      properties:
        autorizado:
          type: boolean
        version:
          type: integer
          minimum: 0
          description: Version actual; 0 si no existe consentimiento
        solicitud:
          $ref: "#/components/schemas/SolicitudConsentimiento"
      if:
        properties:
          autorizado:
            const: true
      then:
        required: [solicitud]
    SolicitudConsentimiento:
      type: object
      additionalProperties: false
      required: [finalidad, alcances, fuentes, datos, versionTerminos, vigenteHasta]
      properties:
        finalidad:
          type: string
          const: cotizacion
        alcances:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_finance, open_data]
        fuentes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Adaptadores simulados; cada fuente debe estar incluida en alcances
          items:
            type: string
            enum: [open_finance, open_data]
        datos:
          type: array
          const: [indicador_riesgo]
          items:
            type: string
        versionTerminos:
          type: string
          const: "1.0"
        vigenteHasta:
          type: string
          format: date-time
          description: Fecha futura con zona horaria; como maximo 30 dias desde la decision
    ConsentimientoPerfilamiento:
      type: object
      additionalProperties: false
      required:
        - consentimientoId
        - clienteId
        - version
        - estado
        - finalidad
        - alcances
        - efectivaEn
        - vigenteHasta
        - actorId
        - fuentes
        - datos
        - versionTerminos
      properties:
        consentimientoId:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [autorizado, rechazado, revocado, vencido]
        finalidad:
          type: string
          const: cotizacion
        alcances:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_finance, open_data]
        actorId:
          type: [string, "null"]
          format: uuid
          description: Titular autenticado; null en evidencia historica incompleta
        fuentes:
          type: array
          items:
            type: string
        datos:
          type: array
          items:
            type: string
        versionTerminos:
          type: [string, "null"]
        efectivaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
    Perfilamiento:
      type: object
      additionalProperties: false
      required: [solicitudId, perfilId, version, modeloVersion, score, nivel, consentimientoId,
                 consentimientoVersion, calculadoEn, vigenteHasta, fuentes, fallbackUsed]
      properties:
        solicitudId:
          type: string
        perfilId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        modeloVersion:
          type: string
        score:
          type: string
          description: Indicador sintetico entre 0 y 1, no informacion financiera real
        nivel:
          type: string
          enum: [A, B, C]
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
        calculadoEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        fallbackUsed:
          type: boolean
          const: false
        fuentes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [nombre, version, consultadaEn, vigenteHasta, simulada, indicadorRiesgo]
            properties:
              nombre:
                type: string
                enum: [open_finance, open_data]
              version:
                type: string
              consultadaEn:
                type: string
                format: date-time
              vigenteHasta:
                type: string
                format: date-time
              simulada:
                type: boolean
                const: true
              indicadorRiesgo:
                type: string
    DesafioLogin:
      type: object
      additionalProperties: false
      required: [desafioId, clavePublica, expiraEn]
      properties:
        desafioId:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        expiraEn:
          type: string
          format: date-time
        clavePublica:
          type: object
          additionalProperties: false
          required: [kty, n, e, alg, use, kid]
          properties:
            kty:
              type: string
              const: RSA
            n:
              type: string
            e:
              type: string
            alg:
              type: string
              const: RSA-OAEP-256
            use:
              type: string
              const: enc
            kid:
              type: string
              minLength: 1
    CredencialesCifradas:
      type: object
      additionalProperties: false
      required: [correo, credencialCifrada]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        credencialCifrada:
          type: string
          minLength: 1
          maxLength: 8192
          description: >-
            JWE compacto con cabecera protegida exacta alg=RSA-OAEP-256, enc=A256GCM,
            kid de clavePublica, typ=solventa-login+jwe. JSON cifrado exacto
            {desafioId, correo, contrasena}; correo coincide con el exterior.
            Desafío válido 60 segundos, consumido antes de verificar la contraseña.
    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
    UsuarioSesion:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente, asesor, socio]
        socios:
          type: array
          uniqueItems: true
          description: Organizaciones autorizadas para roles asesor y socio.
          items:
            type: string
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
    Sesion:
      type: object
      additionalProperties: false
      required: [usuario, expiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [usuario, tokenType, accessToken, refreshToken, expiraEn, refreshExpiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: JWT RS256 de vida corta (1 hora). Se guarda solo en memoria.
        refreshToken:
          type: string
          description: Token opaco de un solo uso que rota en cada renovación.
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token (ahora + expires_in de identidad).
        refreshExpiraEn:
          type: string
          format: date-time
    Renovacion:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 2048
    ProductoSeguro:
      type: object
      additionalProperties: false
      required: [id, nombre, descripcion, disponible, coberturasPrincipales]
      properties:
        id:
          type: string
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        disponible:
          type: boolean
        coberturasPrincipales:
          type: array
          minItems: 1
          items:
            type: string
    ProductoSeguroDetalle:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - disponible
        - coberturasPrincipales
        - coberturas
        - condiciones
        - informacionRelevante
      properties:
        id:
          type: string
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        disponible:
          type: boolean
        coberturasPrincipales:
          type: array
          minItems: 1
          items:
            type: string
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaProducto"
        condiciones:
          type: array
          minItems: 1
          items:
            type: string
        informacionRelevante:
          $ref: "#/components/schemas/InformacionProducto"
    CoberturaProducto:
      type: object
      additionalProperties: false
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
    InformacionProducto:
      type: object
      additionalProperties: false
      required: [sumaAsegurada, deducible, moneda, vigencia]
      properties:
        sumaAsegurada:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        deducible:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
        vigencia:
          type: string
    DestinoViaje:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          pattern: "^[A-Z]{2}$"
        nombre:
          type: string
          minLength: 1
          maxLength: 120
    NuevaSolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - productoId
        - datosProducto
      properties:
        productoId:
          type: string
          enum:
            - automotive
            - travel
            - life
            - device-protection
            - parametric
            - parametric-weather
            - payment-protection
            - mortgage-life
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
      oneOf:
        - properties:
            productoId:
              const: automotive
            datosProducto:
              $ref: "#/components/schemas/DatosAutomotriz"
        - properties:
            productoId:
              const: travel
            datosProducto:
              $ref: "#/components/schemas/DatosViaje"
        - properties:
            productoId:
              const: life
            datosProducto:
              $ref: "#/components/schemas/DatosVida"
        - properties:
            productoId:
              const: device-protection
            datosProducto:
              $ref: "#/components/schemas/DatosDispositivo"
        - properties:
            productoId:
              const: parametric
            datosProducto:
              $ref: "#/components/schemas/DatosVuelo"
        - properties:
            productoId:
              const: parametric-weather
            datosProducto:
              $ref: "#/components/schemas/DatosClima"
        - properties:
            productoId:
              const: payment-protection
            datosProducto:
              $ref: "#/components/schemas/DatosProteccionPagos"
        - properties:
            productoId:
              const: mortgage-life
            datosProducto:
              $ref: "#/components/schemas/DatosVidaHipotecaria"
    DatosProducto:
      description: >-
        Datos específicos del producto, sin campos adicionales. Todas las fechas
        usan YYYY-MM-DD y todos los importes son strings de enteros positivos COP.
        Las validaciones temporales se aplican al crear, no al consultar registros históricos.
      oneOf:
        - $ref: "#/components/schemas/DatosAutomotriz"
        - $ref: "#/components/schemas/DatosViaje"
        - $ref: "#/components/schemas/DatosVida"
        - $ref: "#/components/schemas/DatosDispositivo"
        - $ref: "#/components/schemas/DatosVuelo"
        - $ref: "#/components/schemas/DatosClima"
        - $ref: "#/components/schemas/DatosProteccionPagos"
        - $ref: "#/components/schemas/DatosVidaHipotecaria"
    DatosAutomotriz:
      type: object
      additionalProperties: false
      required: [vehiclePlate]
      properties:
        vehiclePlate:
          type: string
          pattern: "^[A-Z]{3}[0-9]{3}$"
    DatosViaje:
      type: object
      additionalProperties: false
      required: [destinationCountryCode, departureDate, returnDate]
      description: >-
        El país debe pertenecer a /v1/destinos-viaje y returnDate debe ser igual
        o posterior a departureDate.
      properties:
        destinationCountryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        departureDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
    DatosVida:
      type: object
      additionalProperties: false
      required: [birthDate]
      properties:
        birthDate:
          type: string
          format: date
    DatosDispositivo:
      type: object
      additionalProperties: false
      required: [deviceType, brandModel, purchaseValue]
      properties:
        deviceType:
          type: string
          pattern: "\\S"
          maxLength: 40
        brandModel:
          type: string
          pattern: "\\S"
          maxLength: 80
        purchaseValue:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    DatosVuelo:
      type: object
      description: |
        flightDate debe ser posterior a hoy al crear. Omitir coverageType conserva
        la modalidad delay-cancellation sin añadir el campo al registro.
        Las ofertas son simuladas: no consultan aerolíneas ni pagan siniestros.
        La pérdida de conexión está sujeta a las condiciones del plan y no incluye
        pérdidas por responsabilidad del pasajero.
      additionalProperties: false
      required: [airline, flightNumber, flightDate]
      properties:
        airline:
          type: string
          pattern: "\\S"
          maxLength: 80
        flightNumber:
          type: string
          pattern: "^[A-Za-z0-9]{2,10}$"
        flightDate:
          type: string
          format: date
        coverageType:
          type: string
          enum: [delay-cancellation, missed-connection, comprehensive]
          default: delay-cancellation
    DatosClima:
      type: object
      additionalProperties: false
      required: [location, weatherEvent, startDate, endDate, insuredAmount]
      description: >-
        location contiene municipio y departamento en texto libre, sin catálogo externo.
        Las fechas deben ser posteriores a hoy al crear; endDate >= startDate
        y periodo máximo de 366 días inclusive. insuredAmount acepta de 1 a
        1000000000 COP. El evento, disparador, umbral y compensación están sujetos
        a condiciones del plan; no hay monitoreo meteorológico ni pagos reales.
      properties:
        location:
          type: string
          pattern: "\\S"
          maxLength: 120
        weatherEvent:
          type: string
          enum: [heavy-rain, drought]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        insuredAmount:
          type: string
          pattern: "^(?:[1-9][0-9]{0,8}|1000000000)$"
    DatosProteccionPagos:
      type: object
      additionalProperties: false
      required: [creditType, monthlyPayment]
      properties:
        creditType:
          type: string
          pattern: "\\S"
          maxLength: 60
        monthlyPayment:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    DatosVidaHipotecaria:
      type: object
      additionalProperties: false
      required: [birthDate, mortgageBalance]
      properties:
        birthDate:
          type: string
          format: date
        mortgageBalance:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - id
        - productoId
        - tipoCliente
        - tipoDocumento
        - identificacion
        - datosProducto
        - correo
        - telefono
        - estado
        - creadaEn
      properties:
        id:
          type: string
          pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
        productoId:
          type: string
        tipoCliente:
          type: string
          enum: [persona_natural]
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
        correo:
          type: string
          format: email
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        estado:
          type: string
          enum: [recibida, procesando, calculada, sin_ofertas, fallida]
        creadaEn:
          type: string
          format: date-time
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
          example: COP
    Oferta:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - nombre
        - descripcion
        - primaMensual
        - prima
        - periodicidad
        - coberturaPrincipal
        - deducible
        - vigencia
        - responsabilidadCivil
        - coberturas
        - condiciones
        - beneficiosAdicionales
        - recomendada
        - estado
        - vigenteHasta
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        primaMensual:
          description: Solo para periodicidad mensual; null para viaje, vuelo o período asegurado.
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
        prima:
          $ref: "#/components/schemas/Dinero"
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
          description: >-
            por_periodo identifica la prima total del período asegurado entre
            datosProducto.startDate y endDate, ambos inclusive. No define cuotas
            ni renovación. vigenteHasta es el plazo de aceptación de la oferta.
        coberturaPrincipal:
          type: string
          maxLength: 250
        deducible:
          type: string
          maxLength: 120
        vigencia:
          type: string
          maxLength: 120
        responsabilidadCivil:
          type: string
          maxLength: 120
        coberturas:
          type: array
          items:
            type: string
          minItems: 1
        condiciones:
          type: array
          items:
            type: string
          minItems: 1
        beneficiosAdicionales:
          type: array
          items:
            type: string
        recomendada:
          type: boolean
        estado:
          type: string
          enum: [disponible, aceptada, vencida, retirada]
        vigenteHasta:
          type: string
          format: date-time
    ResultadoOfertas:
      type: object
      additionalProperties: false
      required: [solicitudId, calculadaEn, vigenteHasta, tasaAplicada, ofertas]
      properties:
        solicitudId:
          type: string
        calculadaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        tasaAplicada:
          type: string
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/Oferta"
    NuevaSeleccionOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, version]
      properties:
        ofertaId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    SeleccionOferta:
      allOf:
        - $ref: "#/components/schemas/NuevaSeleccionOferta"
        - type: object
          required: [solicitudId, nombreOferta, primaMensual, prima, periodicidad, seleccionadaEn]
          properties:
            solicitudId:
              type: string
            nombreOferta:
              type: string
            primaMensual:
              description: Solo para periodicidad mensual; null para viaje, vuelo o período asegurado.
              oneOf:
                - $ref: "#/components/schemas/Dinero"
                - type: "null"
            prima:
              $ref: "#/components/schemas/Dinero"
            periodicidad:
              type: string
              enum: [mensual, por_viaje, por_vuelo, por_periodo]
              description: por_periodo conserva la prima total del período asegurado seleccionado.
            seleccionadaEn:
              type: string
              format: date-time
    Suscripcion:
      type: object
      additionalProperties: false
      required:
        - id
        - solicitudId
        - ofertaId
        - ofertaVersion
        - estado
        - reglaVersion
        - creadaEn
        - actualizadaEn
        - decision
        - saga
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/DecisionSuscripcion"
        saga:
          $ref: "#/components/schemas/SagaEmision"
    PagoSimulado:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, ofertaId, ofertaVersion, estado, simulada, referenciaInterna, importe, periodicidad, confirmadaEn, saga]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        suscripcionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          const: confirmado
        simulada:
          type: boolean
          const: true
        referenciaInterna:
          type: string
          pattern: "^SIM-[0-9a-f-]{36}$"
          description: Identificador interno; no es una referencia bancaria.
        importe:
          $ref: "#/components/schemas/Dinero"
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
        confirmadaEn:
          type: string
          format: date-time
        saga:
          type: object
          additionalProperties: false
          required: [estado, version, actualizadaEn]
          description: Instantánea de la transición al confirmar; consultar suscripción para estado posterior.
          properties:
            estado:
              type: string
              const: pago_confirmado
            version:
              type: integer
              minimum: 2
            actualizadaEn:
              type: string
              format: date-time
    DecisionSuscripcion:
      type: object
      additionalProperties: false
      required: [resultado, reglaVersion, hashDecision, decididaEn]
      properties:
        resultado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        hashDecision:
          type: string
          pattern: "^[a-f0-9]{64}$"
        decididaEn:
          type: string
          format: date-time
    SagaEmision:
      type: object
      additionalProperties: false
      required: [estado, version, actualizadaEn]
      properties:
        estado:
          type: string
          enum: [pago_pendiente, pago_confirmado, emitida, fallida]
        version:
          type: integer
          minimum: 1
        actualizadaEn:
          type: string
          format: date-time
    PolizaResumen:
      type: object
      additionalProperties: false
      required: [id, producto, estado]
      properties:
        id:
          type: string
        producto:
          type: string
        estado:
          type: string
          enum: [activa, pendiente, vencida]
        prima:
          $ref: "#/components/schemas/Dinero"
    Notificacion:
      type: object
      additionalProperties: false
      required: [id, titulo, creadaEn, leida]
      properties:
        id:
          type: string
        titulo:
          type: string
        creadaEn:
          type: string
          format: date-time
        leida:
          type: boolean
    Dashboard:
      type: object
      additionalProperties: false
      required: [cotizaciones, suscripciones, pagos, polizas, notificaciones]
      properties:
        cotizaciones:
          type: array
          items:
            $ref: "#/components/schemas/CotizacionDashboard"
        suscripciones:
          type: array
          items:
            $ref: "#/components/schemas/SuscripcionDashboard"
        pagos:
          type: array
          items:
            $ref: "#/components/schemas/PagoDashboard"
        polizas:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PolizaDashboard"
            - $ref: "#/components/schemas/DominioNoImplementado"
        notificaciones:
          $ref: "#/components/schemas/DominioNoImplementado"
    PolizaDashboard:
      type: object
      additionalProperties: false
      required: [id, suscripcionId, tipo, fechaInicio, fechaFin, estado, simulada]
      description: |
        Emision academica posterior a un pago simulado nuevo. No acredita cobertura real.
        Fechas inclusivas; estado calculado respecto del dia UTC. Los pagos anteriores
        a habilitar la emision no se convierten retroactivamente en polizas.
      properties:
        id:
          type: string
          format: uuid
        suscripcionId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [automotive, travel, life, device-protection, parametric, parametric-weather, payment-protection, mortgage-life]
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estado:
          type: string
          enum: [programada, vigente, vencida]
        simulada:
          type: boolean
          const: true
    DominioNoImplementado:
      type: object
      additionalProperties: false
      required: [disponibilidad]
      properties:
        disponibilidad:
          type: string
          const: no_implementado
    DineroDashboard:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: Importe persistido, no negativo y sin conversiones.
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
    PeriodicidadDashboard:
      type: string
      enum: [mensual, por_viaje, por_vuelo, por_periodo]
    SeleccionDashboard:
      type: object
      additionalProperties: false
      required: [ofertaId, nombreOferta, prima, periodicidad, seleccionadaEn]
      properties:
        ofertaId:
          type: string
          format: uuid
        nombreOferta:
          type: string
          minLength: 1
        prima:
          $ref: "#/components/schemas/DineroDashboard"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        seleccionadaEn:
          type: string
          format: date-time
    CotizacionDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, productoId, estado, creadaEn, validaHasta, primaEstimada, seleccion]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: [string, "null"]
          description: Null para cotizaciones previas al flujo de solicitudes.
        productoId:
          type: string
          minLength: 1
          description: Slug del catalogo actual o UUID original para productos historicos desconocidos.
        estado:
          type: string
          minLength: 1
          description: Estado persistido, actualmente PENDIENTE o CALCULADA.
        creadaEn:
          type: string
          format: date-time
        validaHasta:
          type: string
          format: date-time
        primaEstimada:
          $ref: "#/components/schemas/DineroDashboard"
          description: No tiene periodicidad persistida; no presentar como prima mensual.
        seleccion:
          oneOf:
            - $ref: "#/components/schemas/SeleccionDashboard"
            - type: "null"
    SuscripcionDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, cotizacionId, ofertaId, estado, creadaEn, actualizadaEn, saga]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        cotizacionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        estado:
          type: string
          minLength: 1
          description: Estado persistido, actualmente aprobada, revision o rechazada.
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        saga:
          $ref: "#/components/schemas/SagaDashboard"
    SagaDashboard:
      type: object
      additionalProperties: false
      required: [estado, version, actualizadaEn]
      properties:
        estado:
          type: string
          minLength: 1
          description: Estado persistido de la saga; solo la coleccion polizas acredita un registro de emision academica.
        version:
          type: integer
          minimum: 1
        actualizadaEn:
          type: string
          format: date-time
    PagoDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, estado, simulada, importe, periodicidad, confirmadaEn]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        suscripcionId:
          type: string
          format: uuid
        estado:
          type: string
          const: confirmado
        simulada:
          type: boolean
          const: true
        importe:
          $ref: "#/components/schemas/DineroDashboard"
          description: Importe positivo persistido del pago simulado.
          properties:
            monto:
              type: string
              pattern: "^(?=.*[1-9])[0-9]+\\.[0-9]{2}$"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        confirmadaEn:
          type: string
          format: date-time
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, mensaje]
      properties:
        campo:
          type: string
        mensaje:
          type: string
    Problema:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorCampo"
security:
  - bearerAuth: []
