openapi: 3.1.0
info:
  title: Solventa BFF Web
  version: 1.0.0
  description: Contrato público consumido por la aplicación web de clientes de Solventa.
servers:
  - url: /api
tags:
  - name: Usuarios
  - name: Sesiones
  - name: Consentimientos
  - name: Productos
  - name: Cotizaciones
  - name: Ofertas
  - name: Suscripciones
  - name: Dashboard
  - name: Asesores
  - name: Socios
  - name: Siniestros
  - name: Polizas
  - name: Reportes
paths:
  /v1/recuperacion-contrasena:
    $ref: "./recuperacion-contrasena-v1.yaml#/paths/~1v1~1recuperacion-contrasena"
  /v1/recuperacion-contrasena/desafio:
    $ref: "./recuperacion-contrasena-v1.yaml#/paths/~1v1~1recuperacion-contrasena~1desafio"
  /v1/recuperacion-contrasena/confirmar:
    $ref: "./recuperacion-contrasena-v1.yaml#/paths/~1v1~1recuperacion-contrasena~1confirmar"
  /v1/reportes/regulatorios:
    $ref: "./cumplimiento-academico-v1.yaml#/paths/~1v1~1reportes~1regulatorios"
  /v1/reportes/regulatorios/{reporteId}:
    $ref: "./cumplimiento-academico-v1.yaml#/paths/~1v1~1reportes~1regulatorios~1{reporteId}"
  /v1/reportes/regulatorios/{reporteId}/descarga:
    $ref: "./cumplimiento-academico-v1.yaml#/paths/~1v1~1reportes~1regulatorios~1{reporteId}~1descarga"
  /v1/reaseguros/intercambios:
    $ref: "./cumplimiento-academico-v1.yaml#/paths/~1v1~1reaseguros~1intercambios"
  /v1/reaseguros/intercambios/{intercambioId}:
    $ref: "./cumplimiento-academico-v1.yaml#/paths/~1v1~1reaseguros~1intercambios~1{intercambioId}"
  /v1/clientes/me/polizas/{polizaId}/documento:
    $ref: "./documento-poliza-web-v1.yaml#/paths/~1v1~1clientes~1me~1polizas~1{polizaId}~1documento"
  /v1/clientes/me/polizas/{polizaId}/documentos/{documentoId}/descarga:
    $ref: "./documento-poliza-web-v1.yaml#/paths/~1v1~1clientes~1me~1polizas~1{polizaId}~1documentos~1{documentoId}~1descarga"
  /v1/clientes/me/polizas/{polizaId}/aceptaciones:
    $ref: "./documento-poliza-web-v1.yaml#/paths/~1v1~1clientes~1me~1polizas~1{polizaId}~1aceptaciones"
  /v1/siniestros:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros"
  /v1/siniestros/polizas:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1polizas"
  /v1/siniestros/configuracion-evidencias:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1configuracion-evidencias"
  /v1/siniestros/{siniestroId}:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}"
  /v1/siniestros/{siniestroId}/cargas:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}/contenido:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}~1contenido"
  /v1/siniestros/{siniestroId}/cargas/{cargaId}/confirmacion:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1cargas~1{cargaId}~1confirmacion"
  /v1/siniestros/{siniestroId}/evidencias:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1evidencias"
  /v1/siniestros/{siniestroId}/evidencias/{evidenciaId}/contenido:
    $ref: "./siniestros-v1.yaml#/paths/~1siniestros~1{siniestroId}~1evidencias~1{evidenciaId}~1contenido"
  /v1/socios/actual:
    get:
      tags: [Socios]
      operationId: consultarContextoSocio
      summary: Consulta organizaciones y productos de la cuenta socio
      description: Requiere rol y scope socio y organizaciones activas en el JWT.
      responses:
        "200":
          description: Contexto autorizado; no expone catalogo global de clientes
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, usuario, socios, alcances]
                properties:
                  apiVersion:
                    const: "1"
                  usuario:
                    $ref: "#/components/schemas/UsuarioSesion"
                  socios:
                    type: array
                    items:
                      type: object
                      required: [socioId, productos]
                      properties:
                        socioId:
                          type: string
                        productos:
                          type: array
                          description: Vida hipotecaria es el único producto habilitado para socios.
                          items:
                            const: mortgage-life
                  alcances:
                    type: array
                    items:
                      enum: ["perfilamientos:crear", "clientes:consultar"]
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente; cliente y asesor no son socios
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/consultas-informacion-cliente:
    post:
      tags: [Socios]
      operationId: consultarInformacionCliente
      summary: Consulta información mínima autorizada de un cliente
      description: >-
        Requiere JWT de socio, socioId autorizado y consentimiento vigente del
        cliente para el producto, finalidad, fuentes y datos solicitados.
        operationId debe coincidir con Idempotency-Key. Un reintento idéntico
        devuelve la consulta persistida. Si falla una fuente autorizada, la
        operación falla sin devolver ni persistir datos parciales.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaInformacionCliente"
      responses:
        "201":
          description: Consulta autorizada, minimizada y auditada por fuente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformacionClienteAutorizada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio, producto, finalidad o consentimiento no autorizado
        "404":
          description: cliente_no_encontrado
        "409":
          description: idempotencia_conflicto u operacion_rechazada; esta ultima incluye operacion
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          description: >-
            Dependencia no disponible, sin datos parciales. Un bloqueo acreditado
            de open_finance/HU44 sin cache autorizada incluye code=consulta_bloqueada
            y operacion. No todos los 503 producen una excepcion.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /v1/socios/consultas-informacion-cliente/{operationId}:
    get:
      tags: [Socios]
      operationId: recuperarInformacionCliente
      summary: Recupera una consulta autorizada por su operación
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consulta persistida con consentimiento aún vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformacionClienteAutorizada"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Socio o consentimiento no autorizado
        "404":
          description: consulta_no_encontrada
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/consultas-informacion-cliente/{operationId}/estado:
    get:
      tags: [Socios]
      operationId: consultarEstadoOperacionInformacion
      summary: Recupera el resultado del proceso HU44 sin repetir fuentes
      description: >-
        Revalida el rol/pertenencia actuales del socio y el consentimiento original.
        Devuelve solo estado de decision/aplicacion, nunca datos financieros.
        Un acuseId acredita aplicacion durable, no recepcion por el solicitante.
        Solo admite operaciones con bloqueo verificado; no enlaza datos historicos.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado de la misma operacion; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoOperacionInformacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado, actor_no_autorizado o consentimiento_invalido
        "404":
          description: consulta_no_encontrada
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/clientes:
    get:
      tags: [Socios]
      operationId: listarClientesCotizadosSocio
      summary: Lista clientes con cotizaciones persistidas del socio y producto autorizados
      description: |
        Requiere rol y scope socio y pertenencia a socioId, del contexto /v1/socios/actual
        (alcance clientes:consultar). El flujo publico socio soporta mortgage-life.
        No incluye reservas pendientes, rechazadas ni clientes sin cotizacion registrada.
        Deduplicado por clienteId y ordenado por ese UUID, sin paginacion conforme al
        listado de clientes del asesor. No consulta el catalogo global de Identidad.
        Nombre y documento enmascarado solo se muestran con consentimiento actual
        vigente para cotizacion; si no, son null, conservando la asociacion y estado.
        No expone correo, telefono, documento completo, riesgo ni evidencia de consentimiento.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: productoId
          in: query
          required: true
          schema:
            type: string
            enum: [mortgage-life]
      responses:
        "200":
          description: Lista completa, vacia cuando el socio no tiene cotizaciones del producto
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            API-Version:
              schema:
                type: string
                enum: ["1"]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clientes]
                properties:
                  clientes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [clienteId, nombre, tipoDocumento, numeroDocumentoEnmascarado, consentimientoEstado]
                      properties:
                        clienteId:
                          type: string
                          format: uuid
                        nombre:
                          type: [string, "null"]
                        tipoDocumento:
                          type: [string, "null"]
                          enum: [cc, ce, passport, ppt, null]
                        numeroDocumentoEnmascarado:
                          type: [string, "null"]
                        consentimientoEstado:
                          type: string
                          enum: [vigente, insuficiente, ausente, rechazado, revocado, vencido]
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente o socio_no_autorizado
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/clientes/por-documento:
    get:
      tags: [Socios]
      operationId: buscarClienteSocioPorDocumento
      summary: Identifica al cliente y muestra solo el estado util de su consentimiento
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: socioId
          in: query
          required: true
          schema:
            type: string
        - name: tipoDocumento
          in: query
          required: true
          schema:
            type: string
            enum: [cc, ce, passport, ppt]
        - name: numeroDocumento
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cliente identificado sin exponer UUID ni version de consentimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - nombre
                  - tipoDocumento
                  - numeroDocumentoEnmascarado
                  - consentimientoEstado
                properties:
                  nombre:
                    type: string
                  tipoDocumento:
                    type: string
                    enum: [cc, ce, passport, ppt]
                  numeroDocumentoEnmascarado:
                    type: string
                  consentimientoEstado:
                    type: string
                    enum: [vigente, insuficiente, vencido, revocado, rechazado, ausente]
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado
        "404":
          description: cliente_no_encontrado
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/solicitudes-cotizacion:
    post:
      tags: [Socios]
      operationId: iniciarSolicitudSocio
      summary: Perfila y cotiza un producto del catalogo para el cliente autorizado
      description: >-
        Requiere rol y scope socio y socioId presente en el JWT. operationId debe
        coincidir con Idempotency-Key y ser globalmente unico entre organizaciones.
        Una colision de otro socio devuelve 409 sin revelar su propietario.
        Consentimiento vigente del cliente obligatorio;
        el socio nunca lo concede. El resultado enlaza la solicitud real del cliente.
        Un reintento identico devuelve el mismo resultado sin consumir cuota.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSolicitudSocio"
      responses:
        "201":
          description: Operacion persistida y completada, incluyendo reintentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente, socio_no_autorizado o consentimiento_invalido
        "404":
          description: cliente_no_encontrado
        "409":
          description: idempotencia_conflicto o operacion_en_curso (Retry-After)
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "429":
          $ref: "#/components/responses/CuotaSocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/solicitudes-cotizacion/{operationId}:
    get:
      tags: [Socios]
      operationId: recuperarSolicitudSocio
      summary: Recupera una operacion sin guardar datos personales en el navegador
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Misma operacion completada; no recalcula ni consulta fuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente o socio_no_autorizado
        "404":
          description: operacion_no_encontrada dentro del socio autorizado
        "409":
          description: >-
            operacion_en_curso o operacion_reintentable, con Retry-After.
            GET no reanuda; para reintentar se necesita POST con el cuerpo original.
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/socios/solicitudes-cotizacion/{operationId}/oferta:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: socioId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - $ref: "#/components/parameters/ApiVersion"
    post:
      tags: [Socios]
      operationId: calcularOfertaSocio
      summary: Calcula y persiste la oferta explicable de una operacion del socio (SOL-330)
      description: >-
        Requiere rol y scope socio y socioId presente en el JWT. Combina el rating
        persistido de la cotizacion con el riesgo individualizado vigente, sin volver
        a aplicar el score. Revalida cotizacion, perfil, fuentes, consentimiento e
        integridad de la decision; si alguna entrada esta ausente, vencida o es
        inconsistente no se genera oferta. La oferta queda persistida con fuentes,
        variables, regla y versiones. Un reintento devuelve la misma oferta sin
        recalcular ni consultar el perfil.
      responses:
        "201":
          description: Oferta persistida, incluyendo reintentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfertaSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente, socio_no_autorizado o consentimiento_invalido
        "404":
          description: operacion_no_encontrada dentro del socio autorizado
        "422":
          description: >-
            entradas_vencidas (cotizacion, perfil o fuente) u oferta_no_disponible
            (decision inconsistente o sin tarificacion); nunca devuelve una oferta parcial
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    get:
      tags: [Socios]
      operationId: recuperarOfertaSocio
      summary: Recupera la oferta persistida sin recalcular ni consultar fuentes
      responses:
        "200":
          description: Misma oferta persistida; estado vencida al superar vigenteHasta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfertaSocio"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente o socio_no_autorizado
        "404":
          description: operacion_no_encontrada u oferta_no_encontrada
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/clientes:
    get:
      tags: [Asesores]
      summary: Lista clientes registrados para selección del asesor
      description: Requiere JWT con rol y scope asesor.
      operationId: listarClientesAsesor
      responses:
        "200":
          description: Catálogo mínimo de clientes; no expone credenciales ni consentimiento
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClienteRegistrado"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/excepciones-open-finance:
    get:
      tags: [Asesores]
      summary: Lista decisiones pendientes o filtra por estado de aplicacion
      description: >-
        Requiere JWT con rol=asesor y scope=asesor. socioId debe estar incluido
        en el claim socios. Sin filtro devuelve decisiones pendientes. Con
        estadoAplicacion incluye casos ya decididos para recuperarlos tras recarga.
        La aprobación no modifica ni sustituye el consentimiento del cliente.
      operationId: listarExcepcionesOpenFinance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: estadoAplicacion
          in: query
          schema:
            type: string
            enum: [pendiente, bloqueada, completada, detenida]
      responses:
        "200":
          description: Excepciones pendientes del socio autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BandejaExcepcionesOpenFinance"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado o alcance_insuficiente
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/excepciones-open-finance/{excepcionId}:
    get:
      tags: [Asesores]
      summary: Consulta el detalle de una excepción Open Finance
      description: >-
        Requiere JWT con rol=asesor y scope=asesor, y socioId incluido en el
        claim socios. Solo expone la referencia, bloqueo, consentimiento y
        trazabilidad mínimos; una excepción de otro socio se oculta como 404.
      operationId: consultarExcepcionOpenFinance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: excepcionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        "200":
          description: Detalle trazable de la excepción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionOpenFinance"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado o alcance_insuficiente
        "404":
          description: excepcion_no_encontrada
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/excepciones-open-finance/{excepcionId}/resolver:
    post:
      tags: [Asesores]
      summary: Aprueba o rechaza una excepción Open Finance
      description: >-
        Requiere JWT con rol=asesor y scope=asesor, y socioId incluido en el
        claim socios. El actorId se deriva de sub; no se acepta en el cuerpo.
        motivo es obligatorio. Aprobar revalida el consentimiento vigente y la
        versión exacta antes de persistir, y no amplía fuentes, datos ni finalidad.
        Primero confirma atomicamente la decision y su evento; para un caso HU44
        vinculado despacha despues su aplicacion. Una falla de transporte puede
        devolver 503 con la decision ya persistida: recuperarla por GET, no inventar
        su resultado. Una aprobacion solicita un solo reintento logico acotado;
        un rechazo detiene esa operacion. La misma decision/actor/motivo en un caso
        vinculado es idempotente. Casos historicos sin proceso conservan su contrato.
      operationId: resolverExcepcionOpenFinance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: excepcionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolverExcepcionOpenFinance"
      responses:
        "200":
          description: Decisión y evento confirmados por el backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionOpenFinanceResuelta"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: >-
            socio_no_autorizado, alcance_insuficiente, consentimiento_ausente
            o consentimiento_no_vigente. Ante error de consentimiento no se
            cambia el estado de la excepción.
        "404":
          description: excepcion_no_encontrada
        "409":
          description: excepcion_ya_resuelta o conflicto_idempotencia
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/asesor/excepciones-open-finance/{excepcionId}/aplicar:
    post:
      tags: [Asesores]
      operationId: aplicarDecisionExcepcionOpenFinance
      summary: Reentrega explicitamente una decision cuya aplicacion quedo pendiente
      description: >-
        No vuelve a decidir. Revalida permisos actuales; una aprobacion revalida
        tambien solicitante, consentimiento y catalogo. Completa o bloquea una
        unica aplicacion logica; el rechazo detiene la operacion sin consultar
        fuentes. Una aplicacion con acuseId es terminal y se devuelve sin repetir
        efectos, incluida bloqueada. No hay worker ni recuperacion autonoma.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: excepcionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: socioId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Caso completo con decision y aplicacion durable; no implica exito de la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcepcionOpenFinanceResuelta"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: socio_no_autorizado o actor_no_autorizado
        "404":
          description: excepcion_no_encontrada
        "409":
          description: decision_pendiente o excepcion_sin_operacion
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/perfilamientos-hipotecarios:
    post:
      tags: [Asesores]
      summary: Perfila y cotiza vida hipotecaria en el contexto del socio
      description: >-
        Requiere JWT de asesor. socioId debe estar en el claim socios. operationId e
        Idempotency-Key deben contener el mismo UUID. Un reintento idéntico devuelve
        la misma operación completada; el mismo UUID con otros datos responde 409.
      operationId: iniciarPerfilamientoHipotecario
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarPerfilamientoHipotecario"
      responses:
        "201":
          description: Perfilamiento y cotización confirmados por el backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilamientoHipotecarioCompletado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Socio o consentimiento no autorizado
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "429":
          $ref: "#/components/responses/CuotaSocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/consentimientos/perfilamiento:
    get:
      tags: [Consentimientos]
      summary: Consulta el consentimiento de perfilamiento persistido
      description: >-
        Consulta la ultima version del consentimiento del usuario del JWT.
        No autoriza automaticamente. Devuelve vencido al alcanzar vigenteHasta.
        La vigencia elegida no puede superar 30 dias desde la decision.
      operationId: consultarConsentimientoPerfilamiento
      responses:
        "200":
          description: Consentimiento autorizado, rechazado, revocado o vencido
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentimientoPerfilamiento"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
        "404":
          description: No existe consentimiento (code consentimiento_ausente)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
    put:
      tags: [Consentimientos]
      summary: Aprueba, rechaza o revoca el perfilamiento con control de version
      description: >-
        Aprobar (autorizado=true) y rechazar (autorizado=false) requieren solicitud completa.
        autorizado=false sin solicitud revoca la ultima autorizacion conservando su alcance.
        El actor procede exclusivamente del JWT. Las fuentes son simuladas, nunca proveedores
        reales. Los clientes que antes enviaban solo el booleano deben presentar la solicitud
        al usuario y enviar su contenido; una aprobacion incompleta ahora devuelve 400.
      operationId: guardarConsentimientoPerfilamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionConsentimiento"
      responses:
        "200":
          description: Nueva version persistida junto con su evento de auditoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentimientoPerfilamiento"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/perfilamiento:
    get:
      tags: [Cotizaciones]
      summary: Consulta el mismo perfil usado para calcular la solicitud
      operationId: consultarPerfilamientoSolicitud
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Perfil vigente con ambas fuentes simuladas e integras
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfilamiento"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Consentimiento ausente, revocado, vencido o con otra version
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          description: Perfil vencido
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      description: >-
        Con ENCRYPTED_LOGIN_ENABLED=true exige NuevoUsuarioCifrado y rechaza plaintext.
        Sin habilitar conserva NuevoUsuario. Crea usuario y decision inicial de
        perfilamiento en una transaccion, sin iniciar sesion ni emitir tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/NuevoUsuario"
                - $ref: "#/components/schemas/NuevoUsuarioCifrado"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/Conflicto"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/usuarios/desafio:
    get:
      tags: [Usuarios]
      operationId: obtenerDesafioRegistro
      summary: Desafio de registro cifrado de un solo uso, valido 60 segundos
      security: []
      responses:
        "200":
          description: Clave publica y desafio de registro, no almacenar en cache
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioLogin"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/desafio:
    get:
      tags: [Sesiones]
      summary: Obtiene un desafío de login cifrado, válido 60 segundos
      operationId: obtenerDesafioLogin
      security: []
      description: >-
        Requiere ENCRYPTED_LOGIN_ENABLED=true. Sin habilitar responde 503.
        El BFF delega a identidad; no tiene clave privada ni almacén de desafíos.
      responses:
        "200":
          description: Desafío de un solo uso; no almacenar en caché
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioLogin"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones:
    post:
      tags: [Sesiones]
      summary: Inicia una sesión de cliente
      description: >-
        Con ENCRYPTED_LOGIN_ENABLED=true solo acepta CredencialesCifradas; rechaza
        contrasena y campos adicionales. Por defecto solo acepta Credenciales heredadas.
        Nunca intenta el contrato heredado si falla el login cifrado.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Credenciales"
                - $ref: "#/components/schemas/CredencialesCifradas"
      responses:
        "200":
          description: >-
            Sesión creada. El `accessToken` (JWT RS256, 1 hora) se envía como
            `Authorization: Bearer` y el `refreshToken` se usa en `/v1/sesiones/renovar`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/renovar:
    post:
      tags: [Sesiones]
      summary: Renueva la sesión con el refresh token
      description: El refresh token rota en cada uso; el anterior deja de ser válido.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nueva sesión con tokens rotados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/RefreshInvalido"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/sesiones/actual:
