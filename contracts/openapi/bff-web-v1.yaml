  /v1/solicitudes-cotizacion/{solicitudId}/seleccion:
    get:
      tags: [Ofertas]
      summary: Consulta la aceptacion registrada
      operationId: consultarSeleccionOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Aceptacion registrada, sin sustituir la validacion al continuar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      tags: [Ofertas]
      summary: Confirma explicitamente la aceptacion de una oferta
      description: |
        Conserva el contrato historico cuando no hay seleccion provisional.
        Si existe una provisional, exige revisionSeleccion y la misma referencia.
        No reemplaza una aceptacion terminal ni inicia una suscripcion.
      operationId: seleccionarOferta
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSeleccionOferta"
      responses:
        "200":
          description: Selección registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionOferta"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
  /v1/solicitudes-cotizacion/{solicitudId}/seleccion-provisional:
    get:
      tags: [Ofertas]
      summary: Reanuda la seleccion provisional sin aceptar ni mutar
      operationId: consultarSeleccionProvisional
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Estado actual; seleccion y aceptacion pueden ser null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoSeleccionProvisional"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Perfil o consentimiento no autorizado.
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    put:
      tags: [Ofertas]
      summary: Persiste una nueva revision provisional, sin aceptacion
      operationId: seleccionarOfertaProvisional
      description: |
        revisionEsperada es la revision del GET o 0 si no existe seleccion.
        Un replay devuelve el acuse original y nunca reactiva una revision vieja.
        GET es la verdad actual. La confirmacion HU14 debe renovar el resumen
        y retirar la confirmacion si cambia la referencia o revision mostrada.
        Conflictos: seleccion_desactualizada, seleccion_no_modificable o conflicto_idempotencia.
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaSeleccionProvisional"
      responses:
        "200":
          description: Snapshot de la revision registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeleccionProvisional"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: Perfil o consentimiento no autorizado.
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/suscripcion:
    get:
      tags: [Suscripciones]
      summary: Consulta la suscripción asociada a una oferta aceptada
      operationId: consultarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Suscripción encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    post:
      tags: [Suscripciones]
      summary: Procesa la suscripción de una oferta aceptada
      description: >
        Antes de crear valida la vigencia de la cotizacion y la correspondencia de la
        seleccion con la oferta, su version, prima, periodicidad y decision integra.
        Una oferta vencida o inconsistente devuelve 422 oferta_no_disponible sin
        crear suscripcion, decision, saga ni evento. Una suscripcion ya persistida
        se recupera antes de revalidar vigencia y perfil, tambien con otra clave.
        Reutilizar una clave en otra solicitud devuelve 409 sin modificar el resultado.
      operationId: iniciarSuscripcion
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Suscripción procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suscripcion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/solicitudes-cotizacion/{solicitudId}/pago-simulado:
    get:
      tags: [Pagos]
      summary: Recupera el pago simulado persistido del cliente autenticado
      description: |
        No consulta ninguna pasarela ni inicia o completa una emisión. Devuelve
        el pago confirmado si existe, despues el pendiente activo o el ultimo rechazo.
        Idempotency-Key UUID opcional selecciona exactamente el intento del cliente;
        una clave desconocida no se vincula al confirmado y devuelve pago_no_encontrado.
        Una clave usada en otra solicitud propia devuelve 409 conflicto_idempotencia.
        La respuesta
        conserva la instantánea de saga del resultado; GET suscripción informa
        el estado actual de la saga. Devuelve 404 pago_no_encontrado solo si la
        solicitud pertenece al cliente y todavía no tiene resultado; una solicitud
        inexistente o ajena devuelve 404 solicitud_no_encontrada.
      operationId: consultarPagoSimulado
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - in: header
          name: Idempotency-Key
          required: false
          description: Clave persistida antes del POST; selecciona su intento sin ejecutarlo.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado simulado persistido, incluso pendiente; esta consulta no emite pólizas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoSimulado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
    post:
      tags: [Pagos]
      summary: Procesa un intento de pago exclusivamente simulado
      description: |
        Requiere JWT e Idempotency-Key UUID. No acepta importe, moneda, cliente,
        tarjeta ni referencia bancaria. Deriva importe y periodicidad de la
        selección persistida coincidente con la suscripción aprobada y vigente.
        El simulador se configura exclusivamente en el servidor mediante
        PAGO_SIMULADO_RESULTADO=confirmado (predeterminado) o rechazado.
        Un resultado confirmado registra pago, saga pago_confirmado y evento
        PagoSimuladoConfirmado en una transacción. Un rechazo responde 200 con
        estado rechazado, rechazadaEn y motivo rechazo_simulado, sin confirmadaEn;
        persiste el intento y su evento PagoSimuladoRechazado, conserva la saga
        pago_pendiente y nunca solicita emisión. No es el error 422 de precondiciones.
        No conecta una pasarela ni realiza cobros reales.
        Con POLIZAS_SERVICE_URL configurada, los pagos nuevos confirmados solicitan emisión
        académica después de persistir su confirmación. Los pagos anteriores a
        habilitar la integración no emiten retroactivamente. La saga pasa a
        emitida solo después de recibir el ID de póliza.
        Si falla la emisión o se pierde su acuse, responde 503 aunque el pago
        ya esté persistido. Repetir POST en la misma solicitud recupera el pago
        y reintenta la emisión idempotente, sin duplicar pago ni póliza.
        La respuesta confirmada conserva la instantánea saga pago_confirmado;
        consultar GET /v1/solicitudes-cotizacion/{solicitudId}/suscripcion para
        conocer el estado actual de la saga. GET pago no completa la emisión.
        Con COTIZACION_CONCILIACION_EMISION_HABILITADA=true en el servidor,
        los pagos nuevos confirmados mientras está activa registran elegibilidad
        durable para reintentar automáticamente solo la emisión académica.
        Está deshabilitada por defecto y no activa pagos históricos ni rechazos.
        La recuperación automática y el POST manual conservan el mismo pago,
        póliza y snapshot, sin reevaluar el resultado financiero.
        Una reserva durable precede al efecto idempotente del simulador. Una perdida
        de respuesta tipada devuelve 200 pendiente, codigo resultado_no_confirmado,
        creadaEn y saga pago_pendiente sin fecha terminal ni motivo de rechazo.
        La recuperacion interna consulta el mismo efecto y finaliza por CAS, sin
        depender de la bandera o URL de emision. Nunca rechaza por agotar reintentos.
        Persistir solicitud y clave antes del POST; tras incertidumbre recuperar por
        GET con esa clave, sin nuevo cobro. Otra clave durante pendiente devuelve
        409 pago_en_proceso con pagoId y Location, sin aceptar la clave rival.
        En ese conflicto, GET sin selector y cotejo de pagoId; nunca reenviar la
        clave rival como selector ni asociarla al intento existente.
        No implementa firma, documento de póliza ni una pasarela real. La recuperación académica no
        acredita una póliza válida sin firma ni el SLA productivo de emisión.
        La misma clave recupera el resultado original aunque cambie el escenario
        del servidor. Tras un rechazo, una nueva clave inicia otro intento si las
        precondiciones siguen vigentes. Un pago confirmado por solicitud/suscripción:
        otra clave devuelve ese pago, sin procesar otro. Un replay de una clave
        rechazada conserva el rechazo incluso después de otra confirmación.
        El replay persiste tras vencimiento o posterior avance de saga.
        Una clave de creación usada en otra solicitud devuelve 409.
        La primera confirmación con oferta vencida, suscripción no aprobada,
        selección distinta o saga no pendiente devuelve 422 pago_no_permitido.
      operationId: confirmarPagoSimulado
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: Intento confirmado, rechazado o pendiente no terminal, sin duplicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoSimulado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Clave usada en otra solicitud o intento pendiente con otra clave
          headers:
            Location:
              description: GET del pago cuando code es pago_en_proceso
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problema"
                  - $ref: "#/components/schemas/ProblemaPagoEnProceso"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/dashboard:
    get:
      tags: [Dashboard]
      summary: Consulta el resumen del cliente autenticado
      operationId: consultarDashboard
      description: |
        Lee exclusivamente registros persistidos del cliente derivado del JWT.
        No admite query ni cuerpo. Una coleccion vacia es una consulta real sin registros;
        polizas contiene emisiones academicas persistidas, no cobertura real.
        Polizas es una dependencia obligatoria: si falta o falla devuelve 503,
        nunca el marcador legado no_implementado ni una lista vacia artificial.
        Notificaciones conserva el descriptor no_implementado.
        No recalcula primas, no renueva perfiles y no agrega importes de monedas
        o periodicidades distintas. Los pagos son exclusivamente simulados.
      responses:
        "200":
          description: Resumen del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/siniestros/{siniestroId}:
    get:
      tags: [Siniestros]
      summary: Consulta el estado vigente y el historial permitido de un siniestro
      operationId: consultarEstadoSiniestro
      description: |
        HU25 (SOL-318). El cliente se deriva exclusivamente del JWT; no admite query ni cuerpo.
        Devuelve el estado vigente, su fecha de actualizacion y el historial permitido al
        cliente en orden cronologico. El ultimo elemento del historial siempre corresponde
        al estado vigente. Un siniestro inexistente o de otro cliente responde el mismo 404,
        sin datos del caso. Un fallo de consulta o un registro incoherente responde 503;
        nunca se presenta como estado valido ni como historial vacio.
      parameters:
        - name: siniestroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado e historial permitido del siniestro
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoSiniestro"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/renovacion:
    get:
      tags: [Polizas]
      summary: Consulta la elegibilidad y las condiciones de renovacion de una poliza
      operationId: consultarRenovacionPoliza
      description: |
        HU33 (SOL-317). El cliente se deriva exclusivamente del JWT; no admite query ni cuerpo.
        Solo los productos de vigencia mensual son renovables, desde 15 dias antes del fin y
        mientras la poliza este vigente. Si es renovable devuelve la oferta con nueva vigencia
        contigua, coberturas, prima, condiciones y `condicionesHash`, que el cliente debe aceptar
        explicitamente. `ultimoIntento` permite recuperar un resultado pendiente o rechazado.
        Una poliza inexistente o de otro cliente responde el mismo 404.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
      responses:
        "200":
          description: Elegibilidad y oferta de renovacion
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElegibilidadRenovacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/renovaciones:
    post:
      tags: [Polizas]
      summary: Confirma la renovacion aceptada y procesa su pago simulado
      operationId: renovarPoliza
      description: |
        HU33 (SOL-317), ASR-EMI-01 y ASR-FIN-01. Exige `aceptaCondiciones: true` y el
        `condicionesHash` de la oferta vigente; si las condiciones cambiaron responde 409
        `condiciones_cambiaron`. El intento se registra antes del cobro simulado y la nueva
        vigencia solo se registra con el pago confirmado, sin crear otra poliza. Un pago
        rechazado conserva la poliza original y deja el intento como `rechazada`. Si el
        resultado del pago es ambiguo responde 202 `pendiente`: repetir con la misma
        Idempotency-Key recupera el mismo intento y nunca genera un segundo cobro. Otra clave
        para el mismo periodo responde 409 `renovacion_en_curso` con `renovacionId`.
        201 = intento nuevo con resultado definitivo; 200 = reintento con la misma clave.
        Un 503 no confirma ni descarta la renovacion: se debe reintentar con la misma clave.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRenovacion"
      responses:
        "200":
          description: Reintento con la misma clave; devuelve el resultado registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovacionPoliza"
        "201":
          description: Renovacion registrada como renovada o rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovacionPoliza"
        "202":
          description: Pago ambiguo; la renovacion queda pendiente de conciliacion
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/modificacion:
    get:
      tags: [Polizas]
      summary: Consulta la version vigente, el historial y los cambios permitidos
      operationId: consultarModificacionPoliza
      description: |
        HU34 (SOL-319). El cliente se deriva del JWT; no admite query ni cuerpo. Solo los
        productos de vigencia mensual son modificables mientras la poliza este vigente y no
        termine hoy. Los unicos campos modificables son `plan` y las coberturas opcionales
        listadas en `opciones`; las obligatorias siempre se conservan. `historial` contiene
        todas las versiones, de la mas reciente a la mas antigua; la version 1 corresponde a
        las condiciones de emision.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
      responses:
        "200":
          description: Version vigente, historial y opciones
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoModificacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/modificaciones/simulacion:
    post:
      tags: [Polizas]
      summary: Calcula el impacto de una modificacion sin aplicarla
      operationId: simularModificacionPoliza
      description: |
        HU34 (SOL-319). Valida los cambios y devuelve el impacto en prima (mensual y
        prorrateada), coberturas y vigencia, con `impactoHash` para confirmar. No persiste.
        `422 cambio_no_permitido` (con `campo`) si se pide una cobertura no autorizada y
        `422 sin_cambios` si la propuesta es igual a la vigente. `409 version_desactualizada`
        (con `versionActual`) si `versionBase` no es la vigente.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudModificacion"
      responses:
        "200":
          description: Impacto de la modificacion propuesta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactoModificacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/modificaciones:
    post:
      tags: [Polizas]
      summary: Confirma la modificacion y persiste una nueva version de la poliza
      operationId: confirmarModificacionPoliza
      description: |
        HU34 (SOL-319), D-09 y ASR-AUD-01. Exige `confirma: true` y el `impactoHash` de la
        simulacion. Recalcula el impacto y, si coincide, crea en una sola transaccion el
        endoso y la nueva version, conservando las anteriores. Si el impacto cambio responde
        `409 impacto_cambio`; si otra modificacion avanzo la version, `409
        version_desactualizada`. Ningun rechazo aplica cambios parciales y todos quedan
        auditados. 201 = endoso nuevo; 200 = reintento con la misma Idempotency-Key.
        Un 503 no confirma ni descarta: se debe reintentar con la misma clave.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmacionModificacion"
      responses:
        "200":
          description: Reintento con la misma clave; devuelve el endoso registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModificacionPoliza"
        "201":
          description: Endoso confirmado y nueva version vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModificacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/cancelacion:
    get:
      tags: [Polizas]
      summary: Consulta si la poliza se puede cancelar y la liquidacion resultante
      operationId: consultarCancelacionPoliza
      description: |
        HU35 (SOL-321). El cliente se deriva del JWT; no admite query ni cuerpo. Solo los
        productos de vigencia mensual se cancelan, mientras esten vigentes, no terminen hoy y
        no tengan una renovacion con pago pendiente. Si es cancelable, `liquidacion` informa la
        fecha efectiva (la cobertura termina ese mismo dia), las coberturas que finalizan, la
        devolucion proporcional de los dias no usados, la devolucion de periodos renovados que
        aun no inician y los valores pendientes, con `liquidacionHash` para confirmar. Una
        poliza ya cancelada responde `motivo: poliza_cancelada` con la `cancelacion`
        registrada, de modo que el cliente puede recuperar el resultado.
      parameters:
        - $ref: "#/components/parameters/PolizaId"
      responses:
        "200":
          description: Elegibilidad, liquidacion y cancelacion registrada
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoCancelacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/me/polizas/{polizaId}/cancelaciones:
    post:
      tags: [Polizas]
      summary: Confirma la cancelacion de la poliza
      operationId: confirmarCancelacionPoliza
      description: |
        HU35 (SOL-321) y ASR-AUD-01. Exige `confirma: true`, el motivo y el
        `liquidacionHash` consultado. Recalcula la liquidacion y, si coincide, cancela la
        poliza en una sola transaccion: la cobertura termina en la fecha efectiva y la poliza
        deja de admitir renovaciones, modificaciones y cobros posteriores. Si la liquidacion
        cambio responde `409 liquidacion_cambio`; si ya no es cancelable, `422
        poliza_no_cancelable` con `motivo`. El actor, la fecha y el motivo quedan auditados,
        igual que los rechazos. 201 = cancelacion nueva; 200 = reintento con la misma
        Idempotency-Key. Un 503 no confirma ni descarta: se debe reintentar con la misma
        clave. La devolucion es simulada (`simulada: true`).
      parameters:
        - $ref: "#/components/parameters/PolizaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmacionCancelacion"
      responses:
        "200":
          description: Reintento con la misma clave; devuelve la cancelacion registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelacionPoliza"
        "201":
          description: Poliza cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelacionPoliza"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ReglaNegocio"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/reportes/operativos:
    get:
      tags: [Reportes]
      summary: Consolida indicadores operativos de polizas, primas, siniestros y pagos
      operationId: consultarReporteOperativo
      description: |
        HU36 (SOL-322). Requiere JWT con rol y scope asesor; otros perfiles reciben 403
        alcance_insuficiente sin consultar las fuentes. Solo admite los filtros documentados
        (cada uno con un unico valor); cualquier otro parametro responde 400.
        Los indicadores se calculan desde fuentes propietarias identificables (polizas,
        cotizacion para primas y siniestros para siniestros y pagos) leidas al mismo corte;
        ninguna fuente entrega ni el reporte expone datos personales.
        La huella es el SHA-256 del JSON canonico del reporte sin generadoEn: el mismo corte
        y filtros producen la misma huella. Si cualquier fuente falla o responde datos
        incoherentes se responde 503 consolidacion_incompleta sin indicadores parciales.
        Toda consulta, autorizada o rechazada, se audita con actor, filtros, corte, huella y
        correlationId.
      parameters:
        - $ref: "#/components/parameters/ReporteDesde"
        - $ref: "#/components/parameters/ReporteHasta"
        - $ref: "#/components/parameters/ReporteProducto"
        - $ref: "#/components/parameters/ReporteEstado"
        - name: corte
          in: query
          required: false
          description: >-
            Instante de corte ISO 8601 con zona horaria, no futuro. Si se omite se fija
            un minuto antes del instante actual, truncado al segundo.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Reporte consolidado al corte
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteOperativo"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente; el usuario no esta autorizado para reportes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          $ref: "#/components/responses/ConsolidacionIncompleta"
  /v1/reportes/operativos/descarga:
    get:
      tags: [Reportes]
      summary: Descarga en CSV el reporte operativo confirmado para un corte
      operationId: descargarReporteOperativo
      description: |
        HU36 (SOL-322). Recalcula el reporte con los mismos filtros y corte y solo lo
        entrega si su huella coincide con la confirmada en la consulta; en otro caso
        responde 409 reporte_no_reproducible. El CSV tiene columnas
        ambito,indicador,dimension,moneda,valor, incluye corte, huella, filtros, indicadores
        y fuentes, y no contiene identificadores ni datos personales. La descarga se audita.
      parameters:
        - $ref: "#/components/parameters/ReporteDesde"
        - $ref: "#/components/parameters/ReporteHasta"
        - $ref: "#/components/parameters/ReporteProducto"
        - $ref: "#/components/parameters/ReporteEstado"
        - name: corte
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: huella
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: CSV del reporte confirmado
          headers:
            Cache-Control:
              schema:
                const: no-store
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="reporte-operativo-0123456789ab.csv"
            X-Reporte-Huella:
              schema:
                type: string
            X-Reporte-Corte:
              schema:
                type: string
                format: date-time
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          $ref: "#/components/responses/Conflicto"
        "503":
          $ref: "#/components/responses/ConsolidacionIncompleta"
  /v1/reportes/operativos/opciones:
    get:
      tags: [Reportes]
      summary: Catalogo de filtros permitidos para reportes operativos
      operationId: consultarOpcionesReporteOperativo
      description: Requiere JWT con rol y scope asesor. No admite parametros.
      responses:
        "200":
          description: Productos, estados de poliza y periodo maximo permitidos
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [productos, estados, periodoMaximoDias]
                properties:
                  productos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductoReporte"
                  estados:
                    type: array
                    items:
                      $ref: "#/components/schemas/EstadoPolizaReporte"
                  periodoMaximoDias:
                    type: integer
                    const: 366
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          description: alcance_insuficiente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por identidad (dura 1 hora).
  parameters:
    PolizaId:
      name: polizaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
        pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ApiVersion:
      name: API-Version
      in: header
      required: false
      schema:
        type: string
        enum: ["1"]
        default: "1"
      description: Una version distinta devuelve 400 version_no_soportada.
    ReporteDesde:
      name: desde
      in: query
      required: true
      description: Primer dia (UTC) del periodo. El periodo no supera 366 dias.
      schema:
        type: string
        format: date
    ReporteHasta:
      name: hasta
      in: query
      required: true
      description: Ultimo dia (UTC) del periodo; no puede ser posterior al dia del corte.
      schema:
        type: string
        format: date
    ReporteProducto:
      name: producto
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProductoReporte"
    ReporteEstado:
      name: estado
      in: query
      required: false
      description: Estado de vigencia de la poliza al corte.
      schema:
        $ref: "#/components/schemas/EstadoPolizaReporte"
  responses:
    ConsolidacionIncompleta:
      description: >-
        consolidacion_incompleta; una fuente fallo o respondio datos incoherentes. Incluye
        la extension fuente y nunca indicadores parciales.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CuotaSocio:
      description: cuota_socio_excedida o socio_ocupado, sin iniciar perfilamiento
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CredencialesInvalidas:
      description: Credenciales inválidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RefreshInvalido:
      description: El refresh token no existe, expiró o ya fue usado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutorizado:
      description: El access token falta, expiró o no es válido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoEncontrado:
      description: El recurso no existe o no pertenece al cliente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Conflicto con el estado actual del recurso
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ReglaNegocio:
      description: Una regla de negocio impide la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Se superó el límite de solicitudes permitido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    ProductoReporte:
      type: string
      enum:
        - automotive
        - travel
        - life
        - device-protection
        - parametric
        - parametric-weather
        - payment-protection
        - mortgage-life
    EstadoPolizaReporte:
      type: string
      enum: [programada, vigente, vencida, cancelada]
    TotalMoneda:
      type: object
      additionalProperties: false
      required: [moneda, monto]
      properties:
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
        monto:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
    ReporteOperativo:
      type: object
      additionalProperties: false
      description: >-
        Indicadores agregados sin datos personales. Polizas: cartera al corte y emitidas en
        el periodo. Primas: pagos confirmados en el periodo. Siniestros: reportados en el
        periodo con su estado al corte. Pagos: pagos parametricos creados en el periodo con
        su estado al corte. Los filtros de producto y estado se aplican sobre la poliza.
      required:
        [corte, generadoEn, filtros, indicadores, porProducto, inconsistencias, fuentes, huella]
      properties:
        corte:
          type: string
          format: date-time
        generadoEn:
          type: string
          format: date-time
          description: Instante de calculo; no forma parte de la huella.
        filtros:
          type: object
          additionalProperties: false
          required: [desde, hasta, producto, estado]
          properties:
            desde:
              type: string
              format: date
            hasta:
              type: string
              format: date
            producto:
              oneOf:
                - $ref: "#/components/schemas/ProductoReporte"
                - type: "null"
            estado:
              oneOf:
                - $ref: "#/components/schemas/EstadoPolizaReporte"
                - type: "null"
        indicadores:
          type: object
          additionalProperties: false
          required: [polizas, primas, siniestros, pagos]
          properties:
            polizas:
              type: object
              additionalProperties: false
              required: [emitidasEnPeriodo, cartera, porEstado]
              properties:
                emitidasEnPeriodo:
                  type: integer
                  minimum: 0
                cartera:
                  type: integer
                  minimum: 0
                porEstado:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
            primas:
              type: object
              additionalProperties: false
              required: [confirmadas, totales]
              properties:
                confirmadas:
                  type: integer
                  minimum: 0
                totales:
                  type: array
                  items:
                    $ref: "#/components/schemas/TotalMoneda"
            siniestros:
              type: object
              additionalProperties: false
              required: [reportados, porEstado, porTipo]
              properties:
                reportados:
                  type: integer
                  minimum: 0
                porEstado:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                porTipo:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
            pagos:
              type: object
              additionalProperties: false
              required: [registrados, porEstado, totales]
              properties:
                registrados:
                  type: integer
                  minimum: 0
                porEstado:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                totales:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [estado, moneda, monto]
                    properties:
                      estado:
                        type: string
                        enum: [pendiente, confirmado, rechazado]
                      moneda:
                        type: string
                      monto:
                        type: string
        porProducto:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - producto
              - polizasEmitidas
              - cartera
              - primasConfirmadas
              - primas
              - siniestrosReportados
              - pagosRegistrados
            properties:
              producto:
                $ref: "#/components/schemas/ProductoReporte"
              polizasEmitidas:
                type: integer
              cartera:
                type: integer
              primasConfirmadas:
                type: integer
              primas:
                type: array
                items:
                  $ref: "#/components/schemas/TotalMoneda"
              siniestrosReportados:
                type: integer
              pagosRegistrados:
                type: integer
        inconsistencias:
          type: object
          additionalProperties: false
          description: Diferencias entre fuentes informadas explicitamente, no ocultas.
          required:
            [siniestrosSinPoliza, polizasSinPrima, primasConProductoDistinto, pagosSinSiniestro]
          properties:
            siniestrosSinPoliza:
              type: integer
            polizasSinPrima:
              type: integer
            primasConProductoDistinto:
              type: integer
            pagosSinSiniestro:
              type: integer
        fuentes:
          type: array
          description: Trazabilidad de cada fuente leida al corte.
          items:
            type: object
            additionalProperties: false
            required: [servicio, registros, huella]
            properties:
              servicio:
                type: string
                enum: [polizas, primas, siniestros]
              registros:
                type: integer
                minimum: 0
              huella:
                type: string
                pattern: "^[0-9a-f]{64}$"
        huella:
          type: string
          pattern: "^[0-9a-f]{64}$"
    MontoCop:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^-?[0-9]{1,16}$"
        moneda:
          const: COP
    CoberturaPoliza:
      type: object
      additionalProperties: false
      required: [codigo, nombre, descripcion, opcional, incluida]
      properties:
        codigo:
          type: string
          pattern: "^[a-z_]{1,40}$"
        nombre:
          type: string
        descripcion:
          type: string
        opcional:
          type: boolean
          description: Las coberturas no opcionales siempre estan incluidas.
        incluida:
          type: boolean
    VersionPoliza:
      type: object
      additionalProperties: false
      required: [version, plan, coberturas, prima, efectivoDesde, origen, endosoId, creadaEn]
      properties:
        version:
          type: integer
          minimum: 1
        plan:
          enum: [esencial, integral, premium]
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaPoliza"
        prima:
          $ref: "#/components/schemas/PrimaRenovacion"
        efectivoDesde:
          type: string
          format: date
        origen:
          enum: [emision, modificacion]
        endosoId:
          type: [string, "null"]
          format: uuid
        creadaEn:
          type: string
          format: date-time
    OpcionesModificacion:
      type: object
      additionalProperties: false
      required: [planes, coberturasOpcionales]
      properties:
        planes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codigo, nombre, factor]
            properties:
              codigo:
                enum: [esencial, integral, premium]
              nombre:
                type: string
              factor:
                type: string
                pattern: "^[0-9]+\\.[0-9]{2}$"
        coberturasOpcionales:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codigo, nombre, recargo]
            properties:
              codigo:
                type: string
                pattern: "^[a-z_]{1,40}$"
              nombre:
                type: string
              recargo:
                $ref: "#/components/schemas/MontoCop"
    EstadoModificacionPoliza:
      type: object
      additionalProperties: false
      required:
        - polizaId
        - tipo
        - vigencia
        - modificable
        - motivo
        - versionActual
        - opciones
        - historial
      properties:
        polizaId:
          type: string
          format: uuid
        tipo:
          type: string
        vigencia:
          $ref: "#/components/schemas/PeriodoVigencia"
        modificable:
          type: boolean
        motivo:
          enum:
            - producto_no_modificable
            - poliza_cancelada
            - poliza_programada
            - poliza_vencida
            - fin_de_vigencia
            - null
        versionActual:
          oneOf:
            - $ref: "#/components/schemas/VersionPoliza"
            - type: "null"
        opciones:
          oneOf:
            - $ref: "#/components/schemas/OpcionesModificacion"
            - type: "null"
        historial:
          type: array
          items:
            $ref: "#/components/schemas/VersionPoliza"
    SolicitudModificacion:
      type: object
      additionalProperties: false
      required: [versionBase, plan, coberturasOpcionales]
      properties:
        versionBase:
          type: integer
          minimum: 1
        plan:
          enum: [esencial, integral, premium]
        coberturasOpcionales:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z_]{1,40}$"
    ConfirmacionModificacion:
      type: object
      additionalProperties: false
      required: [versionBase, plan, coberturasOpcionales, confirma, impactoHash]
      properties:
        versionBase:
          type: integer
          minimum: 1
        plan:
          enum: [esencial, integral, premium]
        coberturasOpcionales:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z_]{1,40}$"
        confirma:
          const: true
        impactoHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ImpactoModificacion:
      type: object
      additionalProperties: false
      required:
        - versionBase
        - plan
        - coberturas
        - coberturasAgregadas
        - coberturasRetiradas
        - primaAnterior
        - primaNueva
        - diferenciaMensual
        - ajusteProrrateado
        - diasRestantes
        - efectivoDesde
        - vigencia
        - reglaVersion
        - impactoHash
      properties:
        versionBase:
          type: integer
          minimum: 1
        plan:
          type: object
          additionalProperties: false
          required: [anterior, nuevo]
          properties:
            anterior:
              enum: [esencial, integral, premium]
            nuevo:
              enum: [esencial, integral, premium]
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaPoliza"
        coberturasAgregadas:
          type: array
          items:
            type: string
        coberturasRetiradas:
          type: array
          items:
            type: string
        primaAnterior:
          $ref: "#/components/schemas/MontoCop"
        primaNueva:
          $ref: "#/components/schemas/MontoCop"
        diferenciaMensual:
          $ref: "#/components/schemas/MontoCop"
        ajusteProrrateado:
          $ref: "#/components/schemas/MontoCop"
        diasRestantes:
          type: integer
          minimum: 1
        efectivoDesde:
          type: string
          format: date
        vigencia:
          type: object
          additionalProperties: false
          required: [inicio, fin, cambia]
          properties:
            inicio:
              type: string
              format: date
            fin:
              type: string
              format: date
            cambia:
              const: false
        reglaVersion:
          type: string
        impactoHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ModificacionPoliza:
      type: object
      additionalProperties: false
      required:
        [endosoId, polizaId, versionAnterior, versionNueva, version, impacto, creadoEn]
      properties:
        endosoId:
          type: string
          format: uuid
        polizaId:
          type: string
          format: uuid
        versionAnterior:
          type: integer
          minimum: 1
        versionNueva:
          type: integer
          minimum: 2
        version:
          $ref: "#/components/schemas/VersionPoliza"
        impacto:
          $ref: "#/components/schemas/ImpactoModificacion"
        creadoEn:
          type: string
          format: date-time
    PeriodoVigencia:
      type: object
      additionalProperties: false
      required: [inicio, fin]
      properties:
        inicio:
          type: string
          format: date
        fin:
          type: string
          format: date
    LiquidacionCancelacion:
      type: object
      additionalProperties: false
      description: |
        Efectos economicos de cancelar hoy. `devolucion` = `devolucionProporcional` (prima
        mensual vigente por `diasNoUsados` / `diasPeriodo`) + `devolucionPeriodosAnulados`.
        Los periodos se pagan por anticipado, por lo que `valorPendiente` es cero.
      required:
        - fechaEfectiva
        - finCobertura
        - coberturasFinalizadas
        - periodoActual
        - periodosAnulados
        - primaMensual
        - diasPeriodo
        - diasNoUsados
        - devolucionProporcional
        - devolucionPeriodosAnulados
        - devolucion
        - valorPendiente
        - reglaVersion
        - liquidacionHash
      properties:
        fechaEfectiva:
          type: string
          format: date
        finCobertura:
          type: string
          format: date
        coberturasFinalizadas:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [codigo, nombre]
            properties:
              codigo:
                type: string
                pattern: "^[a-z_]{1,40}$"
              nombre:
                type: string
        periodoActual:
          $ref: "#/components/schemas/PeriodoVigencia"
        periodosAnulados:
          type: array
          description: Periodos renovados y pagados que aun no inician.
          items:
            type: object
            additionalProperties: false
            required: [inicio, fin, prima]
            properties:
              inicio:
                type: string
                format: date
              fin:
                type: string
                format: date
              prima:
                $ref: "#/components/schemas/MontoCop"
        primaMensual:
          $ref: "#/components/schemas/MontoCop"
        diasPeriodo:
          type: integer
          minimum: 1
        diasNoUsados:
          type: integer
          minimum: 0
        devolucionProporcional:
          $ref: "#/components/schemas/MontoCop"
        devolucionPeriodosAnulados:
          $ref: "#/components/schemas/MontoCop"
        devolucion:
          $ref: "#/components/schemas/MontoCop"
        valorPendiente:
          $ref: "#/components/schemas/MontoCop"
        reglaVersion:
          type: string
        liquidacionHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    MotivoCancelacion:
      enum: [ya_no_la_necesito, costo, cambio_de_aseguradora, insatisfaccion, otro]
    CancelacionPoliza:
      type: object
      additionalProperties: false
      description: Cancelacion academica registrada; `simulada` siempre es true.
      required:
        - id
        - polizaId
        - estado
        - motivoCancelacion
        - fechaEfectiva
        - liquidacion
        - confirmadaEn
        - simulada
      properties:
        id:
          type: string
          format: uuid
        polizaId:
          type: string
          format: uuid
        estado:
          const: cancelada
        motivoCancelacion:
          $ref: "#/components/schemas/MotivoCancelacion"
        fechaEfectiva:
          type: string
          format: date
        liquidacion:
          $ref: "#/components/schemas/LiquidacionCancelacion"
        confirmadaEn:
          type: string
          format: date-time
        simulada:
          const: true
    EstadoCancelacionPoliza:
      type: object
      additionalProperties: false
      required:
        - polizaId
        - tipo
        - estado
        - vigencia
        - cancelable
        - motivo
        - liquidacion
        - cancelacion
      properties:
        polizaId:
          type: string
          format: uuid
        tipo:
          type: string
        estado:
          enum: [activa, cancelada]
        vigencia:
          $ref: "#/components/schemas/PeriodoVigencia"
        cancelable:
          type: boolean
        motivo:
          enum:
            - producto_no_cancelable
            - poliza_cancelada
            - poliza_programada
            - poliza_vencida
            - fin_de_vigencia
            - renovacion_en_curso
            - null
        liquidacion:
          oneOf:
            - $ref: "#/components/schemas/LiquidacionCancelacion"
            - type: "null"
        cancelacion:
          oneOf:
            - $ref: "#/components/schemas/CancelacionPoliza"
            - type: "null"
    ConfirmacionCancelacion:
      type: object
      additionalProperties: false
      required: [confirma, motivoCancelacion, liquidacionHash]
      properties:
        confirma:
          const: true
        motivoCancelacion:
          $ref: "#/components/schemas/MotivoCancelacion"
        liquidacionHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    CoberturaRenovacion:
      type: object
      additionalProperties: false
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
    PrimaRenovacion:
      type: object
      additionalProperties: false
      required: [monto, moneda, periodicidad]
      properties:
        monto:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
          description: Valor entero en pesos, como texto para no perder precision.
        moneda:
          const: COP
        periodicidad:
          const: mensual
    OfertaRenovacion:
      type: object
      additionalProperties: false
      required:
        - polizaId
        - producto
        - finAnterior
        - nuevaVigencia
        - coberturas
        - prima
        - condiciones
        - requierePago
        - reglaVersion
        - condicionesHash
      properties:
        polizaId:
          type: string
          format: uuid
        producto:
          type: string
        finAnterior:
          type: string
          format: date
        nuevaVigencia:
          $ref: "#/components/schemas/PeriodoVigencia"
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaRenovacion"
        prima:
          $ref: "#/components/schemas/PrimaRenovacion"
        condiciones:
          type: array
          minItems: 1
          items:
            type: string
        requierePago:
          type: boolean
        reglaVersion:
          type: string
        condicionesHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    RenovacionPoliza:
      type: object
      additionalProperties: false
      description: Intento de renovacion academica; `simulada` siempre es true.
      required:
        - id
        - polizaId
        - estado
        - motivo
        - finAnterior
        - nuevaVigencia
        - coberturas
        - prima
        - condiciones
        - condicionesHash
        - reglaVersion
        - creadaEn
        - actualizadaEn
        - simulada
      properties:
        id:
          type: string
          format: uuid
        polizaId:
          type: string
          format: uuid
        estado:
          enum: [pendiente, renovada, rechazada]
        motivo:
          enum: [pago_rechazado, poliza_cancelada, null]
          description: |
            `poliza_cancelada` si la poliza se cancelo mientras el pago estaba pendiente;
            en ese caso no se cobra ni se extiende la vigencia.
        finAnterior:
          type: string
          format: date
        nuevaVigencia:
          $ref: "#/components/schemas/PeriodoVigencia"
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaRenovacion"
        prima:
          $ref: "#/components/schemas/PrimaRenovacion"
        condiciones:
          type: array
          minItems: 1
          items:
            type: string
        condicionesHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        reglaVersion:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        simulada:
          const: true
    ElegibilidadRenovacion:
      type: object
      additionalProperties: false
      required:
        - polizaId
        - tipo
        - vigenciaActual
        - renovable
        - motivo
        - ventana
        - oferta
        - ultimoIntento
      properties:
        polizaId:
          type: string
          format: uuid
        tipo:
          type: string
        vigenciaActual:
          $ref: "#/components/schemas/PeriodoVigencia"
        renovable:
          type: boolean
        motivo:
          enum:
            - producto_no_renovable
            - poliza_cancelada
            - poliza_programada
            - poliza_vencida
            - fuera_de_ventana
            - null
        ventana:
          type: object
          additionalProperties: false
          required: [desde, hasta]
          properties:
            desde:
              type: string
              format: date
            hasta:
              type: string
              format: date
        oferta:
          oneOf:
            - $ref: "#/components/schemas/OfertaRenovacion"
            - type: "null"
        ultimoIntento:
          oneOf:
            - $ref: "#/components/schemas/RenovacionPoliza"
            - type: "null"
    SolicitudRenovacion:
      type: object
      additionalProperties: false
      required: [aceptaCondiciones, condicionesHash]
      properties:
        aceptaCondiciones:
          const: true
        condicionesHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    EstadoSiniestro:
      type: object
      additionalProperties: false
      description: >-
        Proyeccion para el cliente del agregado Siniestro. No incluye monto reclamado,
        decision, evaluacion de fraude ni evidencias (datos restringidos).
      required:
        [id, polizaId, tipo, estado, descripcion, ocurridoEn, reportadoEn, actualizadoEn, historial]
      properties:
        id:
          type: string
          format: uuid
        polizaId:
          type: string
          format: uuid
        tipo:
          type: [string, "null"]
          enum: [asistido, parametrico, null]
          description: Clasificacion del dominio; null mientras no exista una clasificacion real.
        estado:
          $ref: "#/components/schemas/CodigoEstadoSiniestro"
        descripcion:
          type: string
          minLength: 1
        ocurridoEn:
          type: string
          format: date-time
          description: Instante del evento; nunca posterior a reportadoEn.
        reportadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
          description: Instante del cambio que fijo el estado vigente.
        historial:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CambioEstadoSiniestro"
    CambioEstadoSiniestro:
      type: object
      additionalProperties: false
      required: [estado, descripcion, ocurridoEn]
      properties:
        estado:
          $ref: "#/components/schemas/CodigoEstadoSiniestro"
        descripcion:
          type: string
          minLength: 1
        ocurridoEn:
          type: string
          format: date-time
    CodigoEstadoSiniestro:
      type: string
      enum:
        - reportado
        - en_evaluacion
        - en_revision
        - en_inspeccion
        - aprobado
        - rechazado
        - pagado
        - cerrado
    ClienteRegistrado:
      type: object
      additionalProperties: false
      required: [clienteId, nombre, correo]
      properties:
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
    ConsultaInformacionCliente:
      type: object
      additionalProperties: false
      required: [operationId, socioId, productoId, finalidad, datosSolicitados]
      oneOf:
        - required: [clienteId]
          not:
            anyOf:
              - required: [tipoDocumento]
              - required: [numeroDocumento]
        - required: [tipoDocumento, numeroDocumento]
          not:
            required: [clienteId]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        clienteId:
          type: string
          format: uuid
          description: Identificador interno para clientes heredados sin documento maestro.
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        numeroDocumento:
          type: string
          minLength: 5
          maxLength: 16
          description: cc 6-10 digitos; ce 6-12; passport 5-16 A-Z/0-9; ppt 7-10 digitos.
        productoId:
          type: string
          minLength: 1
          maxLength: 64
        finalidad:
          const: cotizacion
        datosSolicitados:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
    InformacionClienteAutorizada:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - actorId
        - clienteId
        - productoId
        - finalidad
        - estado
        - consentimientoId
        - consentimientoVersion
        - datos
        - evidenciaFuentes
        - consultadaEn
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        actorId:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        finalidad:
          const: cotizacion
        estado:
          const: completada
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
        datos:
          type: object
          additionalProperties:
            type: string
          description: Solo contiene la intersección entre datos solicitados y consentidos.
        evidenciaFuentes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fuente, version, consultadaEn, simulada]
            properties:
              fuente:
                enum: [open_finance, open_data]
              version:
                type: string
              consultadaEn:
                type: string
                format: date-time
              simulada:
                type: boolean
        consultadaEn:
          type: string
          format: date-time
    NuevaSolicitudSocio:
      type: object
      additionalProperties: false
      required: [operationId, socioId, productoId, datosProducto, cliente]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        productoId:
          const: mortgage-life
        datosProducto:
          type: object
          additionalProperties: false
          required: [mortgageBalance, referenciaCredito]
          properties:
            mortgageBalance:
              type: string
              pattern: "^[1-9][0-9]{0,15}$"
            referenciaCredito:
              type: string
              pattern: "^[A-Za-z0-9-]{4,30}$"
        cliente:
          type: object
          additionalProperties: false
          required: [tipoCliente, tipoDocumento, numeroDocumento]
          properties:
            tipoCliente:
              const: persona_natural
            tipoDocumento:
              enum: [cc, ce, passport, ppt]
            numeroDocumento:
              type: string
              description: cc 6-10 digitos; ce 6-12; passport 5-16 A-Z/0-9; ppt 7-10 digitos.
    OperacionSocio:
      type: object
      additionalProperties: false
      required: [operationId, socioId, clienteId, productoId, estado, perfilamientoReferencia, solicitudId, cotizacionId, recibidaEn, oferta]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        estado:
          const: completada
        perfilamientoReferencia:
          type: string
          description: Referencia opaca del perfil persistido.
        solicitudId:
          type: string
        cotizacionId:
          type: string
          format: uuid
        oferta:
          $ref: "#/components/schemas/OfertaHipotecariaSocio"
        recibidaEn:
          type: string
          format: date-time
    OfertaSocio:
      type: object
      additionalProperties: false
      required: [ofertaId, operationId, socioId, clienteId, productoId, solicitudId, cotizacionId, estado, calculadaEn, vigenteHasta, decision, riesgo, fuentes, variables, ofertas, hashContenido]
      properties:
        ofertaId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        solicitudId:
          type: string
        cotizacionId:
          type: string
          format: uuid
        estado:
          type: string
          enum: [vigente, vencida]
        calculadaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        decision:
          type: object
          additionalProperties: false
          required: [hashDecision, modelo, reglaId, reglaVersion]
          properties:
            hashDecision:
              type: string
              pattern: "^[0-9a-f]{64}$"
            modelo:
              type: string
              description: academico-v1 o clima-v1
            reglaId:
              type: string
              format: uuid
            reglaVersion:
              type: string
        riesgo:
          type: object
          additionalProperties: false
          required: [perfilId, version, modeloVersion, score, nivel, consentimientoId, consentimientoVersion, calculadoEn, vigenteHasta, fallbackUsed]
          properties:
            perfilId:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            modeloVersion:
              type: string
            score:
              type: string
              description: Decimal entre 0 y 1; mayor implica mayor riesgo.
            nivel:
              type: string
              enum: [A, B, C]
            consentimientoId:
              type: string
              format: uuid
            consentimientoVersion:
              type: integer
              minimum: 1
            calculadoEn:
              type: string
              format: date-time
            vigenteHasta:
              type: string
              format: date-time
            fallbackUsed:
              type: boolean
        fuentes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [nombre, version, consultadaEn, vigenteHasta, simulada, indicadorRiesgo]
            properties:
              nombre:
                type: string
                enum: [open_finance, open_data]
              version:
                type: string
              consultadaEn:
                type: string
                format: date-time
              vigenteHasta:
                type: string
                format: date-time
              simulada:
                type: boolean
              indicadorRiesgo:
                type: string
        variables:
          type: object
          additionalProperties: false
          required: [baseAsegurada, duracion, periodicidad, tasa, factorPerfil, score, moneda]
          properties:
            baseAsegurada:
              type: string
            duracion:
              type: integer
              minimum: 1
            periodicidad:
              type: string
              enum: [mensual, por_viaje, por_vuelo, por_periodo]
            tasa:
              type: string
            factorPerfil:
              type: string
            score:
              type: string
            moneda:
              const: COP
        ofertas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlanOfertaSocio"
        hashContenido:
          type: string
          pattern: "^[0-9a-f]{64}$"
    PlanOfertaSocio:
      type: object
      additionalProperties: false
      required: [ofertaId, version, nombre, descripcion, prima, periodicidad, recomendada, coberturaPrincipal, deducible, vigencia, coberturas, condiciones, beneficiosAdicionales, factores]
      properties:
        ofertaId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        nombre:
          type: string
        descripcion:
          type: string
        prima:
          type: object
          additionalProperties: false
          required: [monto, moneda]
          properties:
            monto:
              type: string
              pattern: "^[0-9]+\\.[0-9]{2}$"
            moneda:
              const: COP
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
        recomendada:
          type: boolean
        coberturaPrincipal:
          type: string
        deducible:
          type: string
        vigencia:
          type: string
        coberturas:
          type: array
          items:
            type: string
        condiciones:
          type: array
          items:
            type: string
        beneficiosAdicionales:
          type: array
          items:
            type: string
        factores:
          type: array
          minItems: 1
          description: Factores explicativos que reproducen la prima del plan.
          items:
            type: object
            additionalProperties: false
            required: [codigo, descripcion, valor]
            properties:
              codigo:
                type: string
              descripcion:
                type: string
              valor:
                type: string
    IniciarPerfilamientoHipotecario:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - cliente
        - credito
        - consentimientoId
        - consentimientoVersion
      properties:
        operationId:
          type: string
          format: uuid
        productoId:
          type: string
          const: mortgage-life
          default: mortgage-life
        socioId:
          type: string
          minLength: 1
          maxLength: 50
        cliente:
          $ref: "#/components/schemas/ClienteHipotecario"
        credito:
          $ref: "#/components/schemas/CreditoHipotecario"
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
    ClienteHipotecario:
      type: object
      additionalProperties: false
      required:
        - clienteId
        - tipoDocumento
        - numeroDocumento
        - telefono
        - fechaNacimiento
      properties:
        clienteId:
          type: string
          format: uuid
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        numeroDocumento:
          type: string
          pattern: "^[A-Za-z0-9]{6,15}$"
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        fechaNacimiento:
          type: string
          format: date
    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [referencia, monto, plazoMeses]
      properties:
        referencia:
          type: string
          pattern: "^[A-Za-z0-9-]{4,30}$"
        monto:
          type: integer
          minimum: 1000000
        plazoMeses:
          type: integer
          minimum: 12
          maximum: 360
    PerfilamientoHipotecarioCompletado:
      type: object
      additionalProperties: false
      required:
        - operationId
        - socioId
        - clienteId
        - estado
        - perfilamientoReferencia
        - solicitudId
        - cotizacionId
        - recibidaEn
      properties:
        productoId:
          type: string
          const: mortgage-life
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        estado:
          type: string
          const: completada
        perfilamientoReferencia:
          type: string
        solicitudId:
          type: string
        cotizacionId:
          type: string
          format: uuid
        recibidaEn:
          type: string
          format: date-time
    BandejaExcepcionesOpenFinance:
      type: object
      additionalProperties: false
      required: [excepciones]
      properties:
        excepciones:
          type: array
          description: Solo contiene excepciones con estado pendiente.
          items:
            $ref: "#/components/schemas/ExcepcionOpenFinance"
    AplicacionOperacionInformacion:
      type: object
      additionalProperties: false
      required: [estado, intentos, codigo, actualizadaEn, acuseId]
      properties:
        estado:
          type: string
          enum: [esperando_decision, pendiente, completada, bloqueada, detenida]
        intentos:
          type: integer
          minimum: 0
          maximum: 1
          description: Aplicaciones logicas confirmadas; no cuenta las lecturas repetidas tras rollback.
        codigo:
          type: [string, "null"]
          description: consulta_disponible, operacion_rechazada o causa explicita del bloqueo.
        actualizadaEn:
          type: string
          format: date-time
        acuseId:
          type: [string, "null"]
          format: uuid
          description: Evento de aplicacion durable, no acuse de recepcion por el solicitante.
    ProcesoOperacionInformacion:
      type: object
      additionalProperties: false
      required: [tipo, actorSolicitanteId, productoId, finalidad, datosSolicitados]
      properties:
        tipo:
          const: consulta_informacion_cliente
        actorSolicitanteId:
          type: string
          format: uuid
        productoId:
          type: string
        finalidad:
          const: cotizacion
        datosSolicitados:
          type: array
          items:
            type: string
          description: Interseccion de la peticion original con los datos consentidos.
    EstadoOperacionInformacion:
      type: object
      additionalProperties: false
      required: [operationId, socioId, clienteId, productoId, excepcionId, estadoDecision, aplicacion]
      properties:
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        productoId:
          type: string
        excepcionId:
          type: string
          format: uuid
        estadoDecision:
          type: string
          enum: [pendiente, aprobada, rechazada]
        aplicacion:
          $ref: "#/components/schemas/AplicacionOperacionInformacion"
    ExcepcionOpenFinance:
      type: object
      additionalProperties: false
      required:
        - excepcionId
        - operationId
        - socioId
        - clienteId
        - codigo
        - motivoBloqueo
        - alcance
        - finalidad
        - datos
        - consentimiento
        - estado
        - estadoAnterior
        - creadoEn
        - correlationId
        - trazabilidad
        - decision
        - actorId
        - resueltaEn
        - motivo
        - proceso
        - aplicacion
      properties:
        excepcionId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        socioId:
          type: string
        clienteId:
          type: string
          format: uuid
        codigo:
          type: string
          enum: [fuente_no_disponible, fuente_vencida, regla_no_aplicable]
        motivoBloqueo:
          type: string
          minLength: 3
          maxLength: 500
        alcance:
          type: string
          const: open_finance
          description: Alcance de la excepción, no concesión de consentimiento.
        finalidad:
          type: string
          const: cotizacion
        datos:
          type: array
          items:
            type: string
            const: indicador_riesgo
        consentimiento:
          $ref: "#/components/schemas/ConsentimientoExcepcionOpenFinance"
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
        estadoAnterior:
          type: string
        creadoEn:
          type: string
          format: date-time
        correlationId:
          type: string
        trazabilidad:
          $ref: "#/components/schemas/TrazabilidadExcepcionOpenFinance"
        actorId:
          type: [string, "null"]
          format: uuid
        resueltaEn:
          type: [string, "null"]
          format: date-time
        decision:
          type: [string, "null"]
          enum: [aprobar, rechazar, null]
        motivo:
          type: [string, "null"]
          description: Motivo de la decision humana; null mientras esta pendiente.
        proceso:
          oneOf:
            - $ref: "#/components/schemas/ProcesoOperacionInformacion"
            - type: "null"
        aplicacion:
          oneOf:
            - $ref: "#/components/schemas/AplicacionOperacionInformacion"
            - type: "null"
        idempotente:
          type: boolean
    ConsentimientoExcepcionOpenFinance:
      type: object
      additionalProperties: false
      required: [id, version, estado, fuentes, datos, finalidad, vigenteHasta]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [autorizado, rechazado, revocado, vencido]
        fuentes:
          type: array
          items:
            type: string
        datos:
          type: array
          items:
            type: string
        finalidad:
          type: string
        vigenteHasta:
          type: string
          format: date-time
    ResolverExcepcionOpenFinance:
      type: object
      additionalProperties: false
      required: [decision, motivo]
      properties:
        decision:
          type: string
          enum: [aprobar, rechazar]
        motivo:
          type: string
          minLength: 3
          maxLength: 500
    TrazabilidadExcepcionOpenFinance:
      type: object
      additionalProperties: false
      required: [estadoAnterior, estadoActual, alcance, creadoEn, correlationId]
      properties:
        estadoAnterior:
          type: string
        estadoActual:
          type: string
        alcance:
          type: string
          const: open_finance
        creadoEn:
          type: string
          format: date-time
        correlationId:
          type: string
    ExcepcionOpenFinanceResuelta:
      allOf:
        - $ref: "#/components/schemas/ExcepcionOpenFinance"
        - type: object
          required: [decision, actorId, resueltaEn, motivo]
          properties:
            estado:
              type: string
              enum: [aprobada, rechazada]
            estadoAnterior:
              type: string
              const: pendiente
            decision:
              type: string
              enum: [aprobar, rechazar]
            actorId:
              type: string
              format: uuid
            resueltaEn:
              type: string
              format: date-time
            motivo:
              type: string
              minLength: 3
              maxLength: 500
    DecisionConsentimiento:
      type: object
      additionalProperties: false
      required: [autorizado, version]
      properties:
        autorizado:
          type: boolean
        version:
          type: integer
          minimum: 0
          description: Version actual; 0 si no existe consentimiento
        solicitud:
          $ref: "#/components/schemas/SolicitudConsentimiento"
      if:
        properties:
          autorizado:
            const: true
      then:
        required: [solicitud]
    SolicitudConsentimiento:
      type: object
      additionalProperties: false
      required: [finalidad, alcances, fuentes, datos, versionTerminos, vigenteHasta]
      properties:
        finalidad:
          type: string
          const: cotizacion
        alcances:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_finance, open_data]
        fuentes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Adaptadores simulados; cada fuente debe estar incluida en alcances
          items:
            type: string
            enum: [open_finance, open_data]
        datos:
          type: array
          const: [indicador_riesgo]
          items:
            type: string
        versionTerminos:
          type: string
          const: "1.0"
        vigenteHasta:
          type: string
          format: date-time
          description: Fecha futura con zona horaria; como maximo 30 dias desde la decision
    ConsentimientoPerfilamiento:
      type: object
      additionalProperties: false
      required:
        - consentimientoId
        - clienteId
        - version
        - estado
        - finalidad
        - alcances
        - efectivaEn
        - vigenteHasta
        - actorId
        - fuentes
        - datos
        - versionTerminos
      properties:
        consentimientoId:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [autorizado, rechazado, revocado, vencido]
        finalidad:
          type: string
          const: cotizacion
        alcances:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_finance, open_data]
        actorId:
          type: [string, "null"]
          format: uuid
          description: Titular autenticado; null en evidencia historica incompleta
        fuentes:
          type: array
          items:
            type: string
        datos:
          type: array
          items:
            type: string
        versionTerminos:
          type: [string, "null"]
        efectivaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
    Perfilamiento:
      type: object
      additionalProperties: false
      required: [solicitudId, perfilId, operationId, creditoId, version, modeloVersion, score,
                 nivel, consentimientoId, consentimientoVersion, calculadoEn, vigenteHasta,
                 fuentes, variables, variablesExcluidas, regla, degradaciones, hashDecision,
                 fallbackUsed]
      properties:
        solicitudId:
          type: string
        perfilId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        creditoId:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          minimum: 1
        modeloVersion:
          type: string
          enum: [perfil-riesgo-1, perfil-mock-1]
        score:
          type: string
          description: Indicador sintetico entre 0 y 1, no informacion financiera real
        nivel:
          type: string
          enum: [A, B, C]
        consentimientoId:
          type: string
          format: uuid
        consentimientoVersion:
          type: integer
          minimum: 1
        calculadoEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        fallbackUsed:
          type: boolean
          description: Indica que se aplico cache o default bajo la misma autorizacion; no riesgo parcial.
        estadoFuentes:
          type: array
          description: Metadatos completos por fuente; opcionales solo para perfiles historicos sin fallback.
          items:
            type: object
            additionalProperties: false
            required: [fuente, estado, intentos, motivo]
            properties:
              fuente:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]*$'
              estado:
                type: string
                enum: [disponible, cache, default]
              intentos:
                type: integer
                minimum: 0
                maximum: 2
              motivo:
                type: [string, "null"]
        fuentes:
          type: array
          minItems: 2
          description: Nombres unicos; incluye open_finance y open_data, admite adaptadores adicionales autorizados.
          items:
            type: object
            additionalProperties: false
            required: [nombre, version, consultadaEn, vigenteHasta, simulada, indicadorRiesgo,
                       variablesDisponibles]
            properties:
              nombre:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]*$'
              version:
                type: string
              consultadaEn:
                type: string
                format: date-time
              vigenteHasta:
                type: string
                format: date-time
              simulada:
                type: boolean
                const: true
              indicadorRiesgo:
                type: string
              variablesDisponibles:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
        variables:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required: [nombre, fuente, valorNormalizado, autorizadaPor]
            properties:
              nombre:
                type: string
                const: indicador_riesgo
              fuente:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]*$'
              valorNormalizado:
                type: string
              autorizadaPor:
                type: string
                format: uuid
        variablesExcluidas:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nombre, fuente, motivo]
            properties:
              nombre:
                type: string
              fuente:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]*$'
              motivo:
                type: string
                const: sin_consentimiento
        regla:
          type: object
          additionalProperties: false
          required: [reglaId, version, modeloVersion, expresion]
          properties:
            reglaId:
              type: string
              const: riesgo-maximo-fuentes
            version:
              type: string
              enum: ["1.0", legacy]
            modeloVersion:
              type: string
              enum: [perfil-riesgo-1, perfil-mock-1]
            expresion:
              type: string
              const: max(indicador_riesgo_por_fuente)
        degradaciones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fuente, motivo, politica, versionPolitica]
            properties:
              fuente:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]*$'
              motivo:
                type: string
                enum: [fuente_no_disponible, fuente_vencida]
              politica:
                type: string
                enum: [cache, default]
              versionPolitica:
                type: string
                const: degradacion-1
        hashDecision:
          type: string
          pattern: "^[0-9a-f]{64}$"
      allOf:
        - if:
            properties:
              fallbackUsed:
                const: true
          then:
            required: [estadoFuentes]
            properties:
              estadoFuentes:
                minItems: 2
                contains:
                  anyOf:
                    - properties:
                        estado:
                          const: cache
                    - properties:
                        estado:
                          const: default
          else:
            properties:
              estadoFuentes:
                items:
                  properties:
                    estado:
                      const: disponible
    DesafioLogin:
      type: object
      additionalProperties: false
      required: [desafioId, clavePublica, expiraEn]
      properties:
        desafioId:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        expiraEn:
          type: string
          format: date-time
        clavePublica:
          type: object
          additionalProperties: false
          required: [kty, n, e, alg, use, kid]
          properties:
            kty:
              type: string
              const: RSA
            n:
              type: string
            e:
              type: string
            alg:
              type: string
              const: RSA-OAEP-256
            use:
              type: string
              const: enc
            kid:
              type: string
              minLength: 1
    CredencialesCifradas:
      type: object
      additionalProperties: false
      required: [correo, credencialCifrada]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        credencialCifrada:
          type: string
          minLength: 1
          maxLength: 8192
          description: >-
            JWE compacto con cabecera protegida exacta alg=RSA-OAEP-256, enc=A256GCM,
            kid de clavePublica, typ=solventa-login+jwe. JSON cifrado exacto
            {desafioId, correo, contrasena}; correo coincide con el exterior.
            Desafío válido 60 segundos, consumido antes de verificar la contraseña.
    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    NuevoUsuarioCifrado:
      type: object
      additionalProperties: false
      required: [nombre, correo, credencialCifrada, tipoDocumento, numeroDocumento, telefono, fechaNacimiento, consentimiento]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        credencialCifrada:
          type: string
          minLength: 1
          maxLength: 8192
          description: >-
            JWE compacto RSA-OAEP-256/A256GCM con kid del desafio,
            typ=solventa-register+jwe e interior exacto {desafioId,correo,contrasena}.
            Correo interior y exterior coinciden. Password 8..128; sin fallback.
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        numeroDocumento:
          type: string
          minLength: 5
          maxLength: 16
          description: cc 6..10 digitos, ce 6..12, passport 5..16 alfanumericos, ppt 7..10; normalizado a mayusculas.
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        fechaNacimiento:
          type: string
          format: date
          description: Anterior a hoy, sin minimo de 18 anos.
        consentimiento:
          type: object
          additionalProperties: false
          required: [autorizado, versionTerminos]
          description: >-
            Eleccion explicita de perfilamiento para cotizacion: open_finance/open_data,
            indicador_riesgo, 30 dias desde alta, revocable. False registra rechazo,
            no concede acceso. Decision y outbox atomicos con usuario; version inicial 1.
            versionTerminos no es la revision optimista de la API de revocacion.
          properties:
            autorizado: {type: boolean}
            versionTerminos: {type: string, const: "1.0"}
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
    UsuarioSesion:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente, asesor, socio]
        socios:
          type: array
          uniqueItems: true
          description: Organizaciones autorizadas para roles asesor y socio.
          items:
            type: string
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
    Sesion:
      type: object
      additionalProperties: false
      required: [usuario, expiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [usuario, tokenType, accessToken, refreshToken, expiraEn, refreshExpiraEn]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioSesion"
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: JWT RS256 de vida corta (1 hora). Se guarda solo en memoria.
        refreshToken:
          type: string
          description: Token opaco de un solo uso que rota en cada renovación.
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token (ahora + expires_in de identidad).
        refreshExpiraEn:
          type: string
          format: date-time
    Renovacion:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 2048
    ProductoSeguro:
      type: object
      additionalProperties: false
      required: [id, nombre, descripcion, disponible, coberturasPrincipales]
      properties:
        id:
          type: string
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        disponible:
          type: boolean
        coberturasPrincipales:
          type: array
          minItems: 1
          items:
            type: string
    ProductoSeguroDetalle:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - disponible
        - coberturasPrincipales
        - coberturas
        - condiciones
        - informacionRelevante
      properties:
        id:
          type: string
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        disponible:
          type: boolean
        coberturasPrincipales:
          type: array
          minItems: 1
          items:
            type: string
        coberturas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CoberturaProducto"
        condiciones:
          type: array
          minItems: 1
          items:
            type: string
        informacionRelevante:
          $ref: "#/components/schemas/InformacionProducto"
    CoberturaProducto:
      type: object
      additionalProperties: false
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
    InformacionProducto:
      type: object
      additionalProperties: false
      required: [sumaAsegurada, deducible, moneda, vigencia]
      properties:
        sumaAsegurada:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        deducible:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
        vigencia:
          type: string
    DestinoViaje:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          pattern: "^[A-Z]{2}$"
        nombre:
          type: string
          minLength: 1
          maxLength: 120
    NuevaSolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - productoId
        - datosProducto
      properties:
        productoId:
          type: string
          enum:
            - automotive
            - travel
            - life
            - device-protection
            - parametric
            - parametric-weather
            - payment-protection
            - mortgage-life
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
      oneOf:
        - properties:
            productoId:
              const: automotive
            datosProducto:
              $ref: "#/components/schemas/DatosAutomotriz"
        - properties:
            productoId:
              const: travel
            datosProducto:
              $ref: "#/components/schemas/DatosViaje"
        - properties:
            productoId:
              const: life
            datosProducto:
              $ref: "#/components/schemas/DatosVida"
        - properties:
            productoId:
              const: device-protection
            datosProducto:
              $ref: "#/components/schemas/DatosDispositivo"
        - properties:
            productoId:
              const: parametric
            datosProducto:
              $ref: "#/components/schemas/DatosVuelo"
        - properties:
            productoId:
              const: parametric-weather
            datosProducto:
              $ref: "#/components/schemas/DatosClima"
        - properties:
            productoId:
              const: payment-protection
            datosProducto:
              $ref: "#/components/schemas/DatosProteccionPagos"
        - properties:
            productoId:
              const: mortgage-life
            datosProducto:
              $ref: "#/components/schemas/DatosVidaHipotecaria"
    DatosProducto:
      description: >-
        Datos específicos del producto, sin campos adicionales. Todas las fechas
        usan YYYY-MM-DD y todos los importes son strings de enteros positivos COP.
        Las validaciones temporales se aplican al crear, no al consultar registros históricos.
      oneOf:
        - $ref: "#/components/schemas/DatosAutomotriz"
        - $ref: "#/components/schemas/DatosViaje"
        - $ref: "#/components/schemas/DatosVida"
        - $ref: "#/components/schemas/DatosDispositivo"
        - $ref: "#/components/schemas/DatosVuelo"
        - $ref: "#/components/schemas/DatosClima"
        - $ref: "#/components/schemas/DatosProteccionPagos"
        - $ref: "#/components/schemas/DatosVidaHipotecaria"
    DatosAutomotriz:
      type: object
      additionalProperties: false
      required: [vehiclePlate]
      properties:
        vehiclePlate:
          type: string
          pattern: "^[A-Z]{3}[0-9]{3}$"
    DatosViaje:
      type: object
      additionalProperties: false
      required: [destinationCountryCode, departureDate, returnDate]
      description: >-
        El país debe pertenecer a /v1/destinos-viaje y returnDate debe ser igual
        o posterior a departureDate.
      properties:
        destinationCountryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        departureDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
    DatosVida:
      type: object
      additionalProperties: false
      required: [birthDate]
      properties:
        birthDate:
          type: string
          format: date
    DatosDispositivo:
      type: object
      additionalProperties: false
      required: [deviceType, brandModel, purchaseValue]
      properties:
        deviceType:
          type: string
          pattern: "\\S"
          maxLength: 40
        brandModel:
          type: string
          pattern: "\\S"
          maxLength: 80
        purchaseValue:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    DatosVuelo:
      type: object
      description: |
        flightDate debe ser posterior a hoy al crear. Omitir coverageType conserva
        la modalidad delay-cancellation sin añadir el campo al registro.
        Las ofertas son simuladas: no consultan aerolíneas ni pagan siniestros.
        La pérdida de conexión está sujeta a las condiciones del plan y no incluye
        pérdidas por responsabilidad del pasajero.
      additionalProperties: false
      required: [airline, flightNumber, flightDate]
      properties:
        airline:
          type: string
          pattern: "\\S"
          maxLength: 80
        flightNumber:
          type: string
          pattern: "^[A-Za-z0-9]{2,10}$"
        flightDate:
          type: string
          format: date
        coverageType:
          type: string
          enum: [delay-cancellation, missed-connection, comprehensive]
          default: delay-cancellation
    DatosClima:
      type: object
      additionalProperties: false
      required: [location, weatherEvent, startDate, endDate, insuredAmount]
      description: >-
        location contiene municipio y departamento en texto libre, sin catálogo externo.
        Las fechas deben ser posteriores a hoy al crear; endDate >= startDate
        y periodo máximo de 366 días inclusive. insuredAmount acepta de 1 a
        1000000000 COP. El evento, disparador, umbral y compensación están sujetos
        a condiciones del plan; no hay monitoreo meteorológico ni pagos reales.
      properties:
        location:
          type: string
          pattern: "\\S"
          maxLength: 120
        weatherEvent:
          type: string
          enum: [heavy-rain, drought]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        insuredAmount:
          type: string
          pattern: "^(?:[1-9][0-9]{0,8}|1000000000)$"
    DatosProteccionPagos:
      type: object
      additionalProperties: false
      required: [creditType, monthlyPayment]
      properties:
        creditType:
          type: string
          pattern: "\\S"
          maxLength: 60
        monthlyPayment:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    DatosVidaHipotecaria:
      type: object
      additionalProperties: false
      required: [birthDate, mortgageBalance]
      properties:
        birthDate:
          type: string
          format: date
        mortgageBalance:
          type: string
          pattern: "^[1-9][0-9]{0,15}$"
    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required:
        - id
        - productoId
        - tipoCliente
        - tipoDocumento
        - identificacion
        - datosProducto
        - correo
        - telefono
        - estado
        - creadaEn
      properties:
        id:
          type: string
          pattern: "^AQT-[0-9]{4}-[A-Z0-9]{6,12}$"
        productoId:
          type: string
        tipoCliente:
          type: string
          enum: [persona_natural]
        tipoDocumento:
          type: string
          enum: [cc, ce, passport, ppt]
        identificacion:
          type: string
          minLength: 5
          maxLength: 16
        datosProducto:
          $ref: "#/components/schemas/DatosProducto"
        correo:
          type: string
          format: email
        telefono:
          type: string
          pattern: "^\\+57[0-9]{10}$"
        estado:
          type: string
          enum: [recibida, procesando, calculada, sin_ofertas, fallida]
        creadaEn:
          type: string
          format: date-time
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
          example: COP
    Oferta:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - nombre
        - descripcion
        - primaMensual
        - prima
        - periodicidad
        - coberturaPrincipal
        - deducible
        - vigencia
        - responsabilidadCivil
        - coberturas
        - condiciones
        - beneficiosAdicionales
        - recomendada
        - estado
        - vigenteHasta
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        primaMensual:
          description: Solo para periodicidad mensual; null para viaje, vuelo o período asegurado.
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
        prima:
          $ref: "#/components/schemas/Dinero"
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
          description: >-
            por_periodo identifica la prima total del período asegurado entre
            datosProducto.startDate y endDate, ambos inclusive. No define cuotas
            ni renovación. vigenteHasta es el plazo de aceptación de la oferta.
        coberturaPrincipal:
          type: string
          maxLength: 250
        deducible:
          type: string
          maxLength: 120
        vigencia:
          type: string
          maxLength: 120
        responsabilidadCivil:
          type: string
          maxLength: 120
        coberturas:
          type: array
          items:
            type: string
          minItems: 1
        condiciones:
          type: array
          items:
            type: string
          minItems: 1
        beneficiosAdicionales:
          type: array
          items:
            type: string
        recomendada:
          type: boolean
        estado:
          type: string
          enum: [disponible, aceptada, vencida, retirada]
        vigenteHasta:
          type: string
          format: date-time
        explicacion:
          $ref: "#/components/schemas/ExplicacionOfertaHipotecaria"
        trazabilidad:
          $ref: "#/components/schemas/TrazabilidadOfertaHipotecaria"
    OfertaHipotecariaSocio:
      allOf:
        - $ref: "#/components/schemas/Oferta"
        - type: object
          required: [explicacion, trazabilidad]
    ExplicacionOfertaHipotecaria:
      type: object
      additionalProperties: false
      required: [resumen, factoresDeterminantes]
      properties:
        resumen:
          type: string
          minLength: 1
        factoresDeterminantes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [nombre, valor, impacto]
            properties:
              nombre:
                type: string
                minLength: 1
              valor:
                type: string
                minLength: 1
              impacto:
                type: string
                minLength: 1
    TrazabilidadOfertaHipotecaria:
      type: object
      additionalProperties: false
      required:
        - esquemaDecision
        - hashDecision
        - hashContenido
        - perfilId
        - perfilVersion
        - modeloPerfilVersion
        - reglaId
        - reglaVersion
        - fuentes
      properties:
        esquemaDecision:
          type: integer
          minimum: 1
        hashDecision:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hashContenido:
          type: string
          pattern: "^[0-9a-f]{64}$"
        perfilId:
          type: string
          format: uuid
        perfilVersion:
          type: integer
          minimum: 1
        modeloPerfilVersion:
          type: string
          minLength: 1
        reglaId:
          type: string
          format: uuid
        reglaVersion:
          type: string
          minLength: 1
        fuentes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [nombre, version]
            properties:
              nombre:
                type: string
                enum: [open_finance, open_data]
              version:
                type: string
                minLength: 1
    ResultadoOfertas:
      type: object
      additionalProperties: false
      required: [solicitudId, calculadaEn, vigenteHasta, tasaAplicada, ofertas]
      properties:
        solicitudId:
          type: string
        calculadaEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
        tasaAplicada:
          type: string
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/Oferta"
    NuevaSeleccionOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, version]
      properties:
        ofertaId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        revisionSeleccion:
          type: integer
          minimum: 1
          description: Obligatoria si la operacion tiene una seleccion provisional.
    SeleccionOferta:
      allOf:
        - type: object
          required: [ofertaId, version]
          properties:
            ofertaId:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
        - type: object
          required: [solicitudId, nombreOferta, primaMensual, prima, periodicidad, seleccionadaEn]
          properties:
            solicitudId:
              type: string
            nombreOferta:
              type: string
            primaMensual:
              description: Solo para periodicidad mensual; null para viaje, vuelo o período asegurado.
              oneOf:
                - $ref: "#/components/schemas/Dinero"
                - type: "null"
            prima:
              $ref: "#/components/schemas/Dinero"
            periodicidad:
              type: string
              enum: [mensual, por_viaje, por_vuelo, por_periodo]
              description: por_periodo conserva la prima total del período asegurado seleccionado.
            seleccionadaEn:
              type: string
              format: date-time
    NuevaSeleccionProvisional:
      type: object
      additionalProperties: false
      required: [ofertaId, version, revisionEsperada]
      properties:
        ofertaId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        revisionEsperada:
          type: integer
          minimum: 0
    SeleccionProvisional:
      allOf:
        - $ref: "#/components/schemas/SeleccionOferta"
        - type: object
          required: [revision, vigenteHasta]
          properties:
            revision:
              type: integer
              minimum: 1
            vigenteHasta:
              type: string
              format: date-time
    EstadoSeleccionProvisional:
      type: object
      additionalProperties: false
      required: [solicitudId, seleccion, aceptacion, estadoOferta]
      properties:
        solicitudId:
          type: string
        seleccion:
          oneOf:
            - $ref: "#/components/schemas/SeleccionProvisional"
            - type: "null"
        aceptacion:
          oneOf:
            - $ref: "#/components/schemas/SeleccionOferta"
            - type: "null"
        estadoOferta:
          type: [string, "null"]
          enum: [disponible, vencida, retirada, aceptada, null]
    Suscripcion:
      type: object
      additionalProperties: false
      required:
        - id
        - solicitudId
        - ofertaId
        - ofertaVersion
        - estado
        - reglaVersion
        - creadaEn
        - actualizadaEn
        - decision
        - saga
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/DecisionSuscripcion"
        saga:
          $ref: "#/components/schemas/SagaEmision"
    PagoSimulado:
      oneOf:
        - $ref: "#/components/schemas/PagoSimuladoConfirmado"
        - $ref: "#/components/schemas/PagoSimuladoRechazado"
        - $ref: "#/components/schemas/PagoSimuladoPendiente"
    PagoSimuladoPendiente:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, ofertaId, ofertaVersion, estado, simulada, referenciaInterna, importe, periodicidad, creadaEn, codigo, saga]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        suscripcionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          const: pendiente
        simulada:
          type: boolean
          const: true
        referenciaInterna:
          type: string
          pattern: "^SIM-[0-9a-f-]{36}$"
        importe:
          $ref: "#/components/schemas/DineroDashboard"
          properties:
            monto:
              type: string
              pattern: "^(?=.*[1-9])[0-9]+\\.[0-9]{2}$"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        creadaEn:
          type: string
          format: date-time
        codigo:
          type: string
          const: resultado_no_confirmado
        saga:
          type: object
          additionalProperties: false
          required: [estado, version, actualizadaEn]
          properties:
            estado:
              type: string
              const: pago_pendiente
            version:
              type: integer
              const: 1
            actualizadaEn:
              type: string
              format: date-time
    PagoSimuladoConfirmado:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, ofertaId, ofertaVersion, estado, simulada, referenciaInterna, importe, periodicidad, confirmadaEn, saga]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        suscripcionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          const: confirmado
        simulada:
          type: boolean
          const: true
        referenciaInterna:
          type: string
          pattern: "^SIM-[0-9a-f-]{36}$"
          description: Identificador interno; no es una referencia bancaria.
        importe:
          $ref: "#/components/schemas/Dinero"
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
        confirmadaEn:
          type: string
          format: date-time
        saga:
          type: object
          additionalProperties: false
          required: [estado, version, actualizadaEn]
          description: Instantánea de la transición al confirmar; consultar suscripción para estado posterior.
          properties:
            estado:
              type: string
              const: pago_confirmado
            version:
              type: integer
              minimum: 2
            actualizadaEn:
              type: string
              format: date-time
    PagoSimuladoRechazado:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, ofertaId, ofertaVersion, estado, simulada, referenciaInterna, importe, periodicidad, rechazadaEn, motivo, saga]
      properties:
        id:
          type: string
          format: uuid
          description: Identidad persistida del intento rechazado; no acredita un pago confirmado.
        solicitudId:
          type: string
        suscripcionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        ofertaVersion:
          type: integer
          minimum: 1
        estado:
          type: string
          const: rechazado
        simulada:
          type: boolean
          const: true
        referenciaInterna:
          type: string
          pattern: "^SIM-[0-9a-f-]{36}$"
        importe:
          $ref: "#/components/schemas/Dinero"
        periodicidad:
          type: string
          enum: [mensual, por_viaje, por_vuelo, por_periodo]
        rechazadaEn:
          type: string
          format: date-time
        motivo:
          type: string
          const: rechazo_simulado
        saga:
          type: object
          additionalProperties: false
          required: [estado, version, actualizadaEn]
          description: Instantánea pendiente al rechazar; consultar suscripción para estado posterior.
          properties:
            estado:
              type: string
              const: pago_pendiente
            version:
              type: integer
              const: 1
            actualizadaEn:
              type: string
              format: date-time
    DecisionSuscripcion:
      type: object
      additionalProperties: false
      required: [resultado, reglaVersion, hashDecision, decididaEn]
      properties:
        resultado:
          type: string
          enum: [aprobada, revision, rechazada]
        reglaVersion:
          type: string
        hashDecision:
          type: string
          pattern: "^[a-f0-9]{64}$"
        decididaEn:
          type: string
          format: date-time
    SagaEmision:
      type: object
      additionalProperties: false
      required: [estado, version, actualizadaEn]
      properties:
        estado:
          type: string
          enum: [pago_pendiente, pago_confirmado, emitida, fallida]
        version:
          type: integer
          minimum: 1
        actualizadaEn:
          type: string
          format: date-time
    PolizaResumen:
      type: object
      additionalProperties: false
      required: [id, producto, estado]
      properties:
        id:
          type: string
        producto:
          type: string
        estado:
          type: string
          enum: [activa, pendiente, vencida]
        prima:
          $ref: "#/components/schemas/Dinero"
    Notificacion:
      type: object
      additionalProperties: false
      required: [id, titulo, creadaEn, leida]
      properties:
        id:
          type: string
        titulo:
          type: string
        creadaEn:
          type: string
          format: date-time
        leida:
          type: boolean
    Dashboard:
      type: object
      additionalProperties: false
      required: [cotizaciones, suscripciones, pagos, polizas, notificaciones]
      properties:
        cotizaciones:
          type: array
          items:
            $ref: "#/components/schemas/CotizacionDashboard"
        suscripciones:
          type: array
          items:
            $ref: "#/components/schemas/SuscripcionDashboard"
        pagos:
          type: array
          items:
            $ref: "#/components/schemas/PagoDashboard"
        polizas:
          type: array
          items:
            $ref: "#/components/schemas/PolizaDashboard"
        notificaciones:
          $ref: "#/components/schemas/DominioNoImplementado"
    PolizaDashboard:
      type: object
      additionalProperties: false
      required: [id, suscripcionId, tipo, fechaInicio, fechaFin, estado, simulada]
      description: |
        Emision academica posterior a un pago simulado nuevo. No acredita cobertura real.
        Fechas inclusivas; estado calculado respecto del dia UTC. Los pagos anteriores
        a habilitar la emision no se convierten retroactivamente en polizas.
      properties:
        id:
          type: string
          format: uuid
        suscripcionId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [automotive, travel, life, device-protection, parametric, parametric-weather, payment-protection, mortgage-life]
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estado:
          type: string
          enum: [programada, vigente, vencida, cancelada]
        simulada:
          type: boolean
          const: true
    DominioNoImplementado:
      type: object
      additionalProperties: false
      required: [disponibilidad]
      properties:
        disponibilidad:
          type: string
          const: no_implementado
    DineroDashboard:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: Importe persistido, no negativo y sin conversiones.
        moneda:
          type: string
          pattern: "^[A-Z]{3}$"
    PeriodicidadDashboard:
      type: string
      enum: [mensual, por_viaje, por_vuelo, por_periodo]
    SeleccionDashboard:
      type: object
      additionalProperties: false
      required: [ofertaId, nombreOferta, prima, periodicidad, seleccionadaEn]
      properties:
        ofertaId:
          type: string
          format: uuid
        nombreOferta:
          type: string
          minLength: 1
        prima:
          $ref: "#/components/schemas/DineroDashboard"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        seleccionadaEn:
          type: string
          format: date-time
    CotizacionDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, productoId, estado, creadaEn, validaHasta, primaEstimada, seleccion]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: [string, "null"]
          description: Null para cotizaciones previas al flujo de solicitudes.
        productoId:
          type: string
          minLength: 1
          description: Slug del catalogo actual o UUID original para productos historicos desconocidos.
        estado:
          type: string
          minLength: 1
          description: Estado persistido, actualmente PENDIENTE o CALCULADA.
        creadaEn:
          type: string
          format: date-time
        validaHasta:
          type: string
          format: date-time
        primaEstimada:
          $ref: "#/components/schemas/DineroDashboard"
          description: No tiene periodicidad persistida; no presentar como prima mensual.
        seleccion:
          oneOf:
            - $ref: "#/components/schemas/SeleccionDashboard"
            - type: "null"
    SuscripcionDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, cotizacionId, ofertaId, estado, creadaEn, actualizadaEn, saga]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        cotizacionId:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        estado:
          type: string
          minLength: 1
          description: Estado persistido, actualmente aprobada, revision o rechazada.
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
        saga:
          $ref: "#/components/schemas/SagaDashboard"
    SagaDashboard:
      type: object
      additionalProperties: false
      required: [estado, version, actualizadaEn]
      properties:
        estado:
          type: string
          minLength: 1
          description: Estado persistido de la saga; solo la coleccion polizas acredita un registro de emision academica.
        version:
          type: integer
          minimum: 1
        actualizadaEn:
          type: string
          format: date-time
    PagoDashboard:
      description: Prioriza confirmado, pendiente activo y despues ultimo rechazo.
      oneOf:
        - $ref: "#/components/schemas/PagoConfirmadoDashboard"
        - $ref: "#/components/schemas/PagoRechazadoDashboard"
        - $ref: "#/components/schemas/PagoPendienteDashboard"
    PagoPendienteDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, estado, simulada, importe, periodicidad, creadaEn, codigo]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        suscripcionId:
          type: string
          format: uuid
        estado:
          type: string
          const: pendiente
        simulada:
          type: boolean
          const: true
        importe:
          $ref: "#/components/schemas/DineroDashboard"
          properties:
            monto:
              type: string
              pattern: "^(?=.*[1-9])[0-9]+\\.[0-9]{2}$"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        creadaEn:
          type: string
          format: date-time
        codigo:
          type: string
          const: resultado_no_confirmado
    PagoConfirmadoDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, estado, simulada, importe, periodicidad, confirmadaEn]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          minLength: 1
        suscripcionId:
          type: string
          format: uuid
        estado:
          type: string
          const: confirmado
        simulada:
          type: boolean
          const: true
        importe:
          $ref: "#/components/schemas/DineroDashboard"
          description: Importe positivo persistido del pago simulado.
          properties:
            monto:
              type: string
              pattern: "^(?=.*[1-9])[0-9]+\\.[0-9]{2}$"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        confirmadaEn:
          type: string
          format: date-time
    PagoRechazadoDashboard:
      type: object
      additionalProperties: false
      required: [id, solicitudId, suscripcionId, estado, simulada, importe, periodicidad, rechazadaEn, motivo]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
        suscripcionId:
          type: string
          format: uuid
        estado:
          type: string
          const: rechazado
        simulada:
          type: boolean
          const: true
        importe:
          allOf:
            - $ref: "#/components/schemas/DineroDashboard"
          properties:
            monto:
              type: string
              pattern: "^(?=.*[1-9])[0-9]+\\.[0-9]{2}$"
        periodicidad:
          $ref: "#/components/schemas/PeriodicidadDashboard"
        rechazadaEn:
          type: string
          format: date-time
        motivo:
          type: string
          const: rechazo_simulado
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, mensaje]
      properties:
        campo:
          type: string
        mensaje:
          type: string
    ProblemaPagoEnProceso:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId, pagoId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        code:
          type: string
          const: pago_en_proceso
        correlationId:
          type: string
          format: uuid
        pagoId:
          type: string
          format: uuid
    Problema:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorCampo"
        operacion:
          $ref: "#/components/schemas/EstadoOperacionInformacion"
        fuente:
          type: string
          enum: [polizas, primas, siniestros, consolidacion]
          description: Fuente que impidio consolidar un reporte operativo (consolidacion_incompleta).
        motivo:
          type: string
          description: Motivo de negocio de `poliza_no_renovable`.
        renovacionId:
          type: [string, "null"]
          format: uuid
          description: Renovacion que ocupa el periodo en `renovacion_en_curso`.
        campo:
          type: string
          description: Campo no autorizado en `cambio_no_permitido`.
        versionActual:
          type: integer
          minimum: 1
          description: Version vigente en `version_desactualizada`.
security:
  - bearerAuth: []
