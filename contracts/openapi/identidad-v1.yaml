openapi: 3.1.0
info:
  title: Solventa Identidad
  version: 1.0.0
  description: >-
    Contrato del servicio de identidad: registro de usuarios y emisión de tokens
    (OAuth 2.0 con JWT RS256). El API Gateway valida los JWT con el JWKS publicado.
servers:
  - url: /
tags:
  - name: Usuarios
  - name: OAuth
  - name: Descubrimiento
  - name: Consentimientos
  - name: Asesores
paths:
  /v1/biometria/enrolamientos/desafio:
    $ref: "./biometria-v1.yaml#/paths/~1enrolamientos~1desafio"
  /v1/biometria/enrolamientos:
    $ref: "./biometria-v1.yaml#/paths/~1enrolamientos"
  /v1/biometria/desafios:
    $ref: "./biometria-v1.yaml#/paths/~1desafios"
  /v1/biometria/credenciales:
    $ref: "./biometria-v1.yaml#/paths/~1credenciales"
  /v1/biometria/credenciales/{credencialId}:
    $ref: "./biometria-v1.yaml#/paths/~1credenciales~1{credencialId}"
  /v1/clientes:
    get:
      tags: [Asesores]
      summary: Lista clientes registrados para consumo interno del BFF
      security:
        - TokenInterno: []
      responses:
        "200":
          description: Datos mínimos para seleccionar al titular
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClienteRegistrado"
        "401":
          description: Token interno invalido
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /v1/clientes/{clienteId}/consentimiento-perfilamiento:
    parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Consentimientos]
      summary: Lee la ultima decision autoritativa
      description: API interna; el BFF obtiene clienteId del JWT, no del cuerpo del cliente.
      security:
        - TokenInterno: []
      responses:
        "200":
          description: Decision persistida; estado vencido si expiro, sin renovar la vigencia
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/ConsentimientoPerfilamiento"
        "401":
          description: Token interno invalido
        "404":
          description: consentimiento_ausente
        "503":
          description: Servicio o credencial interna no configurados
    put:
      tags: [Consentimientos]
      summary: Persiste decision e historial junto con su evento en el Outbox
      security:
        - TokenInterno: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./bff-web-v1.yaml#/components/schemas/DecisionConsentimiento"
      responses:
        "200":
          description: Decision durable, aun si el consumidor de eventos esta caido
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/ConsentimientoPerfilamiento"
        "400":
          description: Decision, solicitud o vigencia invalidas
        "401":
          description: Token interno invalido
        "409":
          description: Version obsoleta; recargar antes de decidir
        "503":
          description: Persistencia no disponible; no confirma una decision parcial
  /v1/usuarios:
    post:
      tags: [Usuarios]
      summary: Registra un usuario cliente
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuario"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "409":
          $ref: "#/components/responses/CorreoYaRegistrado"
        "429":
          $ref: "#/components/responses/DemasiadosIntentos"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /oauth/login-challenge:
    get:
      tags: [OAuth]
      summary: Emite desafío de login web cifrado, válido 60 segundos
      operationId: emitirDesafioLogin
      security: []
      responses:
        "200":
          description: Desafío de un solo uso persistido en Redis
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "./bff-web-v1.yaml#/components/schemas/DesafioLogin"
        "503":
          description: Función deshabilitada o Redis no disponible
  /oauth/token:
    post:
      tags: [OAuth]
      summary: Emite tokens (password, encrypted_password, biometric_signature o refresh_token)
      description: >-
        biometric_signature acepta solo JSON estricto, client_id=movil y
        credencialId/desafioId/firma; usa los bytes de mensaje del desafio,
        nunca una confirmacion biometrica booleana. Rol no cliente responde403.
        Con `grant_type=password` autentica al usuario. Con `grant_type=refresh_token`
        rota el refresh token: el presentado queda revocado y se emite uno nuevo en la misma
        familia. Presentar un refresh token ya rotado revoca toda la familia.
        El access token es un JWT RS256 de 1 hora (`expires_in: 3600`).
        Con ENCRYPTED_LOGIN_ENABLED=true, web debe usar encrypted_password; password
        queda disponible solo para movil. El grant cifrado exige cliente web y rechaza
        campos adicionales, incluyendo password. Desafío consumido atómicamente en Redis
        tras validar JWE y correo, antes de verificar credenciales. Fallo de sobre,
        desafío expirado o replay responde 400; credenciales incorrectas 401. No hay fallback.
      operationId: emitirToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SolicitudToken"
                - $ref: "#/components/schemas/SolicitudTokenCifrado"
                - $ref: "./biometria-v1.yaml#/components/schemas/SolicitudTokenBiometrico"
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SolicitudToken"
                - $ref: "#/components/schemas/SolicitudTokenCifrado"
      responses:
        "200":
          description: Tokens emitidos
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaToken"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "./biometria-v1.yaml#/components/responses/Error"
        "429":
          $ref: "#/components/responses/DemasiadosIntentos"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /oauth/revoke:
    post:
      tags: [OAuth]
      summary: Revoca un refresh token y su familia
      description: Siempre responde 204 si el cuerpo es válido, exista o no el token.
      operationId: revocarToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRevocacion"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SolicitudRevocacion"
      responses:
        "204":
          description: Token revocado (o inexistente)
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"
  /.well-known/openid-configuration:
    get:
      tags: [Descubrimiento]
      summary: Metadatos OpenID Connect del emisor
      operationId: consultarConfiguracionOpenId
      responses:
        "200":
          description: Configuración del emisor
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionOpenId"
  /.well-known/jwks.json:
    get:
      tags: [Descubrimiento]
      summary: Claves públicas de firma
      operationId: consultarJwks
      responses:
        "200":
          description: Conjunto de claves JWK
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
components:
  securitySchemes:
    TokenInterno:
      type: http
      scheme: bearer
  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato (`solicitud_invalida`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutenticado:
      description: Credenciales o refresh token inválidos (`credenciales_invalidas`, `refresh_invalido`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    CorreoYaRegistrado:
      description: Ya existe una cuenta con ese correo (`correo_ya_registrado`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadosIntentos:
      description: Se superó el límite de intentos por correo (`demasiados_intentos`)
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ServicioNoDisponible:
      description: Una dependencia no está disponible (`servicio_no_disponible`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente, asesor, socio]
        socios:
          type: array
          uniqueItems: true
          description: Socios activos autorizados; presente para rol asesor o socio.
          items:
            type: string
    ClienteRegistrado:
      type: object
      additionalProperties: false
      required: [clienteId, nombre, correo]
      properties:
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
    UsuarioCreado:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/Usuario"
    SolicitudTokenCifrado:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, username, credencialCifrada]
      properties:
        grant_type:
          type: string
          const: encrypted_password
        client_id:
          type: string
          const: web
        username:
          type: string
          format: email
          maxLength: 254
        credencialCifrada:
          type: string
          minLength: 1
          maxLength: 8192
          description: JWE compacto; mismo formato que CredencialesCifradas del BFF.
    SolicitudToken:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token]
        client_id:
          type: string
          enum: [web, movil]
        username:
          type: string
          format: email
          description: Correo del usuario (obligatorio con `grant_type=password`).
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: Obligatorio con `grant_type=password`.
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Obligatorio con `grant_type=refresh_token`.
    RespuestaToken:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - refresh_expires_in
        - scope
        - usuario
      properties:
        access_token:
          type: string
          description: JWT RS256 con claims iss, sub, aud, iat, exp, jti, scope, rol, nombre, correo y client_id.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Vida del access token en segundos.
          example: 3600
        refresh_token:
          type: string
        refresh_expires_in:
          type: integer
          description: Vida del refresh token en segundos (web 28800, movil 2592000).
        scope:
          type: string
          enum: [cliente, asesor, socio]
        usuario:
          $ref: "#/components/schemas/Usuario"
    SolicitudRevocacion:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
    ConfiguracionOpenId:
      type: object
      required:
        - issuer
        - jwks_uri
        - token_endpoint
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - scopes_supported
      properties:
        issuer:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, "n", e]
            properties:
              kty:
                type: string
                enum: [RSA]
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [RS256]
              kid:
                type: string
              "n":
                type: string
              e:
                type: string
    Problema:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
