[project]
name = "notificaciones"
version = "0.1.0"
description = "Generación y entrega trazable de notificaciones de Solventa"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14,<2", "flask>=3.1,<4", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2,<4"]
server = ["gunicorn>=23,<24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"
