[project]
name = "siniestros"
version = "0.1.0"
description = "Estado e historial de siniestros de Solventa"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2,<4"]
server = ["gunicorn>=23,<24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
