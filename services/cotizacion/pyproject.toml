[project]
name = "cotizacion"
version = "0.1.0"
description = "Microservicio de Tarificación y Cotización de Solventa"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2,<3",
    "flask>=3.1,<4",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
server = ["gunicorn>=23,<24"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
