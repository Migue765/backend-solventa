apiVersion: batch/v1
kind: Job
metadata:
  name: perfilamiento-migrate-${MIGRATION_ID}
  namespace: perfilamiento
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${IMAGE}
          command: ["python", "-m", "flask", "--app", "perfilamiento.app", "init-db"]
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: perfilamiento-runtime
                  key: INTERNAL_API_TOKEN
            - name: PERFILAMIENTO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: perfilamiento-runtime
                  key: PERFILAMIENTO_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
