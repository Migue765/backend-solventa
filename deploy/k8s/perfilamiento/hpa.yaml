apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: perfilamiento
  namespace: perfilamiento
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: perfilamiento
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
