apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfilamiento
  namespace: hu11-perfilamiento
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hu11-perfilamiento
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: hu11-perfilamiento
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perfilamiento
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hu11-runtime
                  key: INTERNAL_API_TOKEN
            - name: PERFILAMIENTO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hu11-runtime
                  key: PERFILAMIENTO_DATABASE_URL
            - name: IDENTIDAD_SERVICE_URL
              value: http://identidad.identidad.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
