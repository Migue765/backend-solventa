# Variables: IMAGE (misma imagen del API), AWS_REGION
# Trabajadores HU30 (cola de eventos parametricos) y HU31 (pagos parametricos).
# Varias replicas son seguras: la cola usa FOR UPDATE SKIP LOCKED y los pagos un lease
# con token; si una replica muere, otra cierra el intento huerfano al vencer el lease.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siniestros-eventos-parametricos
  namespace: siniestros
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: siniestros-eventos-parametricos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siniestros-eventos-parametricos
        app.kubernetes.io/part-of: siniestros
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: siniestros-eventos-parametricos
      containers:
        - name: worker
          image: ${IMAGE}
          command: ["python", "-m", "siniestros.parametric_worker", "--limit", "5000"]
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: siniestros-runtime
                  key: INTERNAL_API_TOKEN
            - name: SINIESTROS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: siniestros-runtime
                  key: SINIESTROS_DATABASE_URL
            - name: POLIZAS_SERVICE_URL
              value: http://polizas.polizas.svc.cluster.local:8080
            - name: AWS_REGION
              value: ${AWS_REGION}
            - name: SINIESTROS_STORAGE_ROOT
              value: /var/lib/solventa/evidencias
          volumeMounts:
            - name: trabajo
              mountPath: /var/lib/solventa
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: trabajo
          emptyDir:
            sizeLimit: 64Mi
---
