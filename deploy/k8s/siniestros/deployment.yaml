# Variables: IMAGE (ej. <siniestros_ecr_repository_url>:<tag>), AWS_REGION
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siniestros
  namespace: siniestros
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: siniestros
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siniestros
    spec:
      serviceAccountName: siniestros
      # IRSA monta su propio token proyectado; el pod no necesita el de la API de Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: siniestros
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: siniestros-runtime
                  key: INTERNAL_API_TOKEN
            - name: SINIESTROS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: siniestros-runtime
                  key: SINIESTROS_DATABASE_URL
            - name: POLIZAS_SERVICE_URL
              value: http://polizas.polizas.svc.cluster.local:8080
            - name: AWS_REGION
              value: ${AWS_REGION}
            # terraform output siniestros_evidence_bucket. Sin bucket la evidencia
            # confirmada quedaria en el emptyDir y se perderia al reiniciar el pod.
            - name: SINIESTROS_EVIDENCIAS_BUCKET
              value: solventa-prod-siniestros-evidencias-976083331509
            - name: SINIESTROS_STORAGE_ROOT
              value: /var/lib/solventa/evidencias
          volumeMounts:
            - name: evidencias
              mountPath: /var/lib/solventa
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # Solo fragmentos de cargas en curso y temporales de descarga.
        - name: evidencias
          emptyDir:
            sizeLimit: 2Gi
