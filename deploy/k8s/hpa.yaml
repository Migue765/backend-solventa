# Requiere metrics-server (instalado por terraform).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cotizacion
  namespace: cotizacion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cotizacion
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
