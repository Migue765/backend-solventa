# Variable: IMAGE (ej. <notificaciones_ecr_repository_url>:<tag>)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
  namespace: notificaciones
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: notificaciones
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notificaciones
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notificaciones
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notificaciones-runtime
                  key: INTERNAL_API_TOKEN
            - name: NOTIFICACIONES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notificaciones-runtime
                  key: NOTIFICACIONES_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          # /ping no consulta la base: una caida de la base no reinicia el pod.
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
