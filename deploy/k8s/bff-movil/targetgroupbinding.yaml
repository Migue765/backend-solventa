# Variable: TARGET_GROUP_ARN (terraform output bff_movil_target_group_arn)
# Registra los pods como targets (tipo ip) del target group de bff-movil en el ALB interno.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: bff-movil
  namespace: bff-movil
spec:
  serviceRef:
    name: bff-movil
    port: 8080
  targetGroupARN: ${TARGET_GROUP_ARN}
  targetType: ip
