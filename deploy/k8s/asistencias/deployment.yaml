# Variable: IMAGE (ej. <asistencias_ecr_repository_url>:<tag>)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asistencias
  namespace: asistencias
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: asistencias
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asistencias
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: asistencias
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: asistencias-runtime
                  key: INTERNAL_API_TOKEN
            - name: ASISTENCIAS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asistencias-runtime
                  key: ASISTENCIAS_DATABASE_URL
            - name: POLIZAS_SERVICE_URL
              value: http://polizas.polizas.svc.cluster.local:8080
            - name: SINIESTROS_SERVICE_URL
              value: http://siniestros.siniestros.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
