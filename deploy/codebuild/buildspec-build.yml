# CodeBuild (build): pruebas, imagen amd64 y publicacion en ECR.
# Variables: ECR_REPOSITORY_URL, SERVICE_NAME, SERVICE_DIR (proyecto), COMMIT_ID (pipeline).
# SERVICE_NAME y SERVICE_DIR tienen por defecto cotizacion; el proyecto de CodeBuild los sobrescribe.
# Exporta IMAGE_TAG al despliegue.
version: 0.2

env:
  variables:
    SERVICE_NAME: cotizacion
    SERVICE_DIR: services/cotizacion
  exported-variables:
    - IMAGE_TAG

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet -r requirements-dev.txt -e "${SERVICE_DIR}[dev]"
  pre_build:
    commands:
      - ruff check "$SERVICE_DIR"
      - python -m pytest -q "$SERVICE_DIR/tests"
      - VERSION=$(python -c "import tomllib; print(tomllib.load(open('$SERVICE_DIR/pyproject.toml','rb'))['project']['version'])")
      - if [ "$SERVICE_NAME" = "perfilamiento" ]; then VERSION="perfilamiento-$VERSION"; fi
      - export IMAGE_TAG="${VERSION}-$(printf '%s' "$COMMIT_ID" | cut -c1-7)"
      - echo "Imagen $ECR_REPOSITORY_URL:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
  build:
    commands:
      - docker build --tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" "$SERVICE_DIR"
  post_build:
    commands:
      # Los tags de ECR son inmutables: repetir una version+commit falla a proposito.
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"

artifacts:
  files:
    - deploy/**/*
