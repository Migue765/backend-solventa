# CodeBuild (despliegue, dentro de la VPC): migraciones y rollout con rollback.
# Variables: CLUSTER_NAME, NAMESPACE, ECR_REPOSITORY_URL, SERVICE_NAME (proyecto), IMAGE_TAG (pipeline).
# SERVICE_NAME tiene por defecto cotizacion; el proyecto de CodeBuild lo sobrescribe.
# MIGRATE=false (opcional, definido por el proyecto) omite las migraciones.
version: 0.2

env:
  variables:
    SERVICE_NAME: cotizacion

phases:
  install:
    commands:
      - curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable-1.35.txt)/bin/linux/amd64/kubectl"
      - chmod +x /usr/local/bin/kubectl
      - command -v envsubst >/dev/null || (apt-get update -qq && apt-get install -y -qq gettext-base)
  build:
    commands:
      - bash deploy/codebuild/deploy.sh
