[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/services/bff-web/src",
    "$MYPY_CONFIG_FILE_DIR/services/cotizacion/src",
    "$MYPY_CONFIG_FILE_DIR/services/identidad/src",
    "$MYPY_CONFIG_FILE_DIR/services/perfilamiento/src",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["services/.*/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
