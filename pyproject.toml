[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["services/.*/migrations/"]

[[tool.mypy.overrides]]
module = ["test_profiling_flow", "test_dashboard_flow"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "services/bff-web/src",
    "services/identidad/src",
    "services/cotizacion/src",
    "services/perfilamiento/src",
]
addopts = "--import-mode=importlib"
