name: CI · Validación

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener política confiable del backport
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verificar excepción de sincronización exacta
        id: policy
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_SLUG: ${{ vars.BACKPORT_APP_SLUG }}
        with:
          script: |
            core.setOutput('skip_tests', 'false');
            try {
              const { verifyPull } = require('./.github/scripts/verified-backport.cjs');
              const pull = (await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number })).data;
              await verifyPull({ github, repo: context.repo, pull, appId: Number(process.env.APP_ID), appSlug: process.env.APP_SLUG });
              core.setOutput('skip_tests', 'true');
              core.info('Sincronización exacta: se reutiliza la evidencia de la entrega.');
            } catch {
              core.warning('Excepción no verificada; se ejecuta CI normal.');
            }

      - name: Obtener código
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js para las pruebas de automatización
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Probar automatización sin red
        id: automation
        if: steps.policy.outputs.skip_tests != 'true'
        run: node --test .github/scripts/*.test.cjs

      - name: Configurar Python
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/pyproject.toml

      - name: Instalar herramientas y servicios
        id: dependencies
        if: steps.policy.outputs.skip_tests != 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          for project in services/*/pyproject.toml; do
            [[ -f "$project" ]] || continue
            service_directory="$(dirname "$project")"
            python -m pip install -e "${service_directory}[dev]"
          done

      - name: Comprobar formato
        id: format
        if: steps.policy.outputs.skip_tests != 'true'
        run: python -m ruff format --check .

      - name: Ejecutar lint
        id: lint
        if: steps.policy.outputs.skip_tests != 'true'
        run: python -m ruff check .

      - name: Comprobar tipos
        id: types
        if: steps.policy.outputs.skip_tests != 'true'
        shell: bash
        run: |
          python -m mypy scripts tests
          for config in services/*/mypy.ini; do
            [[ -f "$config" ]] || continue
            service_directory="$(dirname "$config")"
            python -m mypy \
              --config-file "$config" \
              "$service_directory/src" \
              "$service_directory/tests"
          done

      - name: Validar contratos OpenAPI
        id: contracts
        if: steps.policy.outputs.skip_tests != 'true'
        run: python scripts/validate_openapi.py

      - name: Ejecutar pruebas
        id: tests
        if: steps.policy.outputs.skip_tests != 'true'
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest tests --junitxml=reports/root.xml
          for project in services/*/pyproject.toml; do
            [[ -f "$project" ]] || continue
            service_directory="$(dirname "$project")"
            if find "$service_directory/tests" -type f -name "test_*.py" -print -quit | grep -q .; then
              service="$(basename "$service_directory")"
              python -m pytest "$service_directory/tests" --junitxml="reports/$service.xml"
            fi
          done

      - name: Conservar informes de pruebas
        id: reports
        if: always() && steps.policy.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-test-reports
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar resumen de validación
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python -m scripts.ci_summary
