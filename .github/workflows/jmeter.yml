name: JMeter local integrado

on:
  workflow_dispatch:
    inputs:
      performance:
        description: Ejecutar adicionalmente 20 recorridos con umbrales de latencia locales
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jmeter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar servicios reales y herramientas
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          for project in services/*/pyproject.toml; do
            python -m pip install -e "$(dirname "$project")"
          done
          python -m tests.jmeter.install
      - name: Validar generador y evaluador
        run: python -m pytest tests/test_jmeter.py --junitxml=reports/jmeter-unit.xml
      - name: JMeter funcional sobre seis servicios reales
        run: python -m tests.jmeter.run --jmeter-home reports/tools/apache-jmeter-5.6.3
      - name: Rendimiento local opt-in (no certifica ASR)
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        run: >-
          python -m tests.jmeter.run --jmeter-home reports/tools/apache-jmeter-5.6.3
          --mode performance --iterations 20 --allow-load --output reports/jmeter-performance
      - name: Conservar evidencia sin cuerpos ni tokens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jmeter-local-evidence
          path: |
            reports/jmeter/*.jtl
            reports/jmeter/*.json
            reports/jmeter/*.jmx
            reports/jmeter-performance/*.jtl
            reports/jmeter-performance/*.json
            reports/jmeter-performance/*.jmx
            reports/jmeter-unit.xml
          if-no-files-found: warn
          retention-days: 14
